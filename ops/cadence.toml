# The daily drift check itself (SIG-OPS-005): one Cloud Scheduler trigger
# invokes the sig-probe job with its args overridden to `live-diff --alert` —
# the check rides the probe job's identity and alert path without a new job.
# (The trigger fires on the deployed image; until a fleet roll carries the
# live-diff verb its executions record honest failures — never masked.)
[live_diff]
scheduler = "sig-sched-live-diff"
cron = "30 11 * * *"             # daily 11:30 UTC — outside the 03:00-10:00Z batch band
job = "sig-probe"
# The trigger's POST body carries a RunJobRequest overrides payload whose
# containerOverrides[].args REPLACE the job's baked args — this exact JSON
# array is what scheduled-ops.sh embeds and what live-diff compares.
args = '["-c","exec sig-ops live-diff --live --alert"]'
note = "runs `sig-ops live-diff` (repo declaration vs live) daily; drift fires the recorded-alert seam (P34.4/ADR-077)"

# --- P35.1c (G1-TRIM B-13=a, ticket 291a): the hourly due dispatcher --------
#
# The single hourly trigger `sig-sched-due` fires the `sig-sched-due` Cloud Run
# job, which reads THIS file (the published declaration bundle in-image,
# SIG_OPS_DECLARED_GCS — a cadence change takes effect without an image roll,
# SIG-OPS-005), computes every `[[sources]]`/`[[batches]]` row whose cron last
# fired inside the window since the previous dispatch, and enqueues each due
# job (the Cloud Run `jobs:run` endpoint — the same call the retired per-row
# triggers made). Every evaluation appends a `sig.dispatch-due/1` run row under
# ops/runs/_dispatcher/; a run that evaluated no rows fails (SIG-ENG-042).
#
# Consolidation changes the trigger SHAPE only: the per-row cadence records
# above stay the scheduler of record's data, `state = "paused"` is the
# row-level pause lever the retired triggers' pause carried (R6 rows stay
# inert until their wave's resume leg flips the declaration), and a row's
# `scheduler` name now names its retired trigger on the retire list below.
[dispatcher]
job = "sig-sched-due"
scheduler = "sig-sched-due"
cron = "13 * * * *"            # hourly at :13 UTC — every declared row fires at
                               # :mm; the :13 dispatch covers the fire window
                               # since the previous dispatch (minute precision)
sa_class = "ingest"            # the iam_identities.toml class the job runs as
task_timeout = "30m"           # evaluate + enqueue is a bounded sweep, never a run
note = "one hourly trigger replaces the per-source trigger set; the job enqueues each due row's Cloud Run job and appends a sig.dispatch-due/1 run row"

# The per-source trigger retire list (the consolidation's name-checked set):
# every `[[sources]]`/`[[batches]]` scheduler name appears exactly once with
# disposition retired | kept-declared-pin — a trigger not listed here is never
# touched. `kept-manual` rows name the [[manual_jobs]] members so the list is
# complete: they carry no trigger by design and are never dispatcher-dispatched.
# live-diff reports a retired name still live as "declared retired but still
# live" until the consolidation leg's recorded delete lands.

