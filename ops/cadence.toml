# SPDX-License-Identifier: Apache-2.0
# SIG scheduled live operations (P26.1 / OPS.2). This file is DATA, not code —
# the operator-revisable record of which hosted targets the `sig-probe` sweep
# covers and which cadence each green live source runs on. `ops/gcp/
# scheduled-ops.sh --apply` realises exactly what is recorded here; the
# `sig-ops cadence` verb prints the resolved table and fails on drift.
#
# No secrets and no baked host literals (HG-09/HG-12): target URLs resolve from
# the job's environment first (`url_env`) — the run.app base URLs are resolved
# at apply time from `gcloud run services describe` — and `{project}` is filled
# from $SIG_GCP_PROJECT. The Cloud SQL target's DSN assembles from the standard
# SIG_PG_* + SIG_CLOUDSQL_CONNECTION env parts at run time (never a literal).

[probes]
job = "sig-probe"                # Cloud Run job name (same image as sig-ingest-*)
scheduler = "sig-sched-probe"    # Cloud Scheduler trigger
schedule = "0 */6 * * *"         # every 6h UTC — uptime accumulation cadence
gcs_prefix = "ops/probes"        # sweeps land at gs://…-sig-restricted/ops/probes/<date>/<ts>.jsonl

[[probes.targets]]
name = "sig-api-root"
kind = "http"
url_env = "SIG_PROBE_API_URL"    # the deployed read API base URL (no path)
path = "/"

[[probes.targets]]
name = "sig-api-coverage-okc"
kind = "http"
url_env = "SIG_PROBE_API_URL"
path = "/v1/coverage/okc"        # the §32.2 metrics surface over the real spine

[[probes.targets]]
name = "sig-web-root"
kind = "http"
url_env = "SIG_PROBE_WEB_URL"    # the public static site (nginx + GCS FUSE)
path = "/"

[[probes.targets]]
name = "sig-public-okc-manifest"
kind = "http"
url = "https://storage.googleapis.com/{project}-sig-public/okc/manifest.json"

[[probes.targets]]
name = "sig-public-france-manifest"
kind = "http"
url = "https://storage.googleapis.com/{project}-sig-public/france/manifest.json"

[[probes.targets]]
name = "sig-pg-cloudsql"
kind = "cloudsql"                # reachability only — SELECT 1 through the job's
                                 # mounted /cloudsql socket; DSN from env parts

[runs]
# Every scheduled ingest execution appends one run row here:
#   gs://…-sig-restricted/ops/runs/<source>/<date>/<ts>.json
# (source, mode, outcome, claims added, capture digests, refusal reason, and the
# embedded fetch record a manual `sig-connectors run` leaves — WORM, never
# read-modify-write.)
gcs_prefix = "ops/runs"

# --- per-source reingestion cadence ---------------------------------------------
# One [[sources]] row per GREEN source with live targets (`sig-connectors
# review-status` ∩ live_targets.toml — `sig-ops cadence --check` fails on drift).
# `cron` is Etc/UTC. `existing = true` marks a scheduler TRIGGER that already
# exists (muckrock, P25.7 d5): the trigger is verified, never recreated — but the
# run job is still upserted onto the `sig-ops scheduled-ingest` wrapper so its
# executions append ops/runs rows like every other source. `secrets` maps extra
# env vars to Secret Manager NAMES (never values, HG-09) that the source's live
# path needs beyond sig-pg-password. Sources whose current posture is a recorded
# refusal/disappearance (robots, WAF, eID) stay scheduled — the scheduled run's
# honest record IS the posture-change detector; nothing is ever retried into
# silence.

[[sources]]
id = "osm_overpass"
cadence = "weekly"               # OSM changes continuously (ticket spec)
cron = "12 4 * * 1"              # Monday 04:12 UTC
job = "sig-ingest-osm-overpass"
scheduler = "sig-sched-osm-overpass"
note = "OKC metro bbox over Overpass; ODbL compartment."

[[sources]]
id = "decp_fr"
cadence = "weekly"               # ticket spec (dataset index republishes)
cron = "12 4 * * 2"              # Tuesday 04:12 UTC
job = "sig-ingest-decp-fr"
scheduler = "sig-sched-decp-fr"
note = "data.gouv.fr dataset-API indirection; regenerated resource = new URL, removed = recorded link_rotted."

[[sources]]
