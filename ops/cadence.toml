# Declared bucket posture (the live-diff bucket leg): the four well-known
# buckets keyed by suffix on {project}. `public` asserts the allUsers
# objectViewer posture the compartment rules name (Part VIII: only the
# published bytes are world-readable — sig-web's public posture flips off
# under D-P34.3-1; sig-public stays public by design). `versioning` +
# `noncurrent_days` assert the P34.3 retention contract; absent fields are not
# compared (a row declares only what it means).
[[buckets]]
suffix = "sig-web"
public = false                   # allUsers removed by D-P34.3-1's queued leg
ubla = true                      # uniform bucket-level access — no ACL leakage
versioning = true
noncurrent_days = 30

[[buckets]]
suffix = "sig-public"
public = true                    # the published compartment — world-readable bytes by design
ubla = true
versioning = true
noncurrent_days = 30

[[buckets]]
suffix = "sig-restricted"
public = false                   # PRIVATE — non-published compartments + ops rows
ubla = true
versioning = true
noncurrent_days = 90

[[buckets]]
suffix = "sig-backups"
public = false                   # PRIVATE — pg dumps + OCFL backup sync
ubla = true
# versioning/lifecycle on sig-backups is the queued D-P34.6-3 leg — not declared here.
