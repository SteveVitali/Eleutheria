#
# sig-web — the P36.19 strict response layer (UXK0-3, K0 §4.8, SIG-UI-096,
# ADR-223). A committed static fragment (no envsubst) shipped at
# /etc/nginx/sig-security.conf and `include`d at server scope and inside every
# location that declares its own add_header — nginx's inheritance drops the
# server-level set there, the same rule sig-headers.conf exists for.
#
# The CSP half of the meta ∩ header split: a static host cannot name the
# per-page inline bootstrap hashes (the Astro <meta> carries those — the
# authoritative per-document policy), so the header holds only the
# meta-inexpressible + hash-independent guards and NEVER a default-src or
# script-src (a 'self' there would deny the hashed inline bootstrap the meta
# lawfully allows). $sig_csp maps a standalone .svg response — under ANY
# tree, /r/ /s/ or the latest view — to K0 §4.8's dedicated figure policy;
# $sig_permissions_policy maps /map/ to the sole geolocation=(self) route.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Content-Security-Policy "$sig_csp" always;
add_header Permissions-Policy "$sig_permissions_policy" always;
add_header X-Content-Type-Options "nosniff" always;
