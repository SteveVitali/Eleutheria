#
# The sig-web nginx configuration (P31.15 / SURFACE.2, ADR-R9-TILES). Replaces the
# stock config in ops/web/Dockerfile's nginx:1.27.5-alpine runtime base. The site
# root is /mnt/sig-web — the gcsfuse mount of the <project>-sig-web bucket
# (P30.3: "the bucket sync IS the deploy"), so each publish swaps bytes in place
# under the same paths: pages + JSON revalidate on every load, only Astro's
# content-hashed build assets are immutable.
#
# Compression: gzip + Brotli for the TEXT types (JSON/CSS/HTML/SVG + the island
# JS), never for application/vnd.pmtiles — the archive's tiles are already
# gzip-compressed and double-compression would only burn CPU. Brotli modules are
# compiled against the exact nginx version in the Dockerfile (Alpine's
# nginx-mod-http-brotli targets a different nginx and cannot be loaded).

load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    # Registered media type for the per-compartment tile archives (RFC 8260-era
    # registration): never served as a generic octet-stream guess.
    types {
        application/vnd.pmtiles pmtiles;
        application/geo+json geojson;
    }
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    server_tokens off;
    charset utf-8;

    # Behind the external HTTPS LB: relative redirects only (no absolute
    # scheme+host rewrites that could leak a run.app origin).
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    # text/html is always gzip-eligible implicitly; application/vnd.pmtiles is
    # deliberately NOT listed.
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/geo+json
        application/javascript
        application/manifest+json
        application/xml
        image/svg+xml;

    brotli on;
    brotli_comp_level 5;
    brotli_min_length 256;
    brotli_types
        text/plain
        text/css
        text/xml
        application/json
        application/geo+json
        application/javascript
        application/manifest+json
        application/xml
        image/svg+xml;
    # Serve a committed .br sibling if the bucket ever carries one.
    brotli_static on;

    server {
        listen 8080;
        server_name _;
        root /mnt/sig-web;
        index index.html;

        # Astro's static 404 page.
        error_page 404 /404.html;

        # Static GET/HEAD responses carry `Accept-Ranges: bytes` natively — the
        # pmtiles:// client's range fetches depend on it; nothing below disables
        # or strips it.

        # Astro's content-hashed build assets: safe to cache immutably forever.
        location /_astro/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # The per-compartment PMTiles archives: byte-range static objects,
        # revalidated on publish (bytes change in place under the same path).
        location /tiles/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=300, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Everything else — HTML pages and the web/*.json artifacts: revalidate
        # every load; each publish swaps bytes in place.
        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }
}
