#
# sig-web — the public nginx edge (the Cloud Run service; the composed
# stack's `web` service) — RELEASE-LAYOUT TEMPLATE.
#
# P35.54 (REL-03b, SIG-REL-006, ADR-220): this file is the G3 §4.2 envsubst
# template — NOT a runnable config. At container start
# `docker-entrypoint.d/40-sig-conf.sh` substitutes exactly
#   ${SIG_LATEST_PUB}   the latest pointer's p-<64hex> (latest-view root)
#   ${SIG_LATEST_LABEL} its sig-YYYY-MM-DD.N (the X-SIG-Release pair)
#   ${SIG_CONF_GEN}     the configuration generation the revision serves
#   ${SIG_STAGING}      "1" on the IAM-only staging origins, "0" in public
#   ${SIG_ROBOTS_TAG_LINE} the noindex directive on staging, empty otherwise
# — every other `$name` stays literal (the explicit envsubst list is the
# guard). A revision renders exactly one {latest, conf_gen, staging} triple
# — the immutable serving config, every instance of the revision agrees
# (G3 NEW-4's fix). With no release env the entrypoint copies
# `nginx-legacy.conf` verbatim (the dark cutover roll is a later row's
# leg — ADR-220 D1).
#
# Layout (G3 §4.1/§4.2): the release bucket mounts at /mnt/rel —
#   /mnt/rel/staged/{r,v,s,releases}/<pub>/   the private release trees
#   /mnt/rel/staged/conf/                    generated serving fragments
#                                            (chrome/terms/renamed + the
#                                            tombstone bodies)
#   /mnt/rel/registry/conf/<gen>/            the configuration generation
#                                            this revision serves
# The promoted map gates the immutable namespaces (`default 0` — an
# unpromoted namespace 404s by construction); the latest view is a root.
# Promotion is metadata-only: a new conf/<gen+1> + a new revision env.

load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    types {
        application/vnd.pmtiles pmtiles;
        application/geo+json geojson;
    }
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    server_tokens off;
    charset utf-8;
    # Cloud Run terminates TLS in front and preserves the client port, so the
    # default scheme+port redirect would leak :8080 (P34.3 fix — keep it).
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/csv
        application/json
        application/geo+json
        application/javascript
        image/svg+xml;
    gzip_static on;

    brotli on;
    brotli_static on;
    brotli_comp_level 6;
    brotli_types
        text/plain
        text/css
        text/csv
        application/json
        application/geo+json
        application/javascript
        image/svg+xml;

    # The promoted map's keys are `p-<64hex>` (66 bytes) — the default
    # hash bucket is too small for them.
    map_hash_bucket_size 128;

    # --- G3 §4.2: the promoted-set gate ------------------------------------
    # $uri_pub = the p-<64hex> publication id a request names under the
    # release namespaces; "" for everything else (the latest view, the
    # generated /releases/ index set, healthz — never gated).
    map $uri $uri_pub {
        default "";
        # p-<hex> extraction — the regexes stay unquoted: `~"…"` parses
        # but never matches inside a map block, and a `{64}` quantifier is
        # a block opener either way. The shape is deliberately loose — a
        # malformed or unpromoted pub is `default 0` → 404 regardless.
        ~^/r/(?<pub>p-[0-9a-f]+) $pub;
        ~^/s/(?<pub>p-[0-9a-f]+) $pub;
        ~^/releases/(?<pub>p-[0-9a-f]+) $pub;
    }

    # The promoted set, per configuration generation — read at start so
    # every instance of a revision agrees (NEW-4). `default 0` + the
    # $deny_gate concat below is the SIG-REL-002 gate *by construction*:
    # an unpromoted namespace 404s; there is no request path that reaches
    # the bytes. `sig-ops release promote` writes this file whole into
    # conf/<gen+1> — carried set + the new pub (metadata-only promotion).
    map $uri_pub $promoted {
        default 0;
        include /mnt/rel/registry/conf/${SIG_CONF_GEN}/promoted.map;
    }

    # --- P36.19 (UXK0-3, K0 §4.8, SIG-UI-096, ADR-223): the response policy
    # maps sig-security.conf interpolates. $sig_csp — the header half of the
    # strict CSP split: hash-independent guards for every response, and a
    # standalone .svg gets K0 §4.8's dedicated figure policy verbatim
    # (scriptless sandboxed document; the figure's OWN <style> elements and
    # data: rasters permitted). The map keys on the REQUEST, so the policy
    # follows the bytes under /r/, /s/ and the latest view alike — never
    # bolted to a location block.
    map $uri $sig_csp {
        ~*\.svg$ "default-src 'none'; style-src 'unsafe-inline'; img-src data:; sandbox";
        default "frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; script-src-attr 'none'; style-src-attr 'none'";
    }
    # $sig_permissions_policy — least-power capabilities. /map/ is the one
    # surface the geolocation prompt can ever make sense on (ADR-156); every
    # other URI gets the deny set.
    map $uri $sig_permissions_policy {
        ~^/map(/|$) "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=(), browsing-topics=()";
        default "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=(), browsing-topics=()";
    }

    server {
        listen 8080;
        server_name _;

        # The latest view — one immutable tree per release; the pointer
        # flip is an env change, atomic per revision.
        root /mnt/rel/staged/v/${SIG_LATEST_PUB};
        index index.html;

        # The staging flag renders into the config at start (GT-9): "1" on
        # the IAM-only staging origins, "0" in public. $deny_gate =
        # "${promoted}${sig_staging}" — "00" means unpromoted AND
        # non-staging → 404; staging never gates.
        set $sig_staging "${SIG_STAGING}";
        set $deny_gate "${promoted}${sig_staging}";

        error_page 404 /404.html;
        # The per-route sig.tombstone/1 bodies (P34.41) are served via the
        # internal /conf/tombstone/ location below — generated deny lines
        # (`location = /… { error_page 410 /conf/tombstone/<hash>.html;
        # return 410; }`) carry verbatim across generations.

        # The configuration generation — every file immutable once served
        # (NEW-7), written whole by the release tool (C4 NEW-10). The deny
        # barrier's `location =` entries evaluate before the prefix
        # locations below regardless of position.
        include /mnt/rel/registry/conf/${SIG_CONF_GEN}/withdrawn.conf;
        include /mnt/rel/registry/conf/${SIG_CONF_GEN}/selectors.conf;
        include /mnt/rel/registry/conf/${SIG_CONF_GEN}/labels.conf;

        # The carried fragment surface (D-P34.13-1's branded error_page
        # wiring lands unchanged — `sig-ops web-conf` generates into
        # <staged>/conf/; absent globs are no-ops). The release_*.conf glob
        # retires here: X-SIG-Release is env-rendered per §4.2/§6.3.
        include /mnt/rel/staged/conf/chrome_*.conf;
        include /mnt/rel/staged/conf/terms_*.conf;
        include /mnt/rel/staged/conf/renamed_*.conf;

        # §6.3 provenance pair on EVERY response (errors too — `always`)
        # and the P36.19 strict response layer (HSTS / CSP map /
        # Permissions-Policy map / nosniff — sig-security.conf) beside it.
        # The includes repeat the add_header sets; a location declaring its
        # own add_header inherits none from `server`, so both includes are
        # repeated per location — never hand-drifted copies.
        include /etc/nginx/sig-headers.conf;
        include /etc/nginx/sig-security.conf;

        # Immutable release namespaces — private staged trees, gated by the
        # promoted map. Every byte revalidates: a withdrawal may deny them.
        location /r/ {
            root /mnt/rel/staged;
            if ($deny_gate = "00") { return 404; }
            try_files $uri $uri/ =404;
            add_header Cache-Control "public, max-age=300, must-revalidate" always;
            include /etc/nginx/sig-headers.conf;
            include /etc/nginx/sig-security.conf;
        }
        location /s/ {
            root /mnt/rel/staged;
            if ($deny_gate = "00") { return 404; }
            try_files $uri $uri/ =404;
            add_header Cache-Control "public, max-age=300, must-revalidate" always;
            include /etc/nginx/sig-headers.conf;
            include /etc/nginx/sig-security.conf;
        }

        # The release-index surfaces live in the conf generation — the
        # release tool is their only generator (C4 NEW-10); the index names
        # label→pub pairs incl. never-promoted labels (§3.1). The URL
        # structure mirrors conf/<gen>/releases/, so `root` maps it
        # directly (an `alias`+`index` pair would 500 on the dir request).
        location = /releases { return 301 /releases/; }
        location = /releases/ {
            root /mnt/rel/registry/conf/${SIG_CONF_GEN};
            try_files $uri $uri/ =404;
            include /etc/nginx/sig-headers.conf;
            include /etc/nginx/sig-security.conf;
        }
        location = /releases/index.html {
            root /mnt/rel/registry/conf/${SIG_CONF_GEN};
            try_files $uri =404;
            include /etc/nginx/sig-headers.conf;
            include /etc/nginx/sig-security.conf;
        }
        location = /releases/catalog.json {
            root /mnt/rel/registry/conf/${SIG_CONF_GEN};
            try_files $uri =404;
            include /etc/nginx/sig-headers.conf;
            include /etc/nginx/sig-security.conf;
        }
        location = /releases/latest.json {
            root /mnt/rel/registry/conf/${SIG_CONF_GEN};
            try_files $uri =404;
            include /etc/nginx/sig-headers.conf;
            include /etc/nginx/sig-security.conf;
        }
        # Per-pub landings (/releases/<pub>/*) — gated like /r/ and /s/.
        location /releases/ {
            root /mnt/rel/staged;
            if ($deny_gate = "00") { return 404; }
            try_files $uri $uri/ =404;
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
            include /etc/nginx/sig-headers.conf;
            include /etc/nginx/sig-security.conf;
        }

        # The per-route sig.tombstone/1 bodies the withdrawn map's
        # error_page 410 targets — internal only, never a public route.
        # The provenance pair still rides the 410 body (§6.3), the strict
        # layer beside it.
        location /conf/tombstone/ {
            internal;
            alias /mnt/rel/staged/conf/tombstone/;
            include /etc/nginx/sig-headers.conf;
            include /etc/nginx/sig-security.conf;
        }

        # The latest view — hashed bundles immutable; everything else
        # revalidates (the /entity/ stubs live in this tree; their denies
        # arrive through withdrawn.conf + /conf/tombstone/).
        location /_astro/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/sig-headers.conf;
            include /etc/nginx/sig-security.conf;
        }
        # The per-compartment PMTiles archives: byte-range static objects.
        # P35.52 (sig.map-tiles/2, ADR-156): archive names carry the content
        # hash (`*-sites.<sha8>.pmtiles`), so a hashed archive is immutable —
        # bytes never change under its path — while index.json and any
        # pre-v2 un-hashed name still revalidate on publish (D12).
        # (quoted — nginx config syntax treats {} as block braces unquoted)
        location ~ "^/tiles/.*-sites\.[0-9a-f]{8}\.pmtiles$" {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/sig-headers.conf;
            include /etc/nginx/sig-security.conf;
        }
        location /tiles/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=300, must-revalidate" always;
            include /etc/nginx/sig-headers.conf;
            include /etc/nginx/sig-security.conf;
        }

        # Convenience latest-view stubs — explicitly mutable, never citations.
        location /entity/ {
            try_files $uri $uri/ =404;
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
            include /etc/nginx/sig-headers.conf;
            include /etc/nginx/sig-security.conf;
        }

        # Everything else under the latest view — /entity/ stubs included.
        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            include /etc/nginx/sig-headers.conf;
            include /etc/nginx/sig-security.conf;
        }
    }
}
