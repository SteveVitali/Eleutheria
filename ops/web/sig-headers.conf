#
# sig-web — the §6.3 provenance-header snippet (P35.54, REL-03b, ADR-220 D1).
#
# Rendered by docker-entrypoint.d/40-sig-conf.sh alongside nginx.conf, then
# `include`d inside the server block and inside every location that
# declares its own add_header — nginx's inheritance drops the server-level
# set in any location with its own add_header, so the rendered set lives in
# one file and every location includes it verbatim.
#
# `always` attaches the pair to error responses too (§6.3). The
# ${SIG_ROBOTS_TAG_LINE} renders `add_header X-Robots-Tag "noindex" always;`
# on the staging origins (GT-9) and nothing in public.

add_header X-SIG-Release "${SIG_LATEST_LABEL} ${SIG_LATEST_PUB}" always;
add_header X-SIG-Conf-Gen "${SIG_CONF_GEN}" always;
${SIG_ROBOTS_TAG_LINE}
