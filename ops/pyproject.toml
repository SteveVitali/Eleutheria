[project]
name = "sig-ops"
version = "0.1.0"
description = "SIG ops: runtime composition of the PG spine + API + static site (P21.4, ADR-066)."
requires-python = ">=3.11"
# The runtime composition orchestrates the claim spine (sig-db claim sink for
# `seed`) and the read API (`sig-api serve`, launched as a host process). psycopg
# is the client driver for the health check + seed writes.
dependencies = [
    "sig-db",
    "sig-api",
    "psycopg[binary]>=3.2",
    # P21.5: the Software Heritage "save code now" request (SIG-GOV-022) speaks HTTP
    # over httpx (already in the workspace); no token needed for public repos.
    "httpx>=0.27",
]

[project.scripts]
sig-ops = "ops.cli:main"

[tool.uv.sources]
sig-db = { workspace = true }
sig-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops"]
