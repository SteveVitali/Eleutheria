[project]
name = "sig-ops"
version = "0.1.0"
description = "SIG ops: runtime composition of the PG spine + API + static site (P21.4, ADR-066)."
requires-python = ">=3.11"
# The runtime composition orchestrates the claim spine (sig-db claim sink for
# `seed`) and the read API (`sig-api serve`, launched as a host process). psycopg
# is the client driver for the health check + seed writes.
dependencies = [
    "sig-db",
    "sig-api",
    # P26.1 (OPS.2): `sig-ops scheduled-ingest` wraps the gated live connector run
    # (connectors.runner.run_source) so scheduled runs are identical to manual ones.
    "sig-connectors",
    # P27.8 (LAUNCH.8): the public cut-over partitions the export by licence compartment
    # (published vs restricted) using the share-alike facts in policy/data/licenses.toml.
    "sig-policy",
    # P32.6 (SIG-TRUST-007): evidence-audit reads the mounted OCFL capture root
    # (evidence.ocfl.OcflStore + evidence.digest multihash) and validates the
    # typed locators the parsing contract defines (SIG-PARSE-003).
    "sig-evidence",
    "sig-parsing",
    # P32.13 (SIG-FIND-001/002, ADR-132): the release-serving barrier reuses
    # the exports release tooling (staged-tree withdrawal application +
    # route access check) so the serving layer never defines a second rule.
    "sig-exports",
    "psycopg[binary]>=3.2",
    # P21.5: the Software Heritage "save code now" request (SIG-GOV-022) speaks HTTP
    # over httpx (already in the workspace); no token needed for public repos.
    "httpx>=0.27",
]

[project.scripts]
sig-ops = "ops.cli:main"

[tool.uv.sources]
sig-db = { workspace = true }
sig-api = { workspace = true }
sig-connectors = { workspace = true }
sig-policy = { workspace = true }
sig-evidence = { workspace = true }
sig-parsing = { workspace = true }
sig-exports = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops"]
