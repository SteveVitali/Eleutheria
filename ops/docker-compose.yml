#
# The SIG local runtime composition (P21.4, deliverable 1; ADR-066).
#
# This is the zero-cost, one-small-machine staging posture (SIG-STORE-003): no
# cloud-specific config, everything runs on a laptop with Docker. It owns the
# stateful, containerised piece of the stack — the PG18+PostGIS claim spine with
# the real sqitch plan deployed on start (§20.4, §48, SIG-STORE-024/041). The API
# (uvicorn) and the static server for `web/dist` are launched by `sig-ops up` as
# host processes (the HG-12 local-staging default: uvicorn + `astro preview`), so
# they run the *host's* Python/Node toolchain and code at HEAD without baking a
# platform-specific image. `sig-ops down` stops this compose project AND those host
# processes, so nothing is left running (the AC: "down leaves no containers").
#
# All ports/name are pinned to the `sig` compose project so a worktree's stack is
# isolated and `docker compose -p sig down -v` is a complete teardown.

name: sig

services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: ${SIG_PG_USER:-sig}
      POSTGRES_PASSWORD: ${SIG_PG_PASSWORD:-sig}
      POSTGRES_DB: ${SIG_PG_DB:-sig}
    ports:
      - "${SIG_PG_PORT:-5432}:5432"
    volumes:
      # PG18 places its data in a version subdir; mount the parent so the image's
      # pg_upgrade-friendly layout is honoured (docker-library/postgres#37).
      - sig_pg_data:/var/lib/postgresql
    healthcheck:
      # `-h 127.0.0.1` forces TCP: the entrypoint's bootstrap server listens on
      # the unix socket only, so a socket-only pg_isready reports "healthy"
      # during initdb and releases sqitch into a refused TCP connect (P34.40).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${SIG_PG_USER:-sig} -d ${SIG_PG_DB:-sig}"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # One-shot: deploy the canonical sqitch plan into the spine, then exit 0.
  # Re-running is idempotent (sqitch only deploys pending changes), so `sig-ops up`
  # is safe to call repeatedly. The whole `db/` dir is mounted read-only.
  sqitch:
    # P34.24a / ADR-196: digest-pinned — never a mutable tag.
    image: sqitch/sqitch@sha256:f247ab0e0b66e9c2d09a400864f7314358893f5cf209cddcc4f213f7d5bfe4d3
    depends_on:
      db:
        condition: service_healthy
    working_dir: /repo
    volumes:
      - ../db:/repo:ro
    command:
      - deploy
      - db:pg://${SIG_PG_USER:-sig}:${SIG_PG_PASSWORD:-sig}@db:5432/${SIG_PG_DB:-sig}
    restart: "no"

  # The AUTHENTICATED curation service (P21.6, ADR-068). It is a SECOND API process,
  # deliberately separate from the public read API and NEVER world-reachable: it is
  # published only to 127.0.0.1 (the `127.0.0.1:` host-IP prefix binds the port to
  # loopback, not 0.0.0.0) and gated on SIG_CURATION_ENABLED=1 (RISK-P21-10, Part VIII
  # §0.7). `sig-ops up` runs it as a host process by default (host toolchain at HEAD,
  # matching the read API); this service is the containerised alternative and stays in
  # the `curation` compose profile so it is only started when explicitly requested.
  api-curation:
    profiles: ["curation"]
    image: python:3.12-slim
    depends_on:
      db:
        condition: service_healthy
    environment:
      SIG_CURATION_ENABLED: "1"
      SIG_STAGING_DSN: pg://${SIG_PG_USER:-sig}:${SIG_PG_PASSWORD:-sig}@db:5432/${SIG_PG_DB:-sig}
    working_dir: /repo
    volumes:
      - ..:/repo:ro
    # Bind to loopback only — the curation surface is authenticated and non-public.
    ports:
      - "127.0.0.1:${SIG_CURATION_PORT:-8001}:8001"
    command:
      - sh
      - -c
      - "pip install -e . && sig-api serve-curation --host 0.0.0.0 --port 8001"
    restart: unless-stopped

  # --- the composed serving topology (P34.40 / ACT-17, G3 §4.3) ---------------
  # The `serving` profile stands the production serving shape up locally:
  # the real `sig-web` image (ops/web/Dockerfile) over a staged site dir
  # ($SIG_SITE_ROOT → /mnt/sig-web — the same path the gcsfuse mount uses), the
  # real `sig-api` image (ops/Dockerfile) with the release registry mounted
  # read-only at /mnt/rel/registry ($SIG_RELEASE_REGISTRY — the path its CMD
  # conditionalises `--release-registry` on), the deliberately NON-OPERATIONAL
  # intake receiver (SIG_INTAKE_ENABLED mounts it; [intake].operational stays
  # false, so it answers `503 receiver_not_operating`), and an nginx `edge`
  # service running ops/edge.conf — the committed render of ops/lb_routes.toml
  # that stands in for the external HTTPS LB's path rules (/v1* → api,
  # /intake* → intake, everything else → web; nginx never proxies to Cloud
  # Run in production — the edge mimics the URL map, not a proxy chain).
  #
  #   SIG_SITE_ROOT=<staged-site> SIG_RELEASE_REGISTRY=<registry> \
  #     docker compose --profile serving up -d --build
  #
  # The edge publishes on loopback ${SIG_EDGE_PORT:-18090} (the canonical-origin
  # stand-in); `web` also publishes ${SIG_WEB_PORT:-18091} as the run.app
  # stand-in so `sig-ops route-compare` can byte-compare both postures.
  web:
    profiles: ["serving"]
    build:
      context: ..
      dockerfile: ops/web/Dockerfile
    volumes:
      # A default (not a :? guard) — the profile-free `sig-ops up/down` parse
      # the whole file and must not fail on an unset serving var. An unset
      # default mounts an empty dir: nginx answers 404s, the operator's miss
      # is visible, never silent (the runbook/e2e always set SIG_SITE_ROOT).
      - "${SIG_SITE_ROOT:-/tmp/sig-serving-site}:/mnt/sig-web:ro"
    ports:
      - "127.0.0.1:${SIG_WEB_PORT:-18091}:8080"
    restart: unless-stopped

  api:
    profiles: ["serving"]
    build:
      context: ..
      dockerfile: ops/Dockerfile
    volumes:
      # Same default-not-guard rationale as SIG_SITE_ROOT above; an absent
      # registry dir means the image CMD omits --release-registry entirely.
      - "${SIG_RELEASE_REGISTRY:-/tmp/sig-serving-registry}:/mnt/rel/registry:ro"
    restart: unless-stopped

  intake:
    profiles: ["serving"]
    build:
      context: ..
      dockerfile: ops/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      sqitch:
        condition: service_completed_successfully
    environment:
      SIG_INTAKE_ENABLED: "1"
    command:
      - sh
      - -c
      - "sig-api serve-intake --host 0.0.0.0 --port 8080 --dsn postgresql://${SIG_PG_USER:-sig}:${SIG_PG_PASSWORD:-sig}@db:5432/${SIG_PG_DB:-sig} --ops-config /app/ops/config.toml"
    restart: unless-stopped

  edge:
    profiles: ["serving"]
    image: nginx:1.27.5-alpine
    depends_on:
      - web
      - api
      - intake
    volumes:
      - ./edge.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${SIG_EDGE_PORT:-18090}:8080"
    restart: unless-stopped

volumes:
  sig_pg_data:
