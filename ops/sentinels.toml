# SPDX-License-Identifier: Apache-2.0
# THE committed fixture/placeholder sentinel table (P35.3 — G10's
# fixture-sentinel scan, SIG-OPS-012 + DRAFT-OPS-2; the claim-marker binding is
# DR-C3-03). One file declares:
#
#   [[sentinel]]    the fixture/placeholder markers no production/public
#                   surface may carry — literal or regex, with a `kind="rule"`
#                   for the structural legs (an undisclosed stand-in capture,
#                   an unregistered contact domain).
#   [[compartment]] the DECLARED fixture compartments: a sentinel hit inside
#                   one passes only when the compartment's `allow` list names
#                   that sentinel (or "all"); a hit anywhere else fails the
#                   gate. An undeclared compartment never exempts — the reason
#                   (and any owed `debt` id) is committed with the declaration.
#   [contact_registry] + registered_domains — the source-registry contact
#                   fields and the real, disclosed domains. A contact value
#                   naming any other domain is an unregistered/placeholder
#                   contact-domain hit (`sig-project.org` et al.).
#   [[claim_marker]] the human-completion claim markers (DR-C3-03): an
#                   assertion phrase counts only where a recorded
#                   human-completion marker exists — `marker:<path>` in the
#                   same file resolving under [markers]. An agent label is
#                   never a human label.
#
# `sig-ops sentinel-scan` / `claim-marker-scan` consume this table and emit
# `sig.probe-run/1` records; docs/build/tools/check_round_close.py's tail leg
# requires those records fresh and non-vacuous at the round tail (ADR-199).
schema = "sig.sentinels/1"

# Sibling keys that disclose a `capture_kind: stand-in` declaration. A stand-in
# capture without one is the undisclosed-stand-in sentinel hit.
# `standin_disclosure_keys` — an explicit non-empty disclosure field;
# `standin_posture_keys` — a capture-posture field that discloses only when its
# value is itself stand-in-shaped (the P34.22b vocabulary's `acquisition:
# "stand_in"`, rendered to readers by the dossier pages).
standin_disclosure_keys = ["disclosure", "stand_in_disclosure", "disclosed", "fixture_disclosure"]
standin_posture_keys = ["acquisition"]

# ── Sentinels ─────────────────────────────────────────────────────────────────

[[sentinel]]
id = "sig-example-domain"
kind = "literal"
pattern = "sig.example"
note = "the retired placeholder domain — never a production/public surface"

[[sentinel]]
id = "example-test-tld"
kind = "regex"
pattern = '\bexample\.(test|invalid|localhost)\b'
note = "RFC 2606 reserved example TLDs (test/invalid/localhost) — documentation placeholders that must never ship"

[[sentinel]]
id = "fixture-token"
kind = "literal"
pattern = "_FIXTURE"
note = "the fixture-data token"

[[sentinel]]
id = "demo-marker"
kind = "regex"
pattern = '\bdemo_[A-Za-z0-9_]'
note = "demo_-prefixed specimen entity ids"

[[sentinel]]
id = "reviewer-placeholder"
kind = "regex"
pattern = '\bReviewer [A-Z]\b'
note = "Reviewer A/B placeholder reviewer names"

[[sentinel]]
id = "loopback-url"
kind = "regex"
pattern = '(https?://)?\b(127\.0\.0\.1|0\.0\.0\.0|localhost|\[::1\])(:[0-9]{2,5})?\b'
note = "loopback addresses in a production/public context"

[[sentinel]]
id = "sig-project-domain"
kind = "literal"
pattern = "sig-project.org"
note = "the unregistered placeholder contact domain (et al. — the contact-domains leg checks the whole class, not just this literal)"

[[sentinel]]
id = "fixture-iri"
kind = "regex"
pattern = '\bhttps?://fixture(/|\b)'
note = "a `https://fixture/…` placeholder IRI — a stand-in record's honest self-label that still must never appear outside a declared compartment"

[[sentinel]]
id = "standin-undisclosed"
kind = "rule"
pattern = "capture-kind-standin-disclosure"
note = "capture_kind: stand-in without a sibling disclosure — a rule leg, not a text pattern"

# ── Declared fixture compartments ─────────────────────────────────────────────
#
# Each entry: the paths it governs (repo-relative globs, or scan-root-relative
# when scanning an out-of-tree artifact), the sentinels it allows there, and
# the committed reason. `debt` names a DEFERRALS row when the exemption covers
# owed remediation — the scanner verifies the id exists in
# docs/tickets/DEFERRALS.md so an exemption is never a silent hole.

[[compartment]]
id = "tests-fixtures"
paths = ["tests/**"]
allow = ["all"]
reason = "the committed test-fixture tree — fixture material lives here by declaration"

[[compartment]]
id = "curate-loopback"
paths = ["web/dist/curate/**", "dist/curate/**", "curate/**"]
allow = ["loopback-url"]
reason = "ADR-068 — /curate is the declared loopback-only authenticated curation surface; the baked 127.0.0.1:8001 default is the design, not fixture leakage"

[[compartment]]
id = "watch-feed-uid"
paths = ["web/dist/watch/**", "dist/watch/**", "watch/**"]
allow = ["sig-example-domain"]
reason = "watch-feed event UIDs stamp @sig.example (web/src/lib/watch.ts) — the placeholder domain reaches the public .ics/.xml artifacts; the owed fix is recorded, not hidden"
debt = "D-P35.3-1"

[[compartment]]
id = "visual-language-demo"
paths = ["web/dist/visual-language/**", "dist/visual-language/**", "visual-language/**"]
allow = ["demo-marker"]
reason = "the internal epistemic visual-language reference page exhibits demo_* specimen entities as its declared exhibit material"

[[compartment]]
id = "research-dossier-standin"
paths = ["web/dist/research-dossier/**", "dist/research-dossier/**", "research-dossier/**"]
allow = ["fixture-iri"]
reason = "the research dossier's disclosed stand-in assertions carry https://fixture/ IRIs — the page renders the stand-in capture posture to readers (the P34.22b/P34.35 disclosure vocabulary); the IRI is the disclosure, not a hidden placeholder"

[[compartment]]
id = "sources-demo-entries"
paths = ["web/dist/sources/**", "dist/sources/**", "sources/**"]
allow = ["example-test-tld"]
reason = "the /sources index carries visibly-labelled demonstration entries (demo-portal/demo-registry, example.invalid) for the terms-licence display — whether a demo entry belongs on the public registry is the owning row's call"
debt = "D-P35.3-2"

# ── Contact domains ───────────────────────────────────────────────────────────
#
# The source registry's contact fields are read and every domain they carry is
# checked against registered_domains — the real, disclosed domains. Any other
# domain (a `sig-project.org`-class placeholder) is an unregistered
# contact-domain hit.

[contact_registry]
sources = ["connectors/src/connectors/data/sources.toml"]
fields = ["contact", "contact_email", "rights_contact", "compact_contact", "legal_contact"]

registered_domains = [
    "eyesonflock.com",        # the eyes-on-flock source's real published contact (sources.toml)
    "surveillancegraph.org",  # the project's own public domain (connectors/net.py's collection-contact URL)
]

# ── Human-completion claim markers (DR-C3-03) ─────────────────────────────────
#
# `assert` patterns mark a statement asserting human completion; `safe`
# patterns mark honest disclosures of absence ("not yet run", "pending",
# status fields). An assertion hit passes only when the same file carries a
# `marker:<path>` citation resolving to a valid marker record (see [markers]).

[[claim_marker]]
id = "human-verified"
assert = ['\bhuman[- ]verified\b']
safe = [
    '\bnot human[- ]verified\b',
    '\bno human[- ]verified\b',
    'human[- ]verified marker',
    "'human[- ]verified'",
    '`human[- ]verified`',
]

[[claim_marker]]
id = "reviewed-badge"
assert = ['\bReviewed\b']
safe = [
    '\bReviewer\b',
    '\bReviewed (not yet|pending|required|by an? (agent|bot)|status)\b',
    '\b[Nn]ot [Rr]eviewed\b',
    '\bunreviewed\b',
    '\bReviewed: (pending|not|none)\b',
]

[[claim_marker]]
id = "independent-review"
assert = ['\bindependent review\b', '\bindependently reviewed\b']
safe = [
    'independent review not yet run',
    'independent review[ \u2014:—-]*(pending|required|not run|has not run|is required|needed|owed|absent)',
    '\bno independent review\b',
    'independent review\W*(not|never|unrun|without)',
    '\bnot independently reviewed\b',
    'independent review.{0,20}(not yet|not run|pending|required)',
    # J3 §5.2's verbatim disclosure wording for an unreviewed claim
    # (`review_status` not_run renders "Not yet independently reviewed" on
    # P35.36's provenance panel) — a negation disclosure, never a review claim.
    '[Nn]ot yet independently reviewed\b',
]

# A recorded human-completion marker is a committed file under `record_glob`
# carrying every `required` token — including a `reviewer:` line naming a
# human. A `reviewer:` value matching `agent_label` (devin/agent/bot/…) is an
# agent label, not a human label, and never satisfies a citation.
[markers]
record_glob = ["docs/build/reviews/**"]
required = ["reviewer:", "recorded", "subject:"]
agent_label = '(?i)\b(agent|bot|devin|swe-[0-9]|cognition|automation|llm)\b'
