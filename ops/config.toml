# SPDX-License-Identifier: Apache-2.0
# SIG operations config (P21.5, ADR-067). Zero-cost posture (SIG-STORE-003, HG-12):
# every credentialed value is a TEMPLATE — the operator fills it and the integration
# runs. Absent credentials, the CLIs report `gate pending: HG-07` and touch no network.

[object_store]
# The bulk-export object store (SIG-EXPORT-008: zero-or-low-egress ONLY).
# ADR-067 picks Cloudflare R2 (zero egress) as the primary; AWS S3 + CloudFront
# (ADR-015) is the documented alternative, kept for the evidence Object-Lock store.
provider = "cloudflare-r2"        # zero-egress (EGRESS_CLASS); a metered provider fails the build
bucket = "sig-bulk"               # the CLI's `cloudflare-r2:sig-bulk` target, reconciled here
# Filled from the environment, never committed (HG-07 / HG-09):
#   SIG_OBJECT_STORE_URL   -> endpoint_url (S3-compatible)
#   SIG_OBJECT_STORE_KEY   -> access key id
#   SIG_OBJECT_STORE_SECRET-> secret access key
endpoint_url = ""                 # e.g. https://<accountid>.r2.cloudflarestorage.com

[egress]
# The egress budget alarm (§38.5, RISK-P0-07 / RISK-P21-09). ADR-015's "revisit if
# egress climbs" trigger now has a MEASUREMENT: when the store's usage API reports
# monthly egress at or above this threshold, `sig-ops egress-report` alarms non-zero.
monthly_budget_gb = 100.0         # documented alarm threshold (untested against a real bill)
alarm_ratio = 0.8                 # warn at 80% of budget, alarm at 100%
# SIG-TRANSP-019 / D-J3-4 (A-3): the R2 mirror's hard monthly spend ceiling —
# `sig-ops egress-report --usage-usd <spent>` warns at 80% ($40) and alarms at
# 100% ($50); the alarm is the kill-switch trigger (the operator disables the
# CDN route / R2 public access — docs/build/reports/R2_MIRROR_RUNBOOK.md).
hard_ceiling_usd = 50.0

[observability]
# Uptime + error budgets and bounded log retention for the live stack
# (OBS.1 / GL-OBS-01, ADR-077). The zero-cost posture (SIG-STORE-003) means a
# FILE, not a paid metrics/log service: `sig-ops probe` appends one JSONL row per
# service check to the bounded probe log; budgets are a pure function over the
# rolling window; both the probe log and the recorded-alert ledger are held to
# this retention policy (age + byte caps, oldest rows drop first).
uptime_target_pct = 99.0        # monthly uptime SLO; the error budget is 100 - target
window_days = 30                # the rolling budget window
retention_days = 30             # probe + alert rows older than this are pruned
probe_log_max_bytes = 1048576   # the probe log never exceeds 1 MiB
# The notifier seam (ADR-077): the append-only recorded-alert ledger is always on
# (.sig/ops/alerts.jsonl, env SIG_ALERT_LOG); every alert is recorded before any
# external delivery is attempted. The OPTIONAL webhook notifier is env-configured
# (no paid service; secrets env-only, HG-09 — never committed here):
#   SIG_ALERT_WEBHOOK_URL    -> POST target (e.g. a free ntfy.sh topic / self-hosted hook)
#   SIG_ALERT_WEBHOOK_TOKEN  -> optional Bearer token
# Runtime state files (also env-overridable, gitignored under .sig/):
#   SIG_PROBE_LOG            -> the bounded probe log (default .sig/ops/probes.jsonl)

[cdn]
# The CDN in front of the store. Content-hash keys are immutable, so objects are
# cached effectively forever (see exports.push.IMMUTABLE_CACHE_CONTROL).
provider = "cloudflare"           # R2 + Cloudflare CDN = zero egress to the edge
cache_control = "public, max-age=31536000, immutable"

[tasks.contribution]
# The contribution-back live gate (P21.7, §35.2, SIG-CONTRIB-016d, RISK-P16-14).
# `registered` records whether SIG's OSM Organised Editing activity is genuinely
# registered in the activities list — an off-repo, human act (HG-08). It STAYS
# false until the operator files the registration; while false,
# `sig-tasks maproulette push` REFUSES (exit 3) with the OE-registration reason,
# so a challenge can never be pushed before the disclosure is live.
registered = false
# SIG_OSM_OE_PAGE — the OSM Organised Editing wiki page URL once registered
# (placeholder until HG-08 provides it). Read for the record; never dereferenced.
oe_page = ""
# The MapRoulette account/challenge id recorded after a real push (HG-08). Empty
# until a live push happens; the runbook
# (docs/build/reports/CONTRIBUTION_BACK_LIVE.md) records what ran live + the exact
# re-run command (P29.1 wired the transport activation-ready; D-P21.7-1).
maproulette_challenge = ""

[intake]
# The anonymous correction receiver gate (P32.16, ADR-135, §55.5 SIG-FIND-006).
# The receiver is a separate public-facing process (`sig-api serve-intake`)
# that can never write claims, review decisions or publication dispositions
# (its `sig_intake_receiver` role holds no such grants — proven in
# tests/db/test_intake_pg.py).
#
# `enabled` is NOT read here — SIG_INTAKE_ENABLED=1 mounts the surface for
# staging (routes exist; new reports refuse `receiver_not_operating`).
#
# `operational` is the committed half of the operating gate: accepting reports
# requires this flag true AND SIG_INTAKE_OPERATIONAL=1 AND the two env secrets
# (SIG_INTAKE_FORM_SECRET / SIG_INTAKE_ABUSE_SECRET — HG-09, never committed).
# It STAYS false until GATE-G3 (D-R10-PUBLISH-1) approves public exposure and a
# staffed owner is named — an unstaffed receiver is never advertised as
# operational (S4 §8). See docs/governance/intake-receiver-operating-packet.md.
operational = false
# The named human owner responsible for the moderation queue + escalation
# coverage. Empty = unstaffed; must be filled before `operational` flips.
owner = ""
# Whether a reviewer rotation actually covers the published response SLAs.
staffed = false
# How many edge-proxy hops the abuse limiter trusts when normalising the
# client address for its pseudonym (P34.37, C4 NEW-16). Each trusted hop is
# documented to append the peer it observed to Forwarded/X-Forwarded-For, so
# N means "the Nth-from-right forwarding entry is the real client" and
# everything left of it is client-claimed and ignored. 0 — the default and
# the current posture (no documented proxy chain in front of the receiver) —
# uses the direct TCP peer only; a client-supplied forwarding header is never
# trusted on its own.
trusted_proxy_hops = 0
# The retention schedule the operator ratified (S4 §8): payloads until 30 days
# after final disposition, with a 90-day review/reminder ceiling; extensions
# only via a recorded legal_hold intake event by an authorized reviewer.
# `sig-api intake-purge` applies it; these values mirror
# policy/data/intake_receiver.toml [retention] (the code reads the policy
# table — this row is the operator-facing record that they match).
retention_days_after_disposition = 30
retention_ceiling_days = 90
# Abuse limits are code-of-record in policy/data/intake_receiver.toml [abuse]:
# 5 accepted reports/hour per rotating abuse pseudonym (burst 3), global
# 100/hour, ≤24h pseudonym TTL, no durable IP/UA storage. Infra log retention
# (load balancer/proxy/monitoring) is OUTSIDE this repo — the operating packet
# lists the exclusions the operator must prove before any privacy claim.
