[project]
name = "sig-exports"
version = "0.1.0"
description = "SIG exports package: bulk artifact builders, incl. the PROV-O lineage export (§21.6)."
requires-python = ">=3.11"
# The PROV-O lineage export (SIG-INGEST-016) builds an RDF graph with rdflib,
# already a project dependency via `ontology` (OWL/SHACL generation).
#
# P14.2 (bulk exports) adds:
# - sig-policy: the N-compartment export licence model and its gates (§42.4,
#   SIG-LIC-004/004a/010/011). The export layer *computes* every file's licence from
#   constituent rights via policy.licensing — the same code path the read API uses to
#   attach a collection's licence (SIG-API-004), so exports and API agree by construction.
# - sig-resolution: the identifier crosswalk builders (SIG-IDENT-033/034) published as
#   their own most-permissive artifact (SIG-EXPORT-007).
# Both are leaf-ward of exports (policy is a leaf; resolution depends only on policy),
# so there is no cycle even though api and connectors depend on sig-exports.
# duckdb writes the Parquet artifact (SIG-EXPORT-001); it is already a workspace dep
# (sig-db, sig-resolution) and ships no extra native toolchain here.
dependencies = [
    "rdflib>=7.0",
    "sig-policy",
    "sig-resolution",
    "duckdb>=1.0.0",
    # P21.5: the Zenodo deposit REST transport (SIG-EXPORT-002) speaks HTTP over httpx —
    # already available in the workspace (the P14.1 API tests + P21.3 connectors use it);
    # object-store push (SIG-EXPORT-008/009) reuses boto3, already a dep of sig-evidence
    # for the OCFL Object-Lock store — no new native toolchain.
    "httpx>=0.27",
    "boto3>=1.34",
]

[project.scripts]
sig-exports = "exports.cli:main"

[tool.uv.sources]
sig-policy = { workspace = true }
sig-resolution = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exports"]
