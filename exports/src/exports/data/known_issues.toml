# sig.known-issues/1 — P36.49 / TX-06 (SIG-TRANSP-010, J3 §7.3)
#
# The committed curated known-issues registry, keyed by source. Auto-detected
# issue classes come from run records (exports.transparency.issue_records);
# this file carries only the human-recorded entries — data-quality defects a
# reviewer asserted, never a machine detection. Append-only: a resolved issue
# gains `status = "closed"` + `closed_at` + `correction_ref`; a row is never
# edited away.
#
#   issue_id        — stable id; `ki:<source>:<class>:<opened-date>` when unset
#   source_id       — one registry row of connectors/…/sources.toml
#   issue_class     — a CURATED_ISSUE_CLASSES member (exports.known_issues)
#   opened_at       — full UTC instant the issue was recorded (`date -u`)
#   status          — open | closed
#   closed_at       — full UTC instant of the closing record; required iff
#                     status = "closed", absent otherwise
#   correction_ref  — the correction log entry / artifact that closes it
#   text            — the public sentence — D-J3-12 [B-2] = OD-07 a: agent-
#                     drafted until the operator confirms the batch verbatim
#   text_state      — pending_review | confirmed; `pending_review` rows
#                     publish class + dates only (the drafted `text` may be
#                     recorded here for review but NEVER reaches a public
#                     artifact — the emit drops it)
#
# Seeded 2026-11-02 with the F-322 geometry-defect groups recorded by
# connectors/src/connectors/data/geometry_corrections.toml (sig.geometry-
# corrections/1; P35.16 / R11-DATA-01). opened_at is the finding's recorded
# time (2026-09-30T16:48Z); the correction write itself is the staged OM-19
# leg, so every row stays `open` until a landed correction closes it.

schema = "sig.known-issues/1"

