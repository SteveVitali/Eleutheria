#
# sig.quality-checks/1 — the versioned graph-quality check registry
# (SIG-CONF-006; ADR-154 decision 1; L3 §3.2, P34.44a).
#
# The 27 deduplicated checks GQ-01…GQ-27 (L3 §3.1: L1's INV-01…17 + L2's
# C1…C14 → 23, plus L3's four new checks and the B4 G10/DR-C3-03 marker rule).
# A change to this file is reviewed like a ruleset; the ratchet rules are
# enforced by exports.quality.diff_registry (SIG-CONF-007):
#   * a baseline may move only TOWARD its check's threshold;
#   * loosening a baseline or threshold needs a new ADR cited in the change;
#   * a check flips to `enforce` only in its named fixing row.
#
# Fields (per SIG-CONF-006):
#   id          "GQ-nn"
#   statement   the check in one sentence (plain)
#   population  what the check quantifies over
#   placement   [I] ingest/sink · [M] nightly spine probe · [R] release gate
#               · [P] pull request · [S] scheduled public probe
#   mode        "enforce" | "ratchet" | "report"
#   direction   "lower_is_better" | "higher_is_better"
#   threshold   "none" | "<= N" | "< N" | "> N" | ">= N" | "== N"
#   baseline    ratchet floor/ceiling (number) or "pending" — pending means L2
#               had no single measured value; P34.44b's baseline run sets it
#   unit        "count" | "share" | "ratio"
#   basis_class B0 by-construction · B1 mechanical census · B2 mechanical
#               sample · B3 agent review · B4 maintainer check · B5
#               independent human (SIG-CONF-001). B3/B4 may NEVER gate.
#   fixing      ticket ids of the row(s) that remove the cause (may be [])
#   from        the L1/L2/L3 source ids the check deduplicates
#   note        seed provenance ("today" values are L2's measured baselines —
#               placeholders until P34.44b's measured baseline run)

