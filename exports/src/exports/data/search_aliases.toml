# SPDX-License-Identifier: Apache-2.0
# The search alias registry (K3 §4.4, P36.31 / SRCH-01 — SIG-SRCH-005).
# This table is DATA, not code (SIG-ENG-001): every alias SIG search may
# resolve is a row here, reviewed like a registry row. Rules (K3 §4.4):
#   * only abbreviations and official alternate names;
#   * never a characterization ("ICE" resolves to the agency's name, never a
#     description of what it does);
#   * never a vendor's marketing term as a technology;
#   * every alias shows its expansion and its cited source on the card that
#     uses it;
#   * case_sensitive acronyms match case-sensitively and are NEVER presented
#     as word-matches (SIG-SRCH-005); technical terms resolve
#     case-insensitively;
#   * `target` names a SIG entity id the alias resolves to — empty today
#     (K2 entity publication pending); a registry alternate, vocabulary
#     synonym or entity alias is never hand-copied here — those feed the
#     same lookup table automatically.

version = "1"

