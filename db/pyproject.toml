[project]
name = "sig-db"
version = "0.1.0"
description = "SIG db package: the append-only PG18+PostGIS claim spine — sqitch migrations, insert-only claim sink, row-level security (§16, §47)."
requires-python = ">=3.11"
dependencies = [
    # The canonical store is PostgreSQL 18 + PostGIS (ADR-001); psycopg v3 is the
    # driver for the db stage and its tests. The binary wheel bundles libpq, so
    # neither developers nor CI need a system libpq.
    "psycopg[binary]>=3.2",
    # The §18 analytics boundary (P12.1): high-volume usage aggregates live OUTSIDE
    # PostgreSQL as Hive-partitioned Parquet queried by DuckDB (SIG-STORE-027, no
    # columnar Postgres extension adopted as canonical). DuckDB writes the
    # partitioned Parquet and runs the UUID+period join (ADR-010, ADR-044).
    "duckdb>=1.0.0",
    # Partitions are registered as evidence artifacts with content-addressed digests
    # (SIG-STORE-029); `db.analytics` reuses the interop multihash (SIG-EVID-002).
    # `evidence` is a leaf package (no sig-* deps), so this adds no import cycle.
    "sig-evidence",
]

[project.scripts]
sig-db = "db.cli:main"

[tool.uv.sources]
sig-evidence = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/db"]
