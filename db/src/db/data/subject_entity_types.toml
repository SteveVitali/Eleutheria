#
# P35.14b — the subject-scheme → entity-type map (L1 NEW-5 / FM-17, SIG-IDENT-025,
# SIG-ONTO-027). Versioned, committed, fail-closed.
#
# Every connector claim subject is minted under the identity-bearing scheme
# `sig.connector.subject` (ADR-110). This table declares which ontology entity
# type a subject VALUE mints, keyed on the subject id's scheme prefix (the
# leading `<family>:` segment(s)). The sink resolves a subject by longest-prefix
# match; a value matching NO entry refuses to mint (assertion_quarantine,
# reason `unknown_subject_scheme`) rather than defaulting to `deployment` — a
# new subject family lands only by editing THIS file deliberately.
#
# `entity_type` values are members of `vocab_entity_type`
# (db/deploy/seed_vocab.sql) — the §11 classes. A non-claim record kind
# (`agenda_document`, `portal_document`, `registry_query_meta`, `*_artifact`,
# `tenant_api_error`, …) never reaches the mint path, so subjects that exist
# only on those kinds are deliberately NOT mapped: if a connector ever emits a
# claim on one, the fail-closed refusal forces the typing decision to be made
# here, not guessed by the sink.

# The map version, recorded on every `entity_type_decision` row the
# typed-identity write lands so a later revision can supersede honestly.
