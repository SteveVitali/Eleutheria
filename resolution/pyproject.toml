[project]
name = "sig-resolution"
version = "0.0.0"
description = "SIG resolution package: the Jurisdiction and Organization identity registries, temporal identity, and deterministic identity guards (§11.1-11.3, §14)."
requires-python = ">=3.11"
# The registry-ingest guard reuses the four-state absence model from the db
# package (SIG-IDENT-008 distinguishes absent from not-observed via db.absence);
# the crosswalk exports publish only through the policy licence gate (SIG-IDENT-033
# /034 → SIG-LIC-004 in policy.licensing). The review queue (P05.2) adjudicates the
# model-assisted extractions from the upstream `parsing` stage alongside its own
# probabilistic-ER proposals — a forward pipeline dependency (parsing → resolution).
dependencies = [
    "duckdb>=1.0.0",
    "sig-db",
    "sig-parsing",
    "sig-policy",
    "splink>=4.0.0",
]

[project.scripts]
sig-resolution = "resolution.cli:main"

[tool.uv.sources]
sig-db = { workspace = true }
sig-parsing = { workspace = true }
sig-policy = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resolution"]
