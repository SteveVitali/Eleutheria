# The partner-organisation identity rules (P31.5 / ADR-112) — DATA, not code, read by
# resolution.partner_identity. Bump `version` whenever a rule changes: the version is
# carried on every entity-ref claim record (`object_ref.rules`), so a rule change is a
# new claim, never a silent re-identification. Every list is matched against the
# TOKENS of normalize_org_name(name) (folded, lowercased, punctuation split), and a
# multi-word entry matches as a contiguous token run.
#
# The decision order (resolution.partner_identity.partner_identity):
#   1. no alphabetic word            -> text only ("not_a_name": an id of unknown scheme)
#   2. several parties in one string -> text only ("multiple_parties")
#   3. an individual/sole-trader phrase -> text only ("sole_proprietor", Part VIII)
#   4. an honorific, a personal suffix or a common given name -> text only
#                                       ("person_shaped", Part VIII)
#   5. a role or title word with no institutional head noun ("Sheriff Smith",
#      "Police Chief Doe") -> text only ("person_shaped"; the officer-naming gate)
#   6. no distinguishing word (every word generic or an organisation marker:
#      "Police Department", "Fire Department", "Department of Justice") -> text only
#      ("generic_name": the same words name a body in every jurisdiction)
#   7. an organisation marker        -> an organisation
#   8. one word                      -> text only ("single_word": a bare surname or
#                                       brand cannot be told apart)
#   9. anything else                 -> text only ("person_shaped": two or more words
#                                       with no organisation marker read as a name)
# Only step 7 mints an organisation. When in doubt the partner stays a text claim: that
# is the conservative direction for Part VIII. The given-name list leaves out names that
# are also common place names (Austin, Madison, Charlotte, Jackson, Victoria, ...), so a
# city or county named that way is not refused by it.

version = "1"

# Raw-string separators that mean the value names more than one party
# ("King County / WSDOT", "A; B"). Checked on the raw text, before normalization.
multi_party_separators = ["/", ";", "|", " + "]

# A natural person trading under a name, or a record that says it is an individual.
individual_phrases = [
  "dba",
  "d b a",
  "doing business as",
  "trading as",
  "t a",
  "sole proprietor",
  "sole proprietorship",
  "sole trader",
  "self employed",
  "an individual",
  "private individual",
  "entrepreneur individuel",
  "auto entrepreneur",
  "micro entrepreneur",
  "family trust",
  "living trust",
  "revocable trust",
  "estate of",
]

# Honorifics and personal name suffixes (a person, never a body).
person_tokens = [
  "mr", "mrs", "ms", "miss", "mx", "dr", "prof", "sir", "dame", "esq",
  "jr", "sr", "ii", "iii", "iv",
  "mme", "mlle", "herr", "frau", "sra", "srta",
]

# Words that never distinguish one organisation from another. A name made only of
