#
# Camera-site entity resolution rules (P30.2b / GO-LIVE.2b, ADR-105), versioned data
# (change = bump `version`; a new version is a new ER ruleset, SIG-RECON-002).
#
# THE UNIT. An observation-level camera record is ONE source's row for one camera
# (a `traffic_camera:<source>:<target>:<ref>` subject carrying camera_latitude /
# camera_longitude claims). A RESOLVED SITE is a cluster of observation-level records
# judged to describe the SAME PHYSICAL DEVICE. M = observation-level records,
# N = post-ER clusters (singletons included), N <= M, dedup ratio = 1 - N/M.
#
# Blocking (resolution/data/blocking_rules.toml [[geo_rule]]) only PROPOSES candidate
# pairs (SIG-IDENT-024); every decision below is a recorded, tiered rule with its
# evidence (SIG-IDENT-025). Only tiers whose measured holdout precision clears the
# published floor (splink_model.toml `auto_write_precision_threshold`) auto-write;
# everything else is PROPOSED and enqueued for human review (SIG-IDENT-020/028).
#
# RULESET v3 (P35.46 / ADR-153 "derivation, not identity"; ADR-L3-B): the
# C0/C1/C2/P vocabulary. Automatic collapse is limited to provable COPIES of
# one upstream record — derivation links, never identity claims:
#   C0 duplicate_target          — the same upstream layer ingested twice under
#                                  one source (row- or byte-identical; ADR-116
#                                  duplicate-target lineage);
#   C1 namespaced_copy           — the same normalised value in a DECLARED
#                                  id_namespace of a DECLARED copy lineage
#                                  (mirror-of/derived-from), the id unique in
#                                  each source's record set, within
#                                  copy_tolerance_m — census-verified every
#                                  run (GQ-23);
#   C2 position_matched_copy     — inside a declared lineage carrying
#                                  documentary evidence AND measured overlap
#                                  >= c2_min_overlap: bijective within
#                                  colocation_m, <= copy_tolerance_m, no
#                                  attribute conflict (Q-L3-6 = a: enabled);
#   P  possible_duplicate        — every inferential match (3g/4g/5g), a
#                                  namespaced-id miss, a soft conflict, a
#                                  refused union, a shape alert, an
#                                  axis-swap-suspected point, or a
#                                  census-demoted lineage: NOT merged; a
#                                  possible_duplicate link with distance and
#                                  reason, surfaced for optional operator
#                                  review (GQ-24: identity inference is never
#                                  auto-written without an independent human
#                                  (B5) evaluation — none exists in Round 11).
# SIG-EVAL-004's lower bound is WAIVED for C0-C2 only (Q-L3-1 = a,
# ADR-153/ADR-L3-B): the GQ-23 census replaces the eval gate for copy tiers;
# the inferential tiers stay review-only by construction. The v2 bare-ref
# tier (1g) and the sub-metre coincidence tier (3g) die here: an inferential
# distance/ref match is a possible duplicate, never a collapse.
#
# Device classes (P35.15a / PKG-07, NEW-7 / FM-05): a record's class still
# comes from its subject's DECLARED SKOS technology slug first — the
# `technology` claim the connector emits from the camera-registry target's
# declared slug ([[classes.technology_rule]] below). The substring rules are
# retained only as the fallback for records that carry no declaration (the
# spine's pre-P35.15b-backfill rows) and as the audit arm that logs a
# device-class finding when it would have disagreed with a declaration — a
# mismatch is recorded, never silently overridden. Under v3 the declared
# classes also feed the `device_kind` soft conflict.

version = "3"

# ---------------------------------------------------------------------------
# Distances (metres, great-circle). A candidate pair farther apart than
# `candidate_max_m` is tier 6 (discarded, no per-pair record, SIG-IDENT-020).
# ---------------------------------------------------------------------------
[distance]
# Two records within this distance carry the SAME coordinate for practical purposes:
# a republished copy of one upstream row (a mirror) typically lands at 0.0 m.
coincident_m = 1.0
# The working copy tolerance a C1/C2 collapse must sit inside (GQ-23): the
# measured maximum jitter a republished copy carries. M-3 (cross-copy
# agreement, CONF-09) re-derives the empirical value from the C1 population —
# until then the coincident bound stands in, deliberately tight.
copy_tolerance_m = 1.0
# The co-location radius used for ONE-TO-ONE (bijective) checks: if either
# record has another record of the other's source within this radius, the pair
# is ambiguous (several devices on one pole / intersection) and never
# collapses.
colocation_m = 5.0
# Tier-4/5 proximity radius — also the declared possible-duplicate distance
# for the count interval's lower bound (GQ-10's 25 m bound).
near_max_m = 25.0
# The outer candidate radius (the blocking coverage bound — a possible
# duplicate beyond it is not listed, SIG-IDENT-020).
candidate_max_m = 50.0

# ---------------------------------------------------------------------------
# Tiers — the ruleset-v3 C0/C1/C2/P vocabulary (L3-confidence §4.6). The
# integer is the spec tier the disposition rules key on; the label names the
# emitted link vocabulary. `candidate_auto_write` lists the COLLAPSE tiers:
# C0 applies on its own evidence path (duplicate-target lineage); C1/C2 are
# the declared-lineage copy tiers. Under the ADR-L3-B waiver (Q-L3-1 = a,
# scoped to C0–C2) the eval holdout never gates a copy tier — the GQ-23
# census is the gate, and a failing lineage's tier demotes on the next run.
# `inferential` tiers additionally require an independent human (B5)
# evaluation to auto-write at all (GQ-24): the agent/LLM-labelled gold set
# can never certify one, so an inferential tier is review-only while
# `certified_tiers` is empty — emitted as a `possible_duplicate` link.
# `c2_enabled` is the operator's Q-L3-6 = a decision as data; flipping it to
# false demotes every C2 pair to P without a code change.
# ---------------------------------------------------------------------------
[tiers]
candidate_auto_write = [1, 2]
inferential = [3, 4, 5]
c2_enabled = true

[tiers.labels]
1 = "C1:namespaced_copy"
2 = "C2:position_matched_copy"
3 = "P3:coincident_point"
4 = "P4:proximate_unique"
5 = "P5:proximate_candidate"

# ---------------------------------------------------------------------------
# Device classes and the RECORDED compatibility rules. A record's class comes
# from its subject's DECLARED technology slug when one is asserted (the P35.15a
# `technology` claim — [[classes.technology_rule]] maps the slug prefix to a
# class); a record with no declaration falls back to the source/operator/type
# substring rules (first matching class wins, in file order); no match ->
# "unspecified". A pair whose classes are listed in `incompatible` is NEVER a
# candidate (never merged, never proposed): an ALPR reader and a
# traffic-management CCTV are different devices even on one pole.
# ---------------------------------------------------------------------------
[classes]
default = "unspecified"
incompatible = [["alpr", "traffic"], ["alpr", "cctv"]]

# The declared-slug table (P35.15a / PKG-07). `technology_prefixes` match a
# lower-cased slug exactly or at a '-' boundary (`alpr` covers alpr-fixed,
# alpr-mobile, alpr-trailer, … — the whole plate-capture family). Order is
# first-match like [[classes.rule]]; a declared slug matching no entry is the
# default class (a declaration still owns the classification — the fallback is
# never the substring rules).
[[classes.technology_rule]]
class = "alpr"
technology_prefixes = ["alpr", "vehicle-fingerprint", "plate-data-commercial"]

[[classes.technology_rule]]
class = "traffic"
technology_prefixes = ["fixed-camera-ptz"]

[[classes.technology_rule]]
class = "cctv"
technology_prefixes = [
  "fixed-camera-cctv",
  "camera-trailer",
  "private-camera",
  "video-analytics",
]

[[classes.rule]]
class = "alpr"
source_substrings = ["flock", "alpr", "lpr"]
operator_substrings = ["alpr", "license plate", "licence plate", "plate reader", "flock"]
# An explicit device type naming a plate reader classes the record too (an OSM node's
# operator label is "OpenStreetMap contributors", so only its type can say ALPR). Added
# after review; no hosted camera_type value matches today (measured: fixed / dome /
# panning / panorama_with_ptz / destroyed), so no measured pair changes class.
type_substrings = ["alpr", "anpr", "lpr", "plate"]

[[classes.rule]]
class = "traffic"
source_prefixes = ["dot_511_"]
source_substrings = ["dot", "511", "traffic", "its_"]
operator_substrings = [
  "department of transportation",
  "transport agency",
  "traffic",
  "511",
  "its camera",
  "transportation",
  "highways",
  "tripcheck",
]

[[classes.rule]]
class = "cctv"
operator_substrings = ["cctv"]

# ---------------------------------------------------------------------------
# Soft conflicts: a pair that carries one of these is still a candidate but can
# NEVER collapse or auto-write — it is a `possible_duplicate` routed to review
# whatever its tier (the P enumeration names "soft conflicts" verbatim).
#   jurisdiction — both records carry a resolved jurisdiction code and they differ;
#   camera_type  — both records carry an explicit device type and they differ;
#   direction    — (v2) both records carry a parseable viewing direction (compass word or
#                  bearing) more than `direction_conflict_deg` apart;
#   device_kind  — (v3, P35.46) both records declare `technology` and their
#                  declared device classes differ — the declared-technology
#                  half of the device-kind conflict (the description-parsing
#                  half stays D-P30.2b-2, unclaimed). A pair whose classes are
#                  outright incompatible is never a candidate at all.
# Jurisdiction values in `unresolved_jurisdictions` are treated as absent.
# ---------------------------------------------------------------------------
[soft_conflicts]
fields = ["jurisdiction", "camera_type", "direction", "device_kind"]
unresolved_jurisdictions = ["unresolved", "", "unknown"]
direction_conflict_deg = 90.0

# ---------------------------------------------------------------------------
# Upstream identifiers. Refs are normalised (trim, lower-case, a trailing ".0"
# float artefact removed) before comparison. A ref equality only counts as a shared
# upstream identifier within `candidate_max_m`.
# ---------------------------------------------------------------------------
[refs]
strip_float_suffix = true

# ---------------------------------------------------------------------------
# Mirror lineage (data-generated, re-derived every run). Two sources are ONE lineage
# (republications of the same upstream dataset) when at least `min_pairs` of their
# records are coincident AND those coincident records cover at least `min_share` of
# the smaller source. A mirror copy is NOT independent corroboration: a cluster's
# `independent_lineages` counts lineages, not sources.
# `c2_min_overlap` (P35.46, Q-L3-6 = a): the measured copy overlap a
# documented declared lineage must reach before a position-matched (C2)
# collapse is allowed — coincident records covering at least this share of
# the smaller source, with at least `min_pairs` evidence.
# ---------------------------------------------------------------------------
[lineage]
min_pairs = 20
min_share = 0.5
c2_min_overlap = 0.9

# ---------------------------------------------------------------------------
# The derivation census + M-1b id-resolution sample (GQ-23, P35.46).
# `m1b_sample_size` is the quarterly seeded draw per declared namespace (the
# upstream GET leg is CONF-09's named scope); the acceptance bound the
# catalog names is a >= 0.98 one-sided Clopper-Pearson lower bound on
# resolved ids — reported as a measured property of the copy link, never a
# certification figure.
# ---------------------------------------------------------------------------
[census]
m1b_sample_size = 200

# ---------------------------------------------------------------------------
# Constrained clustering + cluster-shape alerts (SIG-IDENT-029). Auto-write edges are
# applied strongest-first; a union is REFUSED (the edge is routed to review instead)
# if the merged cluster would hold two records of one source, span more than
# `max_span_m`, or exceed `max_size`. Any published cluster that still trips an alert
# has ALL its auto-write edges demoted to review.
#   elongated_cluster  — span > max_span_m (a chain strung along a road)
#   oversized_cluster  — more members than max_size
#   single_bridge_join — one edge joins two components each >= substantial_component
# ---------------------------------------------------------------------------
[clusters]
max_span_m = 50.0
max_size = 6
substantial_component = 3

# ---------------------------------------------------------------------------
# Gold-set construction for camera pairs (SIG-IDENT-027): the pair score used for
# weight-band stratification is the NEGATED distance in metres (nearer = higher).
# ---------------------------------------------------------------------------
[[gold_band]]
name = "coincident"
min_weight = -1.0

[[gold_band]]
name = "near"
min_weight = -10.0

[[gold_band]]
name = "mid"
min_weight = -25.0

[[gold_band]]
name = "far"
min_weight = -1000000.0

[gold]
holdout_fraction = 0.3
seed = 30
# Auto-write precision on the frozen holdout is measured STRICTLY: a pair the
# matcher would auto-write that the verifier labels `not_enough_information` counts
# AGAINST the tier (an unverifiable merge is not a verified merge) — the asymmetric
# cost of a false merge in a surveillance-accountability record (ADR-099, D-R6.1-EVAL).
strict_precision = true
# A candidate tier needs at least this many frozen-holdout pairs before its precision can
# gate auto-write (a 1-of-1 "1.000" is not evidence). The v2 holdout carries 70 per
# auto-write candidate tier. Under v3-interim the same measurement is REPORTED for every
# candidate tier but can only ever demote a derivation — the inferential tiers also need
# a `certified_tiers` entry from an independent human evaluation (none exists).
min_holdout_pairs = 50

# The written adjudication rules for camera-site pairs (versioned prose; an
# adjudicator reads these, not code).
adjudication_rules = """
Adjudicate each candidate pair of observation-level camera records into exactly one of
three labels. Each record is one source's published row for one camera.

- match: the two records describe the SAME physical device. Corroborate with a shared
  upstream identifier for the device (the same camera id republished by another
  publisher), OR the same site description (the same road / cross-street / named
  location, allowing for formatting and abbreviation differences) at a consistent
  position, OR identical coordinates from two publishers where neither lists another
  device at that point and nothing in the records conflicts. Proximity ALONE (a few
  metres to tens of metres apart, no corroborating description or identifier) is NOT
  sufficient.
- non_match: the two records describe DIFFERENT devices: the descriptions name
  different roads, cross-streets or locations; the device kinds conflict (e.g. a
  licence-plate reader vs a traffic-management camera); the viewing directions or
  explicit device types conflict in a way one device cannot satisfy; or the same
  publisher lists both as separate rows.
- not_enough_information: the available evidence cannot decide the pair. Do NOT guess;
  this is the correct label for two nearby records with no corroborating description
  or identifier, or for several devices plausibly co-located on one pole or
  intersection.

A republished copy (mirror) of the same upstream dataset is one observation, not two
independent confirmations. When in doubt between match and non_match, choose
not_enough_information.
"""
