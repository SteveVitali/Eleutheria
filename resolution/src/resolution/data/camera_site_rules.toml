#
# Camera-site entity resolution rules (P30.2b / GO-LIVE.2b, ADR-105), versioned data
# (change = bump `version`; a new version is a new ER ruleset, SIG-RECON-002).
#
# THE UNIT. An observation-level camera record is ONE source's row for one camera
# (a `traffic_camera:<source>:<target>:<ref>` subject carrying camera_latitude /
# camera_longitude claims). A RESOLVED SITE is a cluster of observation-level records
# judged to describe the SAME PHYSICAL DEVICE. M = observation-level records,
# N = post-ER clusters (singletons included), N <= M, dedup ratio = 1 - N/M.
#
# Blocking (resolution/data/blocking_rules.toml [[geo_rule]]) only PROPOSES candidate
# pairs (SIG-IDENT-024); every decision below is a recorded, tiered rule with its
# evidence (SIG-IDENT-025). Only tiers whose measured holdout precision clears the
# published floor (splink_model.toml `auto_write_precision_threshold`) auto-write;
# everything else is PROPOSED and enqueued for human review (SIG-IDENT-020/028).

version = "2"

# ---------------------------------------------------------------------------
# Distances (metres, great-circle). A candidate pair farther apart than
# `candidate_max_m` is tier 6 (discarded, no per-pair record, SIG-IDENT-020).
# ---------------------------------------------------------------------------
[distance]
# Two records within this distance carry the SAME coordinate for practical purposes:
# a republished copy of one upstream row (a mirror) typically lands at 0.0 m.
coincident_m = 1.0
# The co-location radius used for ONE-TO-ONE checks: if either record has another
# record of the other's source within this radius, the pair is ambiguous (several
# devices on one pole / intersection) and never auto-writes.
colocation_m = 5.0
# Tier-4/5 proximity radius: nearer than this, an unambiguous cross-source pair is a
# plausible same-device proposal for a human.
near_max_m = 25.0
# The outer candidate radius (shared-reference tier + the blocking coverage bound).
candidate_max_m = 50.0

# ---------------------------------------------------------------------------
# Tiers — mapped onto the §14.6 six-tier cascade (the integer is the spec tier the
# disposition rules and the quality gates key on; the label names the camera rule).
# `candidate_auto_write` tiers MAY auto-write, but ONLY if the ER run measures their
# holdout precision >= the floor; a tier with no holdout evidence never auto-writes.
# ---------------------------------------------------------------------------
[tiers]
candidate_auto_write = [1, 3]
# v2 (ADR-105 §4 — derived from the gold set's TRAINING partition errors, measured on a
# fresh holdout): a shared upstream reference is the deterministic tier only when the
# pair is also mutually nearest across the two sources AND, unless the two site
# descriptions agree, each record is the other's ONLY counterpart within `colocation_m`
# (so an unnamed shared-ref pair must also be one-to-one within 5 m). A publisher listing
# several devices at one point cannot be disambiguated by a shared row number alone (the
# v1 holdout measured tier 1g at 0.882).
shared_ref_requires_mutual_nearest = true
shared_ref_colocated_requires_name_agreement = true

[tiers.labels]
1 = "1g:shared_upstream_ref"
3 = "3g:coincident_point"
4 = "4g:proximate_unique"
5 = "5g:proximate_candidate"

# ---------------------------------------------------------------------------
# Device classes and the RECORDED compatibility rules. A record's class is derived
# from its source id and published operator label (first matching class wins, in
# file order); no match -> "unspecified". A pair whose classes are listed in
# `incompatible` is NEVER a candidate (never merged, never proposed): an ALPR reader
# and a traffic-management CCTV are different devices even on one pole.
# ---------------------------------------------------------------------------
[classes]
default = "unspecified"
incompatible = [["alpr", "traffic"], ["alpr", "cctv"]]

[[classes.rule]]
class = "alpr"
source_substrings = ["flock", "alpr", "lpr"]
operator_substrings = ["alpr", "license plate", "licence plate", "plate reader", "flock"]

[[classes.rule]]
class = "traffic"
source_prefixes = ["dot_511_"]
source_substrings = ["dot", "511", "traffic", "its_"]
operator_substrings = [
  "department of transportation",
  "transport agency",
  "traffic",
  "511",
  "its camera",
  "transportation",
  "highways",
  "tripcheck",
]

[[classes.rule]]
class = "cctv"
operator_substrings = ["cctv"]

# ---------------------------------------------------------------------------
# Soft conflicts: a pair that carries one of these is still a candidate but can
# NEVER auto-write — it is routed to review whatever its tier.
#   jurisdiction — both records carry a resolved jurisdiction code and they differ;
#   camera_type  — both records carry an explicit device type and they differ;
#   direction    — (v2) both records carry a parseable viewing direction (compass word or
#                  bearing) more than `direction_conflict_deg` apart.
# Jurisdiction values in `unresolved_jurisdictions` are treated as absent.
# ---------------------------------------------------------------------------
[soft_conflicts]
fields = ["jurisdiction", "camera_type", "direction"]
unresolved_jurisdictions = ["unresolved", "", "unknown"]
direction_conflict_deg = 90.0

# ---------------------------------------------------------------------------
# Upstream identifiers. Refs are normalised (trim, lower-case, a trailing ".0"
# float artefact removed) before comparison. A ref equality only counts as a shared
# upstream identifier within `candidate_max_m`.
# ---------------------------------------------------------------------------
[refs]
strip_float_suffix = true

# ---------------------------------------------------------------------------
# Mirror lineage (data-generated, re-derived every run). Two sources are ONE lineage
# (republications of the same upstream dataset) when at least `min_pairs` of their
# records are coincident AND those coincident records cover at least `min_share` of
# the smaller source. A mirror copy is NOT independent corroboration: a cluster's
# `independent_lineages` counts lineages, not sources.
# ---------------------------------------------------------------------------
[lineage]
min_pairs = 20
min_share = 0.5

# ---------------------------------------------------------------------------
# Constrained clustering + cluster-shape alerts (SIG-IDENT-029). Auto-write edges are
# applied strongest-first; a union is REFUSED (the edge is routed to review instead)
# if the merged cluster would hold two records of one source, span more than
# `max_span_m`, or exceed `max_size`. Any published cluster that still trips an alert
# has ALL its auto-write edges demoted to review.
#   elongated_cluster  — span > max_span_m (a chain strung along a road)
#   oversized_cluster  — more members than max_size
#   single_bridge_join — one edge joins two components each >= substantial_component
# ---------------------------------------------------------------------------
[clusters]
max_span_m = 50.0
max_size = 6
substantial_component = 3

# ---------------------------------------------------------------------------
# Gold-set construction for camera pairs (SIG-IDENT-027): the pair score used for
# weight-band stratification is the NEGATED distance in metres (nearer = higher).
# ---------------------------------------------------------------------------
[[gold_band]]
name = "coincident"
min_weight = -1.0

[[gold_band]]
name = "near"
min_weight = -10.0

[[gold_band]]
name = "mid"
min_weight = -25.0

[[gold_band]]
name = "far"
min_weight = -1000000.0

[gold]
holdout_fraction = 0.3
seed = 30
# Auto-write precision on the frozen holdout is measured STRICTLY: a pair the
# matcher would auto-write that the verifier labels `not_enough_information` counts
# AGAINST the tier (an unverifiable merge is not a verified merge) — the asymmetric
# cost of a false merge in a surveillance-accountability record (ADR-099, D-R6.1-EVAL).
strict_precision = true

# The written adjudication rules for camera-site pairs (versioned prose; an
# adjudicator reads these, not code).
adjudication_rules = """
Adjudicate each candidate pair of observation-level camera records into exactly one of
three labels. Each record is one source's published row for one camera.

- match: the two records describe the SAME physical device. Corroborate with a shared
  upstream identifier for the device (the same camera id republished by another
  publisher), OR the same site description (the same road / cross-street / named
  location, allowing for formatting and abbreviation differences) at a consistent
  position, OR identical coordinates from two publishers where neither lists another
  device at that point and nothing in the records conflicts. Proximity ALONE (a few
  metres to tens of metres apart, no corroborating description or identifier) is NOT
  sufficient.
- non_match: the two records describe DIFFERENT devices: the descriptions name
  different roads, cross-streets or locations; the device kinds conflict (e.g. a
  licence-plate reader vs a traffic-management camera); the viewing directions or
  explicit device types conflict in a way one device cannot satisfy; or the same
  publisher lists both as separate rows.
- not_enough_information: the available evidence cannot decide the pair. Do NOT guess;
  this is the correct label for two nearby records with no corroborating description
  or identifier, or for several devices plausibly co-located on one pole or
  intersection.

A republished copy (mirror) of the same upstream dataset is one observation, not two
independent confirmations. When in doubt between match and non_match, choose
not_enough_information.
"""
