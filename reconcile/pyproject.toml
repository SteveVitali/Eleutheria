[project]
name = "sig-reconcile"
version = "0.0.0"
description = "SIG reconcile package (skeleton; see docs/2_canonical_design_spec.md §47)."
requires-python = ">=3.11"
# The reconciliation engine consumes the predicate registry (volatility/half-life/
# directness) generated from the ontology source, and the canonical EDTF-envelope
# derivation (sig-db) for ordering fuzzy-dated lifecycle events (§29.4,
# SIG-RECON-040) — reused rather than duplicated so the envelope ruleset has one
# source of truth.
dependencies = ["sig-ontology", "sig-db"]

[project.scripts]
sig-reconcile = "reconcile.cli:main"

[tool.uv.sources]
sig-ontology = { workspace = true }
sig-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reconcile"]
