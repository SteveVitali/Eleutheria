#
# CI (SIG-ENG-015/016 wiring): lint, type-check, test, and the
# "generated artifacts match a fresh generation" gate — run green on the empty
# skeleton. Install is strictly from the committed lockfile (uv --frozen).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install Python (pinned by .python-version)
        run: uv python install

      - name: Install workspace from the committed lockfile
        run: make sync

      - name: Lint
        run: make lint

      - name: Format check
        run: make format-check

      - name: Type-check
        run: make typecheck

      # The claim-spine DB tests (P02.1) stand up PostgreSQL 18 + PostGIS in a
      # throwaway container and apply the sqitch plan against it (SIG-STORE-024).
      # ubuntu-latest ships a running Docker daemon; SIG_REQUIRE_DB_TESTS turns a
      # missing daemon into a failure so the RLS/append-only suite can never
      # silently skip. Ryuk is disabled — the fixtures clean up explicitly.
      - name: Test
        run: make test
        env:
          SIG_REQUIRE_DB_TESTS: "1"
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Generated artifacts match a fresh generation
        run: make verify-gen
