#
# CI (SIG-ENG-015/016 wiring): lint, type-check, test, and the
# "generated artifacts match a fresh generation" gate — run green on the empty
# skeleton. Install is strictly from the committed lockfile (uv --frozen).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install Python (pinned by .python-version)
        run: uv python install

      - name: Install workspace from the committed lockfile
        run: make sync

      - name: Lint
        run: make lint

      - name: Format check
        run: make format-check

      - name: Type-check
        run: make typecheck

      # The claim-spine DB tests (P02.1) stand up PostgreSQL 18 + PostGIS in a
      # throwaway container and apply the sqitch plan against it (SIG-STORE-024).
      # ubuntu-latest ships a running Docker daemon; SIG_REQUIRE_DB_TESTS turns a
      # missing daemon into a failure so the RLS/append-only suite can never
      # silently skip. Ryuk is disabled — the fixtures clean up explicitly.
      - name: Test
        run: make test
        env:
          SIG_REQUIRE_DB_TESTS: "1"
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Generated artifacts match a fresh generation
        run: make verify-gen

  # The Phase-15 web shell (SIG-UI-036..041). Confined to web/ (SIG-ENG-010). This
  # job IS the CI enforcement of the shell's mandated gates: WCAG 2.2 AA (axe), the
  # OSI-only dependency licence check, and the performance budgets — "checked in CI,
  # not by memory" (SIG-UI-039) and "the build fails on regression" (SIG-UI-041).
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Install Node (pinned major)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install from the committed lockfile
        run: npm ci

      - name: Type-check (astro check)
        run: npm run typecheck

      - name: Unit tests (epistemic logic + design-token invariants)
        run: npm run test:unit

      - name: Build the static site (zero-JS-by-default)
        run: npm run build

      - name: Dependency licence gate (OSI only; excludes CC-BY-NC / source-available / BUSL)
        run: npm run check:licenses

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end + WCAG 2.2 AA (axe) + no-JS baseline
        run: npm run test:e2e

      - name: Performance budgets (build fails on regression)
        run: npm run check:perf
