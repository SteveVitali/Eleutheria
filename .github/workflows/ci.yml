# carry per-artifact licences — see LICENSE and docs/2_canonical_design_spec.md §42.
#
# CI (SIG-ENG-015/016 wiring): lint, type-check, test, and the
# "generated artifacts match a fresh generation" gate — run green on the empty
# skeleton. Install is strictly from the committed lockfile (uv --frozen).
# Runner: every job pins `ubuntu-24.04` (S6R-27, FEA-16 — the `ubuntu-latest`
# label moves to Ubuntu 26 from 2026-10-19).
# Toolchain pin (SIG-ENG-046, P34.1, ADR-151): Node from `web/.nvmrc`, npm from
# `web/package.json` `packageManager`, uv from `pyproject.toml`
# `[tool.uv] required-version` — the same pins `make ci-local` runs locally.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Workflow-level `bash` = `bash --noprofile --norc -eo pipefail` on the runner
# (SIG-ENG-046): a failing command on the left of any `| tee`/pipe fails the step.
defaults:
  run:
    shell: bash

# PR runs stay cancellable (a newer head supersedes an older one); a run for a
# push to `main` is never cancelled — SIG-ENG-046 requires a completed main run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Step-gating rule (P35.41a, D2): a `web`-job step may carry the
# `steps.perf.outputs.mode` reuse gate only when it reads no records path
# (docs/build minus docs/build/tools, docs/tickets, docs/adr); a step that
# reads one must not. `perf_reuse.py lint` enforces this on every head.
jobs:
  # Documentation freshness gate (P22.2, ADR-072). Runs BOTH vendored detectors
  # (human-facing repo docs from P22.1 + the agent-facing AGENTS.md hierarchy) on
  # pull requests AND on pushes to `main` (P34.1 / CF-01, ADR-151 — the guards
  # judge landed commits too, so a change cannot dodge them by merging).
  # Structural checks only — deterministic, no LLM — so drift (broken
  # references, coverage gaps) is caught at change time, not by a periodic
  # sweep. Pure bash + git; no uv/toolchain needed. Kept out of `make check`
  # because the two detectors together take ~30s (>10s), so they run here.
  #
  # Round 11 (SEED-02b; B4 G3/G7, plan App. A T2): `make docs-check` also runs the
  # build-memory history guard on the working tree, the spec-source checker and the
  # coverage-matrix checker, and the last steps judge the change's own commits —
  # on a pull request the history guard runs over base...head (BM-HIST-01) and
  # the trailer check over the same range; on a push to `main` the guard runs
  # over the landed head's first-parent diff and the trailer check over the
  # push's commits (event.before...sha, the landed head itself as fallback).
  # P34.2 (G3b, SIG-MEM-007): the last step re-verifies every `ci:` line the
  # change adds against GitHub — `actions:read` + `checks:read` are needed for
  # the run/check-runs reads. All stdlib python3: the runner's system Python
  # (3.12 on ubuntu-24.04); no uv.
  docs:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the detectors classify missing refs via git history; the history guards need it

      - name: Documentation freshness (both detectors)
        run: make docs-check

      # CI.1 / GL-CI-01: the build-memory layout gate is named explicitly per the
      # contract (it also runs inside `make docs-check` above — this step keeps
      # the enforcement visible even if the docs-check composition changes).
      - name: Build-memory layout gate (check-build-memory.sh)
        run: bash scripts/docs/check-build-memory.sh .

      # P34.9 (B3 §6 V1–V13, G5/G11): the ledger contract — orient budget,
      # CURRENT STATE vocabularies, named paths, stale tokens, PHASE LOG /
      # BUILD_INDEX / RETURN PASS / GATE DECISIONS well-formedness — is checked,
      # not trusted; a check that evaluated none of a non-empty candidate set is
      # vacuous (exit 3, red). Named explicitly for the same visibility reason.
      - name: Ledger-contract gate (ledger_contract.py)
        run: python3 docs/build/tools/ledger_contract.py check --json docs/build/logs/ledger-contract.json

      # P34.9 (B4 V9): the committed current-state projection is verified
      # against its recorded input digests — drift, a known inconsistency, or an
      # obligation landing naming no chain/BACKLOG row is red. Also inside
      # `make docs-check` (docs-check-projection); explicit for visibility.
      - name: Current-state projection verify (current_projection.py)
        run: python3 docs/build/tools/current_projection.py verify

      # P34.29 (B3 §3.13 item 4, V6): the RETURN PASS generated region —
      # `### RETURN PASS — current` must equal `return_pass.py generate`
      # byte-for-byte, `returnPass:` must equal its sorted ticket column, and
      # every owed obligation must sit in exactly one home. Also inside
      # `make docs-check` (docs-check-returnpass); explicit for visibility.
      - name: RETURN PASS generated-region check (return_pass.py)
        run: python3 docs/build/tools/return_pass.py check

      # P34.33 (B4 G9/G7-item-5/G10; amended SIG-ENG-031): the round-close
      # record checks — unique risk ids via dated appended disambiguation,
      # deferred rows routed to open homes, round banners citing spec parts,
      # frozen-view pointers, the capstone two-sum. Also inside `make
      # docs-check` (docs-check-round-close); explicit for visibility.
      - name: Round-close record checks (check_round_close.py)
        run: python3 docs/build/tools/check_round_close.py check

      # P35.3 (B4 G10, SIG-MEM-011): the live-claim binding — corpus mode runs
      # inside `make docs-check` (docs-check-live-claims); named here for the
      # same visibility reason as the ledger/round-close steps above.
      - name: Live-claim citation lint (corpus)
        run: python3 docs/build/tools/check_live_claims.py corpus --json docs/build/logs/live-claims.json

      # P35.3 (B4 G10, SIG-MEM-011): the range leg — every production-state
      # claim this change *adds* on a corpus surface must cite a
      # sig.probe-run/1 record ≤ 24 h old at the head commit. PR-only, like
      # the CHANGELOG gate: a landed head was already judged at PR time.
      # Exits 1 (uncited claim) / 2 (usage) / 3 (vacuous) are all red.
      - name: Live-claim citation lint (PR range)
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        run: python3 docs/build/tools/check_live_claims.py range --range "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" --json docs/build/logs/live-claims-range.json

      # BM-HIST-01 (SEED-02): the lines this PR adds or removes in build-memory
      # records — record dates, append-only regions, record shape, gate records,
      # readouts. check-history.sh hands off to docs/build/tools/memory_guard.py.
      # Exit 1 (violation), 3 (vacuous) and 5 (unknown: shallow clone, bad range)
      # are all red — never `|| true`. `!cancelled()`: this verdict and the trailer
      # check's are reported even when an earlier docs step is red (the job still fails).
      - name: Build-memory history guard (memory_guard.py over the PR range)
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 --version
          bash scripts/docs/check-build-memory.sh . --range "$BASE_SHA...$HEAD_SHA" --json docs/build/logs/build-memory-history.json

      # The push-side twin (P34.1 / CF-01): on a push to `main` the guard judges
      # the landed head's first-parent diff — the same change the PR judged.
      - name: Build-memory history guard (first-parent diff of the landed head)
        if: ${{ github.event_name == 'push' && !cancelled() }}
        run: |
          python3 --version
          bash scripts/docs/check-build-memory.sh . --first-parent "${{ github.sha }}" --json docs/build/logs/build-memory-history.json

      # OM-01 (plan §3.3; A-21 — commits keep the operator's name as author): every
      # commit of the change carries a recognised harness trailer, or is an
      # operator commit (`Harness: operator`, a valid OP-25 signature, a GitHub
      # merge). Exit 1 (an untrailered agent commit), 3 (vacuous) and 5 (unknown)
      # are red. On a push the range is the push's commits (event.before...sha),
      # falling back to the landed head itself when `before` is absent/zero.
      - name: Commit trailer check (OM-01)
        if: ${{ !cancelled() }}
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          python3 docs/build/tools/check_trailers.py --range "$base...$head" --json docs/build/logs/trailer-check.json

      # G4c (P34.28; SIG-SEC-010; OP-25; ADR-147 decision 6; A-16 "Key + forward
      # rule"): every gate-affecting record this change adds — a readout
      # `Status:` moving to a signed status (HG-gate signature / Class-S go), a
      # GATE DECISIONS decision|waiver|pre-authorization row, an
      # `ingestion_permitted` false→true flip — must be covered by an
      # operator-signed commit (or, for a flip, an operator-signed GATE
      # DECISIONS row naming the source), verified against `allowed_signers`
      # read AT THE BASE so a change cannot authorise its own signer. While the
      # file is header-only — the OP-25 key outstanding — any such record is
      # red (fail-closed; D-P34.28-1). Same range as the trailer check;
      # exits 1/3/5 are all red.
      - name: Signed-gate origin check (G4c, OP-25)
        if: ${{ !cancelled() }}
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          python3 docs/build/tools/check_gate_signatures.py --range "$base...$head" --json docs/build/logs/gate-signature-check.json

      # SIG-REL-014 (P34.23, G3 §9.4): a public-behaviour change cannot merge
      # without a CHANGELOG entry — a PR touching the §9.4 path set
      # (web/src/pages|layouts, api routes/app/models, exports
      # release*/spine_export/manifest, the two ops tomls, policy/**,
      # ontology/src/**) must change CHANGELOG.md, unless a commit in the
      # range carries a `Changelog: none (<reason>)` trailer. Exit 1
      # (violation), 3 (vacuous) and 5 (unknown) are all red. PR-only: a
      # landed head was already judged at PR time.
      - name: CHANGELOG discipline gate (SIG-REL-014)
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        run: python3 docs/build/tools/changelog_gate.py --range "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" --json docs/build/logs/changelog-gate.json

      # G3b recorded-CI verifier (P34.2, SIG-MEM-007, B4 §G3b): every `ci:` line
      # this change ADDS is verified against the live GitHub records — each
      # recorded run id resolves to a run whose head_sha carries the recorded
      # sha and whose conclusion is `success`, and a bare `ci: pass #N@sha`
      # re-checks the sha's head-bound required check-runs. A Round-11 PHASE
      # LOG `done` entry added without a `ci:` field fails. On a pull request
      # the scope is base...head; on a push it is the push's commits
      # (event.before...sha, landed-head fallback). Read-only `gh api` GETs —
      # it never re-runs anything (the one re-run per head is the boundary
      # tool's, B-15). Unavailable GitHub state is UNKNOWN, never green.
      - name: Recorded-CI verifier (G3b — added `ci:` lines vs GitHub)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          python3 docs/build/tools/verify_recorded_ci.py --diff-base "$base" --json docs/build/logs/recorded-ci-verify.json

  python:
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
        with:
          # P34.31 (G6, SIG-ENG-040): the living-backtest real-tree floor test
          # replays tests across first-parent living-change transitions —
          # a depth-1 checkout has none to replay.
          fetch-depth: 0

      # Authenticated Docker Hub pulls (DOCKERHUB-RATE-* flake class): the
      # anonymous 100-pulls/6h per-IP limit saturates on shared runner egress.
      # No-op until the operator sets DOCKERHUB_USERNAME/DOCKERHUB_TOKEN.
      - name: Log in to Docker Hub (authenticated pulls)
        if: env.DOCKERHUB_USERNAME != ''
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin || echo "::warning::docker login failed (Docker Hub unreachable) — falling back to anonymous pulls"

      - name: Install uv (pinned; matches `[tool.uv] required-version`)
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install Python (pinned by .python-version)
        run: uv python install

      - name: Install workspace from the committed lockfile
        run: make sync

      - name: Lint
        run: make lint

      - name: Format check
        run: make format-check

      - name: Type-check
        run: make typecheck

      # The claim-spine DB tests (P02.1) stand up PostgreSQL 18 + PostGIS in a
      # throwaway container and apply the sqitch plan against it (SIG-STORE-024).
      # ubuntu-24.04 ships a running Docker daemon; SIG_REQUIRE_DB_TESTS turns a
      # missing daemon into a failure so the RLS/append-only suite can never
      # silently skip. Ryuk is disabled — the fixtures clean up explicitly.
      - name: Test
        run: make test-par
        env:
          SIG_REQUIRE_DB_TESTS: "1"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          # P34.2: the suite's GCP leak check fails closed when the id is unset
          # (an unarmed needle is not a pass) — the repo variable arms it here
          # too, the same value the `security` job's dedicated step gets.
          SIG_GCP_PROJECT: ${{ vars.SIG_GCP_PROJECT }}

      # P34.24a / ADR-196 (SIG-ENG-045): the whole-plan sqitch lifecycle gate —
      # a template0 database, deploy -> verify -> revert -y -> clean-state
      # asserts -> redeploy -> verify, from the digest-pinned sqitch image.
      # The step log is the cited evidence for D-P32.10a-1 / D-P32.16a-1.
      - name: Sqitch whole-plan round trip
        run: make test-sqitch-roundtrip

      - name: Generated artifacts match a fresh generation
        run: make verify-gen

  # The composed-stack e2e run FOR REAL (CI.1 / GL-CI-01 — closes the P20.4 /
  # CI-RED-01 gap honestly): ubuntu-24.04 ships a running Docker daemon and this
  # job installs Node + web/node_modules, so the whole tests/e2e suite — seams
  # S1..S8 including the web build (LD-V08, crossed by P21.4) — actually runs
  # instead of skipping. The `python` job above also runs tests/e2e (Docker is
  # present there) but S8's web-build fixtures skip without node_modules — this
  # job is the one that proves the composed suite WITH the web build present.
  # SIG_REQUIRE_DB_TESTS=1 turns a missing daemon into a hard failure: the
  # composed gate can never silently no-op.
  composed:
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub (authenticated pulls)
        if: env.DOCKERHUB_USERNAME != ''
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin || echo "::warning::docker login failed (Docker Hub unreachable) — falling back to anonymous pulls"

      - name: Install uv (pinned; matches `[tool.uv] required-version`)
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install Python (pinned by .python-version)
        run: uv python install

      - name: Install workspace from the committed lockfile
        run: make sync

      - name: Install Node (exact pin from web/.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The same toolchain locally and in CI (SIG-ENG-046): the exact npm of
      # `web/package.json` `packageManager` is installed, then both versions are
      # printed so the log records what ran (and a drift is a visible diff).
      - name: Install the pinned npm and print the toolchain
        run: |
          npm install -g "npm@$(node -p "require('./web/package.json').packageManager.split('@').pop()")"
          node -v
          npm -v

      # Lockfile truth gate: regenerate the lockfile under the pinned npm and
      # fail on any diff — a lockfile the pinned toolchain would write
      # differently is drift, caught at PR time (H1 §2a).
      - name: Fail on lockfile drift under the pinned toolchain
        run: |
          npm --prefix web install --package-lock-only --ignore-scripts
          git diff --exit-code -- web/package-lock.json

      - name: Install web deps (the S8 web-build fixtures need web/node_modules)
        run: npm --prefix web ci

      - name: Composed e2e — tests/e2e with Docker + the web build present
        run: uv run pytest tests/e2e
        env:
          SIG_REQUIRE_DB_TESTS: "1"
          TESTCONTAINERS_RYUK_DISABLED: "true"

  # Dependency licence + secret scanning (CI.1 / GL-CI-01, ADR-078). These two
  # gates are deterministic and offline, so they run on every PR — a committed
  # secret is a permanent leak and a bad licence is cheapest to catch at change
  # time; the dependency *vulnerability* audit (pip-audit → OSV) needs network
  # and advisories drift without a commit, so it rides nightly.yml instead.
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv (pinned; matches `[tool.uv] required-version`)
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install Python (pinned by .python-version)
        run: uv python install

      - name: Install workspace from the committed lockfile
        run: make sync

      - name: Secret scan over every tracked file
        run: make scan-secrets

      # Armed, FAIL-CLOSED leak check (ADR-119 / D-P30.4-4, operator Q7 = (a);
      # P34.2 deliverable 7): the scoped test greps code + config for a literal
      # GCP project id and reports candidates/evaluated. The id is a repo
      # VARIABLE, not a credential — it is already recorded publicly in the
      # append-only build memory, which the check deliberately exempts. An unset
      # `vars.SIG_GCP_PROJECT` is a RED, not a skip — a check without its needle
      # never passes vacuously (SIG-ENG-042).
      - name: GCP project-id leak check (code + config scope; fails when unarmed)
        run: uv run pytest tests/connectors/test_secrets.py::test_gcp_project_id_is_env_resolved_not_committed
        env:
          SIG_GCP_PROJECT: ${{ vars.SIG_GCP_PROJECT }}

      - name: Dependency licence scan (mirrors the web job's OSI/excluded-category gate)
        run: make scan-licenses

      # The npm advisory gate needs the pinned toolchain (P34.2 deliverable 6).
      - name: Install Node (exact pin from web/.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the pinned npm and print the toolchain
        run: |
          npm install -g "npm@$(node -p "require('./web/package.json').packageManager.split('@').pop()")"
          node -v
          npm -v

      # Per-PR advisory gate (P34.2, SIG-ENG-042): production deps only,
      # `--audit-level=high` — a new high+ advisory in the shipped tree fails
      # the PR. The driver (`scripts/ci/npm_audit_gate.sh`) is the same command
      # `make ci-local` runs; it preserves npm audit's status — rc 1 means
      # "findings present" (the gate judges them), rc > 1 is an audit error and
      # red either way. The committed allow-list carries NO production entries
      # today; the nightly audits the full tree against it (`--full`).
      - name: npm advisory gate (production deps, high+)
        run: bash scripts/ci/npm_audit_gate.sh --out .

  # The Phase-15 web shell (SIG-UI-036..041). Confined to web/ (SIG-ENG-010). This
  # job IS the CI enforcement of the shell's mandated gates: WCAG 2.2 AA (axe), the
  # OSI-only dependency licence check, and the performance budgets — "checked in CI,
  # not by memory" (SIG-UI-039) and "the build fails on regression" (SIG-UI-041).
  web:
    runs-on: ubuntu-24.04
    # `actions: read` lets the reuse decision read the pass-record cache through
    # the REST API (`GET /actions/caches?key=…`, P35.41a D2); `contents: read`
    # is the checkout floor.
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash # keep pipefail under the job's working-directory override
        working-directory: web
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub (authenticated pulls)
        if: env.DOCKERHUB_USERNAME != ''
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin || echo "::warning::docker login failed (Docker Hub unreachable) — falling back to anonymous pulls"

      - name: Install Node (exact pin from web/.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The same toolchain locally and in CI (SIG-ENG-046): the exact npm of
      # `web/package.json` `packageManager` is installed, then both versions are
      # printed so the log records what ran (and a drift is a visible diff).
      - name: Install the pinned npm and print the toolchain
        run: |
          npm install -g "npm@$(node -p "require('./package.json').packageManager.split('@').pop()")"
          node -v
          npm -v

      # Lockfile truth gate: regenerate the lockfile under the pinned npm and
      # fail on any diff — drift is caught at PR time (H1 §2a).
      - name: Fail on lockfile drift under the pinned toolchain
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json

      - name: Install from the committed lockfile
        run: npm ci

      # --- P35.41a (D2): fixture-mode Lighthouse reuse. --------------------
      # A records-only push cannot change the fixture-mode `Performance
      # budgets` measurement. `decide` answers `reuse` only for a same-PR
      # head whose recorded pass carries the byte-identical non-records
      # fingerprint on the same runner image; everything else — push,
      # dispatch, fork, image change, unaudited coupling hit, symlink or
      # gitlink, ANY error — fails closed to `run`.
      - name: Perf reuse — fingerprint
        id: perffp
        working-directory: ${{ github.workspace }}
        run: |
          fp="$(python3 scripts/ci/perf_reuse.py fingerprint HEAD)" || fp=""
          echo "fp=${fp}" >> "$GITHUB_OUTPUT"

      - name: Perf reuse — restore the pass record
        if: github.event_name == 'pull_request' && steps.perffp.outputs.fp != ''
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/perf-pass
          key: perf-pass-v1-${{ steps.perffp.outputs.fp }}-none
          restore-keys: perf-pass-v1-${{ steps.perffp.outputs.fp }}-

      - name: Perf reuse — decide
        id: perf
        working-directory: ${{ github.workspace }}
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_FINGERPRINT: ${{ steps.perffp.outputs.fp }}
          CI_RECORD: ${{ runner.temp }}/perf-pass/record
        run: |
          export CI_IMAGE="${ImageOS:-}-${ImageVersion:-}"
          rc=0; out="$(python3 scripts/ci/perf_reuse.py decide)" || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ] && [ "$(printf '%s\n' "$out" | tail -n 1)" = "reuse" ]; then
            echo "mode=reuse" >> "$GITHUB_OUTPUT"; else echo "mode=run" >> "$GITHUB_OUTPUT"; fi

      - name: Type-check (astro check)
        run: npm run typecheck

      - name: Unit tests (epistemic logic + design-token invariants)
        run: npm run test:unit

      - name: Build the static site (zero-JS-by-default)
        run: npm run build

      - name: Dependency licence gate (OSI only; excludes CC-BY-NC / source-available / BUSL)
        run: npm run check:licenses

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end + WCAG 2.2 AA (axe) + no-JS baseline
        run: npm run test:e2e

      # D2's only reuse gate — every other step still runs on every head.
      - name: Performance budgets (build fails on regression)
        if: steps.perf.outputs.mode != 'reuse'
        run: npm run check:perf

      # --- P34.34b (ACT-16b, C4 NEW-26, DR-C4-13; SIG-FIND-005): --------------
      # the export-mode leg. A REAL from-spine fixture export — the producer
      # stands up PG18+PostGIS, deploys the true db/sqitch.plan, seeds the
      # licence-safe tests/db spine and runs `run_spine_export`, never the
      # web-fixture serializer — feeds a SIG_DATA_SOURCE=export build; the
      # per-island budgets and Lighthouse (incl. /releases/,
      # /research-dossier/ and one archive record) then run over THAT build.
      # The P32.23a-candidate export-mode failure can never again merge green.
      # `scripts/ci/export_mode_leg.sh` is the single source of the commands —
      # `make check-export-mode` (reachable from `make ci-local`) runs the
      # same subcommands locally.

      - name: Install uv (pinned; matches `[tool.uv] required-version`)
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install Python (pinned by .python-version)
        working-directory: ${{ github.workspace }}
        run: uv python install

      - name: Install workspace from the committed lockfile
        working-directory: ${{ github.workspace }}
        run: make sync

      - name: From-spine fixture export (seeded PG spine → run_spine_export → release)
        working-directory: ${{ github.workspace }}
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: bash scripts/ci/export_mode_leg.sh produce

      # AC-1's negative half runs BEFORE the real build: a deliberately broken
      # export input (an empty directory — manifest.json absent) must FAIL the
      # build loudly, and a silent fall-back to fixtures turns this step red
      # (SIG-UI-036). Before, not after — the doomed build can leave dist
      # half-written, and the measurement steps must see exactly the real
      # build's output.
      - name: Export-mode build fails loud on a missing export (no fixture fall-back)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/export_mode_leg.sh verify-fail-loud

      - name: Export-mode build (SIG_DATA_SOURCE=export over the from-spine export)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/export_mode_leg.sh build

      # DR-C4-13's "one archive record": publication + entity ids are
      # content-derived and differ every run, so the committed collect URL
      # mounts the release-builder's own record bytes at a stable alias
      # (record pages are self-contained — no scripts, no external assets).
      - name: Mount the archive record (stable URL over the release tree's real bytes)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/export_mode_leg.sh mount-record

      # P35.3 (B4 G10, SIG-OPS-012 + DR-C3-03): the fixture-sentinel scan and
      # the claim-marker check over the export-mode web build — the public
      # surface built from real from-spine bytes, post mount-record. A
      # sentinel hit outside a declared fixture compartment fails; a
      # human-completion assertion without a recorded marker fails (an agent
      # label never counts). Each emits a sig.probe-run/1 record to the step
      # log — the committed records live under docs/build/reports/probes/.
      - name: Fixture-sentinel + claim-marker scans over the export-mode build
        working-directory: ${{ github.workspace }}
        run: |
          uv run sig-ops sentinel-scan --scan web/dist
          uv run sig-ops claim-marker-scan --scan web/dist

      - name: Page-type budgets over the export-mode build (ADR-155 ceilings)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/export_mode_leg.sh budgets

      - name: Lighthouse over the export-mode build (Round-10 routes + one archive record)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/export_mode_leg.sh lighthouse

      # --- P35.51 (SIG-UI-041, SIG-FIND-005, K0 §4.12.6): the national leg. ---
      # The deterministic synthetic national fixture (≥ 232k sites / ≥ 5k
      # agencies / ≥ 400k sharing edges, invented names only — F-173) is the
      # state every budget row is measured under at real scale: the same
      # generalised budget suite and the generated national Lighthouse matrix
      # run over the SIG_DATA_SOURCE=national build, with the recorded
      # national-scoped measured_gaps binding (never a hidden overage).
      # `scripts/ci/national_budget_leg.sh` is the single source of the
      # commands — `npm run check:perf:national` runs the same leg locally.

      - name: National fixture (deterministic synthetic corpus, real-scale)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/national_budget_leg.sh fixture

      - name: National build (SIG_DATA_SOURCE=national over the overlay)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/national_budget_leg.sh build

      - name: National page budgets (wire measure; real-scale gaps bound)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/national_budget_leg.sh budgets

      - name: National Lighthouse (generated national assert matrix)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/national_budget_leg.sh lighthouse

      # --- P35.52 (sig.map-tiles/2, ADR-156, F-104/F-414; K1 §15 NEW-5): ----
      # the tile verifier leg. The retention contract can't be proven by the
      # mocked-argv tests alone — the PINNED tippecanoe (the same pin
      # ops/Dockerfile carries; built once into the actions cache) renders the
      # deterministic 50k synthetic fixture (clustered cities + co-located +
      # byte-identical twins, three licence compartments, all tiers), then
      # `sig-exports tiles verify` measures the six checks — conservation,
      # renderer parity (non-vacuous under tippecanoe), precision+tier, size,
      # metadata — over the shipped bytes.
      - name: Resolve the pinned tippecanoe (ops/Dockerfile pin)
        id: tippecanoe
        working-directory: ${{ github.workspace }}
        run: |
          v=$(sed -n 's/^ARG TIPPECANOE_VERSION=//p' ops/Dockerfile | head -1)
          s=$(sed -n 's/^ARG TIPPECANOE_SHA256=//p' ops/Dockerfile | head -1)
          echo "key=tippecanoe-${v}-${s:0:16}" >> "$GITHUB_OUTPUT"
      - name: Pinned tippecanoe build cache
        uses: actions/cache@v6
        with:
          path: .cache/sig-tippecanoe
          key: ${{ steps.tippecanoe.outputs.key }}
      - name: Build the pinned tippecanoe (no-op on cache hit)
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libsqlite3-dev zlib1g-dev
          bash scripts/ci/build_tippecanoe.sh .cache/sig-tippecanoe
      - name: Tile fixture + verifier (pinned tippecanoe over the synthetic 50k)
        working-directory: ${{ github.workspace }}
        # env.PATH is empty in the env context — prepend at runtime instead.
        run: |
          PATH="$GITHUB_WORKSPACE/.cache/sig-tippecanoe:$PATH" bash scripts/ci/tile_verify_leg.sh fixture
          PATH="$GITHUB_WORKSPACE/.cache/sig-tippecanoe:$PATH" bash scripts/ci/tile_verify_leg.sh verify

      # Record + save only at the END of a green same-repo PR job whose
      # fixture step actually measured (`mode != 'reuse'` writes nothing).
      - name: Perf reuse — write the pass record
        id: perfrec
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.perf.outputs.mode != 'reuse' && steps.perffp.outputs.fp != ''
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_RECORD_OUT: ${{ runner.temp }}/perf-pass/record
        run: |
          export CI_IMAGE="${ImageOS:-}-${ImageVersion:-}"
          mkdir -p "$(dirname "$CI_RECORD_OUT")"
          python3 scripts/ci/perf_reuse.py record

      - name: Perf reuse — save
        if: steps.perfrec.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/perf-pass
          key: perf-pass-v1-${{ steps.perffp.outputs.fp }}-${{ github.run_id }}-${{ github.run_attempt }}
