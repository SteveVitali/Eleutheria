#
# CI (SIG-ENG-015/016 wiring): lint, type-check, test, and the
# "generated artifacts match a fresh generation" gate — run green on the empty
# skeleton. Install is strictly from the committed lockfile (uv --frozen).
# Runner: every job pins `ubuntu-24.04` (S6R-27, FEA-16 — the `ubuntu-latest`
# label moves to Ubuntu 26 from 2026-10-19).
# Toolchain pin (SIG-ENG-046, P34.1, ADR-151): Node from `web/.nvmrc`, npm from
# `web/package.json` `packageManager`, uv from `pyproject.toml`
# `[tool.uv] required-version` — the same pins `make ci-local` runs locally.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Workflow-level `bash` = `bash --noprofile --norc -eo pipefail` on the runner
# (SIG-ENG-046): a failing command on the left of any `| tee`/pipe fails the step.
defaults:
  run:
    shell: bash

# PR runs stay cancellable (a newer head supersedes an older one); a run for a
# push to `main` is never cancelled — SIG-ENG-046 requires a completed main run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Documentation freshness gate (P22.2, ADR-072). Runs BOTH vendored detectors
  # (human-facing repo docs from P22.1 + the agent-facing AGENTS.md hierarchy) on
  # pull requests AND on pushes to `main` (P34.1 / CF-01, ADR-151 — the guards
  # judge landed commits too, so a change cannot dodge them by merging).
  # Structural checks only — deterministic, no LLM — so drift (broken
  # references, coverage gaps) is caught at change time, not by a periodic
  # sweep. Pure bash + git; no uv/toolchain needed. Kept out of `make check`
  # because the two detectors together take ~30s (>10s), so they run here.
  #
  # Round 11 (SEED-02b; B4 G3/G7, plan App. A T2): `make docs-check` also runs the
  # build-memory history guard on the working tree, the spec-source checker and the
  # coverage-matrix checker, and the last steps judge the change's own commits —
  # on a pull request the history guard runs over base...head (BM-HIST-01) and
  # the trailer check over the same range; on a push to `main` the guard runs
  # over the landed head's first-parent diff and the trailer check over the
  # push's commits (event.before...sha, the landed head itself as fallback).
  # P34.2 (G3b, SIG-MEM-007): the last step re-verifies every `ci:` line the
  # change adds against GitHub — `actions:read` + `checks:read` are needed for
  # the run/check-runs reads. All stdlib python3: the runner's system Python
  # (3.12 on ubuntu-24.04); no uv.
  docs:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the detectors classify missing refs via git history; the history guards need it

      - name: Documentation freshness (both detectors)
        run: make docs-check

      # CI.1 / GL-CI-01: the build-memory layout gate is named explicitly per the
      # contract (it also runs inside `make docs-check` above — this step keeps
      # the enforcement visible even if the docs-check composition changes).
      - name: Build-memory layout gate (check-build-memory.sh)
        run: bash scripts/docs/check-build-memory.sh .

      # P34.9 (B3 §6 V1–V13, G5/G11): the ledger contract — orient budget,
      # CURRENT STATE vocabularies, named paths, stale tokens, PHASE LOG /
      # BUILD_INDEX / RETURN PASS / GATE DECISIONS well-formedness — is checked,
      # not trusted; a check that evaluated none of a non-empty candidate set is
      # vacuous (exit 3, red). Named explicitly for the same visibility reason.
      - name: Ledger-contract gate (ledger_contract.py)
        run: python3 docs/build/tools/ledger_contract.py check --json docs/build/logs/ledger-contract.json

      # P34.9 (B4 V9): the committed current-state projection is verified
      # against its recorded input digests — drift, a known inconsistency, or an
      # obligation landing naming no chain/BACKLOG row is red. Also inside
      # `make docs-check` (docs-check-projection); explicit for visibility.
      - name: Current-state projection verify (current_projection.py)
        run: python3 docs/build/tools/current_projection.py verify

      # BM-HIST-01 (SEED-02): the lines this PR adds or removes in build-memory
      # records — record dates, append-only regions, record shape, gate records,
      # readouts. check-history.sh hands off to docs/build/tools/memory_guard.py.
      # Exit 1 (violation), 3 (vacuous) and 5 (unknown: shallow clone, bad range)
      # are all red — never `|| true`. `!cancelled()`: this verdict and the trailer
      # check's are reported even when an earlier docs step is red (the job still fails).
      - name: Build-memory history guard (memory_guard.py over the PR range)
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 --version
          bash scripts/docs/check-build-memory.sh . --range "$BASE_SHA...$HEAD_SHA" --json docs/build/logs/build-memory-history.json

      # The push-side twin (P34.1 / CF-01): on a push to `main` the guard judges
      # the landed head's first-parent diff — the same change the PR judged.
      - name: Build-memory history guard (first-parent diff of the landed head)
        if: ${{ github.event_name == 'push' && !cancelled() }}
        run: |
          python3 --version
          bash scripts/docs/check-build-memory.sh . --first-parent "${{ github.sha }}" --json docs/build/logs/build-memory-history.json

      # OM-01 (plan §3.3; A-21 — commits keep the operator's name as author): every
      # commit of the change carries a recognised harness trailer, or is an
      # operator commit (`Harness: operator`, a valid OP-25 signature, a GitHub
      # merge). Exit 1 (an untrailered agent commit), 3 (vacuous) and 5 (unknown)
      # are red. On a push the range is the push's commits (event.before...sha),
      # falling back to the landed head itself when `before` is absent/zero.
      - name: Commit trailer check (OM-01)
        if: ${{ !cancelled() }}
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          python3 docs/build/tools/check_trailers.py --range "$base...$head" --json docs/build/logs/trailer-check.json

      # SIG-REL-014 (P34.23, G3 §9.4): a public-behaviour change cannot merge
      # without a CHANGELOG entry — a PR touching the §9.4 path set
      # (web/src/pages|layouts, api routes/app/models, exports
      # release*/spine_export/manifest, the two ops tomls, policy/**,
      # ontology/src/**) must change CHANGELOG.md, unless a commit in the
      # range carries a `Changelog: none (<reason>)` trailer. Exit 1
      # (violation), 3 (vacuous) and 5 (unknown) are all red. PR-only: a
      # landed head was already judged at PR time.
      - name: CHANGELOG discipline gate (SIG-REL-014)
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        run: python3 docs/build/tools/changelog_gate.py --range "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" --json docs/build/logs/changelog-gate.json

      # G3b recorded-CI verifier (P34.2, SIG-MEM-007, B4 §G3b): every `ci:` line
      # this change ADDS is verified against the live GitHub records — each
      # recorded run id resolves to a run whose head_sha carries the recorded
      # sha and whose conclusion is `success`, and a bare `ci: pass #N@sha`
      # re-checks the sha's head-bound required check-runs. A Round-11 PHASE
      # LOG `done` entry added without a `ci:` field fails. On a pull request
      # the scope is base...head; on a push it is the push's commits
      # (event.before...sha, landed-head fallback). Read-only `gh api` GETs —
      # it never re-runs anything (the one re-run per head is the boundary
      # tool's, B-15). Unavailable GitHub state is UNKNOWN, never green.
      - name: Recorded-CI verifier (G3b — added `ci:` lines vs GitHub)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          python3 docs/build/tools/verify_recorded_ci.py --diff-base "$base" --json docs/build/logs/recorded-ci-verify.json

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv (pinned; matches `[tool.uv] required-version`)
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install Python (pinned by .python-version)
        run: uv python install

      - name: Install workspace from the committed lockfile
        run: make sync

      - name: Lint
        run: make lint

      - name: Format check
        run: make format-check

      - name: Type-check
        run: make typecheck

      # The claim-spine DB tests (P02.1) stand up PostgreSQL 18 + PostGIS in a
      # throwaway container and apply the sqitch plan against it (SIG-STORE-024).
      # ubuntu-24.04 ships a running Docker daemon; SIG_REQUIRE_DB_TESTS turns a
      # missing daemon into a failure so the RLS/append-only suite can never
      # silently skip. Ryuk is disabled — the fixtures clean up explicitly.
      - name: Test
        run: make test
        env:
          SIG_REQUIRE_DB_TESTS: "1"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          # P34.2: the suite's GCP leak check fails closed when the id is unset
          # (an unarmed needle is not a pass) — the repo variable arms it here
          # too, the same value the `security` job's dedicated step gets.
          SIG_GCP_PROJECT: ${{ vars.SIG_GCP_PROJECT }}

      - name: Generated artifacts match a fresh generation
        run: make verify-gen

  # The composed-stack e2e run FOR REAL (CI.1 / GL-CI-01 — closes the P20.4 /
  # CI-RED-01 gap honestly): ubuntu-24.04 ships a running Docker daemon and this
  # job installs Node + web/node_modules, so the whole tests/e2e suite — seams
  # S1..S8 including the web build (LD-V08, crossed by P21.4) — actually runs
  # instead of skipping. The `python` job above also runs tests/e2e (Docker is
  # present there) but S8's web-build fixtures skip without node_modules — this
  # job is the one that proves the composed suite WITH the web build present.
  # SIG_REQUIRE_DB_TESTS=1 turns a missing daemon into a hard failure: the
  # composed gate can never silently no-op.
  composed:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv (pinned; matches `[tool.uv] required-version`)
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install Python (pinned by .python-version)
        run: uv python install

      - name: Install workspace from the committed lockfile
        run: make sync

      - name: Install Node (exact pin from web/.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The same toolchain locally and in CI (SIG-ENG-046): the exact npm of
      # `web/package.json` `packageManager` is installed, then both versions are
      # printed so the log records what ran (and a drift is a visible diff).
      - name: Install the pinned npm and print the toolchain
        run: |
          npm install -g "npm@$(node -p "require('./web/package.json').packageManager.split('@').pop()")"
          node -v
          npm -v

      # Lockfile truth gate: regenerate the lockfile under the pinned npm and
      # fail on any diff — a lockfile the pinned toolchain would write
      # differently is drift, caught at PR time (H1 §2a).
      - name: Fail on lockfile drift under the pinned toolchain
        run: |
          npm --prefix web install --package-lock-only --ignore-scripts
          git diff --exit-code -- web/package-lock.json

      - name: Install web deps (the S8 web-build fixtures need web/node_modules)
        run: npm --prefix web ci

      - name: Composed e2e — tests/e2e with Docker + the web build present
        run: uv run pytest tests/e2e
        env:
          SIG_REQUIRE_DB_TESTS: "1"
          TESTCONTAINERS_RYUK_DISABLED: "true"

  # Dependency licence + secret scanning (CI.1 / GL-CI-01, ADR-078). These two
  # gates are deterministic and offline, so they run on every PR — a committed
  # secret is a permanent leak and a bad licence is cheapest to catch at change
  # time; the dependency *vulnerability* audit (pip-audit → OSV) needs network
  # and advisories drift without a commit, so it rides nightly.yml instead.
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv (pinned; matches `[tool.uv] required-version`)
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install Python (pinned by .python-version)
        run: uv python install

      - name: Install workspace from the committed lockfile
        run: make sync

      - name: Secret scan over every tracked file
        run: make scan-secrets

      # Armed, FAIL-CLOSED leak check (ADR-119 / D-P30.4-4, operator Q7 = (a);
      # P34.2 deliverable 7): the scoped test greps code + config for a literal
      # GCP project id and reports candidates/evaluated. The id is a repo
      # VARIABLE, not a credential — it is already recorded publicly in the
      # append-only build memory, which the check deliberately exempts. An unset
      # `vars.SIG_GCP_PROJECT` is a RED, not a skip — a check without its needle
      # never passes vacuously (SIG-ENG-042).
      - name: GCP project-id leak check (code + config scope; fails when unarmed)
        run: uv run pytest tests/connectors/test_secrets.py::test_gcp_project_id_is_env_resolved_not_committed
        env:
          SIG_GCP_PROJECT: ${{ vars.SIG_GCP_PROJECT }}

      - name: Dependency licence scan (mirrors the web job's OSI/excluded-category gate)
        run: make scan-licenses

      # The npm advisory gate needs the pinned toolchain (P34.2 deliverable 6).
      - name: Install Node (exact pin from web/.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the pinned npm and print the toolchain
        run: |
          npm install -g "npm@$(node -p "require('./web/package.json').packageManager.split('@').pop()")"
          node -v
          npm -v

      # Per-PR advisory gate (P34.2, SIG-ENG-042): production deps only,
      # `--audit-level=high` — a new high+ advisory in the shipped tree fails
      # the PR. The driver (`scripts/ci/npm_audit_gate.sh`) is the same command
      # `make ci-local` runs; it preserves npm audit's status — rc 1 means
      # "findings present" (the gate judges them), rc > 1 is an audit error and
      # red either way. The committed allow-list carries NO production entries
      # today; the nightly audits the full tree against it (`--full`).
      - name: npm advisory gate (production deps, high+)
        run: bash scripts/ci/npm_audit_gate.sh --out .

  # The Phase-15 web shell (SIG-UI-036..041). Confined to web/ (SIG-ENG-010). This
  # job IS the CI enforcement of the shell's mandated gates: WCAG 2.2 AA (axe), the
  # OSI-only dependency licence check, and the performance budgets — "checked in CI,
  # not by memory" (SIG-UI-039) and "the build fails on regression" (SIG-UI-041).
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash # keep pipefail under the job's working-directory override
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Install Node (exact pin from web/.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The same toolchain locally and in CI (SIG-ENG-046): the exact npm of
      # `web/package.json` `packageManager` is installed, then both versions are
      # printed so the log records what ran (and a drift is a visible diff).
      - name: Install the pinned npm and print the toolchain
        run: |
          npm install -g "npm@$(node -p "require('./package.json').packageManager.split('@').pop()")"
          node -v
          npm -v

      # Lockfile truth gate: regenerate the lockfile under the pinned npm and
      # fail on any diff — drift is caught at PR time (H1 §2a).
      - name: Fail on lockfile drift under the pinned toolchain
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json

      - name: Install from the committed lockfile
        run: npm ci

      - name: Type-check (astro check)
        run: npm run typecheck

      - name: Unit tests (epistemic logic + design-token invariants)
        run: npm run test:unit

      - name: Build the static site (zero-JS-by-default)
        run: npm run build

      - name: Dependency licence gate (OSI only; excludes CC-BY-NC / source-available / BUSL)
        run: npm run check:licenses

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end + WCAG 2.2 AA (axe) + no-JS baseline
        run: npm run test:e2e

      - name: Performance budgets (build fails on regression)
        run: npm run check:perf
