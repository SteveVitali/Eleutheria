#
# Nightly composed run + scanning (CI.1 / GL-CI-01, ADR-078).
#
# Every night (03:00 UTC — ahead of reingest 05:00 and observability 06:00) this
# job re-runs the composed tests/e2e for real (Docker + the web build present,
# SIG_REQUIRE_DB_TESTS=1 so nothing can silently skip) and runs the three scans:
# dependency vulnerability audit (pip-audit → OSV; needs network — advisories
# drift without a commit, which is exactly why it runs on a schedule), the
# dependency licence gate, and the tracked-file secret scan.
#
# Every stage runs `continue-on-error` so the nightly REPORT is complete even on
# red — a report that only exists on green is the wrong shape. The report step
# (scripts/ci/nightly_report.py) is itself the gate: it writes
# nightly-report.md, uploads it `if: always()`, and exits non-zero when any
# stage failed — a red nightly is loud, not silent.

name: nightly

on:
  schedule:
    # 03:00 UTC daily — ahead of the reingest (05:00) and observability (06:00)
    # sweeps so a broken composed run is reported before they spend calls.
    - cron: "0 3 * * *"
  # Manual trigger so an operator can produce the report on demand.
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  # Never cancel a running nightly — the report must complete even on a slow day.
  cancel-in-progress: false

permissions:
  contents: read
  # P34.2 (G3b): the recorded-CI verifier stage reads workflow runs and
  # check-runs through `gh api` — read-only, never a mutation.
  actions: read
  checks: read

# Workflow-level `bash` = `bash --noprofile --norc -eo pipefail` on the runner
# (SIG-ENG-046, P34.1): every `| tee` below then reports the LEFT side's failure —
# without pipefail a red stage previously exited 0 through `tee` (NEW-3).
defaults:
  run:
    shell: bash

jobs:
  nightly:
    runs-on: ubuntu-24.04  # pinned (S6R-27: ubuntu-latest moves to Ubuntu 26 on 2026-10-19)
    steps:
      - uses: actions/checkout@v7
        with:
          # the memory replay needs the whole first-parent history (it refuses a
          # shallow clone — vacuous is never green, P34.7)
          fetch-depth: 0

      - name: Install uv (pinned; matches `[tool.uv] required-version`)
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install Python (pinned by .python-version)
        run: uv python install

      - name: Install workspace from the committed lockfile
        run: make sync

      - name: Install Node (exact pin from web/.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Same toolchain locally and in CI (SIG-ENG-046): the pinned npm, then the
      # versions printed so the log records what ran.
      - name: Install the pinned npm and print the toolchain
        run: |
          npm install -g "npm@$(node -p "require('./web/package.json').packageManager.split('@').pop()")"
          node -v
          npm -v

      - name: Install web deps (the S8 web-build fixtures need web/node_modules)
        run: npm --prefix web ci

      - name: Composed e2e — tests/e2e with Docker + the web build present
        id: e2e
        continue-on-error: true
        run: uv run pytest tests/e2e --junitxml nightly-e2e.xml 2>&1 | tee nightly-e2e.txt
        env:
          SIG_REQUIRE_DB_TESTS: "1"
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Secret scan over every tracked file
        id: secrets
        continue-on-error: true
        run: uv run python scripts/ci/secret_scan.py 2>&1 | tee secret-scan.txt

      - name: Dependency licence scan (excluded categories + unresolvable + new GPL)
        id: licenses
        continue-on-error: true
        run: uv run python scripts/ci/license_scan.py 2>&1 | tee license-scan.txt

      - name: Dependency vulnerability audit (uv export → uvx pip-audit → OSV)
        id: depaudit
        continue-on-error: true
        run: bash scripts/ci/dep_audit.sh 2>&1 | tee dep-audit.txt

      # The npm advisory audit runs FULL-tree nightly (P34.2): the per-PR gate
      # is production-only (`--omit=dev`), so dev-toolchain advisories are
      # judged here against the committed, dated allow-list
      # (record_policy/npm_audit_allow.toml). `--full` runs both audits and
      # cross-checks that every `dev-only` entry really is unreachable from
      # production deps — an entry that lies about its scope blocks.
      - name: npm advisory audit (full tree, dated allow-list gate)
        id: npm
        continue-on-error: true
        run: bash scripts/ci/npm_audit_gate.sh --full --out . 2>&1 | tee npm-audit.txt

      # G3b nightly scope (P34.2, SIG-MEM-007): verify EVERY recorded `ci:` line
      # — every Round-11 PHASE LOG entry and the run ledgers they name — against
      # the live GitHub records, so "green" stays auditable after the fact. A
      # `done` entry without a verifiable `ci:` field is red; an unreadable
      # GitHub response is UNKNOWN, never green.
      - name: Recorded-CI verifier (all Round-11 records vs GitHub)
        id: recordedci
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 docs/build/tools/verify_recorded_ci.py --all 2>&1 | tee recorded-ci.txt

      # P34.7 (B4 G2): the append-only replay — every first-parent commit of the
      # protected history re-judged read-only against the register-derived oracle
      # (tests/unit/fixtures/memory_guard/replay_expected.csv — generated by
      # `memory_guard.py oracle-gen`, never hand-copied counts, OM-15). Every
      # register loss / transition-unjustified / append-position / misdated-stamp
      # row must flag; the benign rows and seed commits must pass; a finding
      # outside the expected set, a missed expectation, a breached clean row or a
      # vacuous run is red — the same `make check` gate's history mode run across
      # all of history, nightly, read-only.
      - name: Build-memory history replay (all first-parent commits vs the oracle)
        id: replay
        continue-on-error: true
        run: |
          root=$(git rev-list --max-parents=0 HEAD | tail -1)
          python3 docs/build/tools/memory_guard.py replay "${root}..HEAD" \
            --oracle tests/unit/fixtures/memory_guard/replay_expected.csv \
            --json memory-replay.json 2>&1 | tee memory-replay.txt

      # P34.31 (B4 G6, SIG-ENG-040): the living-record advance backtest. The AST
      # lint protects today's tree; this replays the living-reading tests of
      # each first-parent commit C against the tree at the next commit C′ that
      # legitimately changed a declared living record — a pin fails exactly at
      # such a transition. Read-only (git archive into a temp tree; fetch-depth
      # 0 above supplies the full first-parent history); a pin-broken finding,
      # a vacuous run, or an infra collapse is red via the report below.
      - name: Living-record advance backtest (living-backtest/1)
        id: backtest
        continue-on-error: true
        # `uv run` so the replayed tests run under the workspace interpreter —
        # the tool invokes `sys.executable -m pytest` and the system python3
        # has no pytest.
        run: |
          uv run python docs/build/tools/living_record_backtest.py \
            --window 400 --max-transitions 25 \
            --json living-backtest.json 2>&1 | tee living-backtest.txt

      # The report is ALSO the gate: it writes nightly-report.md, then exits
      # non-zero if any stage outcome was not success — the upload below still
      # runs (if: always()), so the red nightly carries its own evidence.
      - name: Compose the nightly report (fails the run if any stage failed)
        if: always()
        run: >
          uv run python scripts/ci/nightly_report.py --out nightly-report.md
          e2e=${{ steps.e2e.outcome }} secrets=${{ steps.secrets.outcome }}
          licenses=${{ steps.licenses.outcome }} depaudit=${{ steps.depaudit.outcome }}
          npm=${{ steps.npm.outcome }} recordedci=${{ steps.recordedci.outcome }}
          replay=${{ steps.replay.outcome }} backtest=${{ steps.backtest.outcome }}
          --log e2e=nightly-e2e.txt --log secrets=secret-scan.txt
          --log licenses=license-scan.txt --log depaudit=dep-audit.txt
          --log npm=npm-audit.txt --log recordedci=recorded-ci.txt
          --log replay=memory-replay.txt --log backtest=living-backtest.txt

      - name: Upload the nightly report + stage logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ github.run_id }}
          path: |
            nightly-report.md
            nightly-e2e.txt
            nightly-e2e.xml
            secret-scan.txt
            license-scan.txt
            dep-audit.txt
            npm-audit.txt
            npm-audit.json
            npm-audit-prod.json
            recorded-ci.txt
            memory-replay.txt
            memory-replay.json
            living-backtest.txt
            living-backtest.json
          if-no-files-found: warn
