#
# Observability & alerting sweep (OBS.1 / GL-OBS-01, ADR-077).
#
# The zero-cost posture (SIG-STORE-003) means a FILE, not a hosted metrics stack:
# this daily job runs the same `sig-ops` commands an operator runs by hand —
# the egress-budget check wired to the notifier seam (`egress-report --alert`),
# a stack probe when staging endpoints are configured, and the dashboard readout —
# and uploads the recorded-alert ledger + bounded probe log + readout as artifacts.
#
# Secrets (HG-09): the webhook endpoint/token and any staging DSN ride secrets/vars
# only — never literals. Absent, the notifiers degrade to the always-on recorded
# ledger + log line; nothing is fabricated.
#
# SIG-ENG-042 truth (P35.2): a scheduled check that measured nothing FAILS. Every
# measurement leg records `key=N` counts (offered/evaluated) and
# `sig-ops observe-gate` goes red when the run evaluated nothing — the previous
# "probe skipped … nothing measured" green was a vacuous success.

name: observability

on:
  schedule:
    # 06:00 UTC daily — ahead of the monthly 07:00 keepalive tick on the 1st.
    - cron: "0 6 * * *"
  # Manual trigger so an operator can drive a sweep on demand.
  workflow_dispatch:

concurrency:
  group: observability-${{ github.ref }}
  # Never cancel a running sweep (P34.1, ADR-151): a scheduled sweep that is
  # cancelled leaves an unmeasured gap — a started run completes (SIG-ENG-046).
  cancel-in-progress: false

permissions:
  contents: read

# Workflow-level `bash` = `bash --noprofile --norc -eo pipefail` on the runner
# (SIG-ENG-046, P34.1): a failing command on the left of a pipe fails the step.
defaults:
  run:
    shell: bash

env:
  # The notifier seam (ADR-077): env-only, never literals.
  SIG_ALERT_WEBHOOK_URL: ${{ secrets.SIG_ALERT_WEBHOOK_URL }}
  SIG_ALERT_WEBHOOK_TOKEN: ${{ secrets.SIG_ALERT_WEBHOOK_TOKEN }}
  # Staging/live endpoints the probe checks (operator vars; absent → probe skipped).
  SIG_STAGING_API_URL: ${{ vars.SIG_STAGING_API_URL }}
  SIG_STAGING_STATIC_URL: ${{ vars.SIG_STAGING_STATIC_URL }}
  SIG_STAGING_CURATION_URL: ${{ vars.SIG_STAGING_CURATION_URL }}
  SIG_STAGING_DSN: ${{ secrets.SIG_STAGING_DSN }}
  # The recorded-alert ledger + bounded metrics log land in the workspace and are
  # uploaded as artifacts below.
  SIG_ALERT_LOG: alerts.jsonl
  SIG_PROBE_LOG: probes.jsonl

jobs:
  observe:
    runs-on: ubuntu-24.04  # pinned (S6R-27: ubuntu-latest moves to Ubuntu 26 on 2026-10-19)
    steps:
      - uses: actions/checkout@v7

      - name: Install uv (pinned; matches `[tool.uv] required-version`)
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install Python (pinned by .python-version)
        run: uv python install

      - name: Install workspace from the committed lockfile
        run: make sync

      # INFRA.1's egress-budget alarm, wired to the notifier: a warn/alarm breach
      # fires a recorded alert; a full breach also exits 5 (the job goes RED).
      # When the operator records current usage as the SIG_EGRESS_USAGE_GB var it
      # is measured for real; absent, the report is gate-pending (HG-07) and no
      # false alarm fires.
      - name: Egress budget check — recorded alert on breach
        run: |
          mkdir -p .observe
          echo "egress_offered=1" >> .observe/counts
          if [ -n "${SIG_EGRESS_USAGE_GB:-}" ]; then
            echo "egress_evaluated=1" >> .observe/counts
            uv run sig-ops egress-report --alert --usage-gb "$SIG_EGRESS_USAGE_GB"
          else
            # Gate-pending (HG-07): the report renders but measured nothing —
            # counted as unevaluated; the observe-gate step accounts for it.
            uv run sig-ops egress-report --alert
          fi
        env:
          SIG_EGRESS_USAGE_GB: ${{ vars.SIG_EGRESS_USAGE_GB }}

      # Stack probe: records ok/latency metrics to the bounded probe log and fires
      # a recorded alert per DOWN service. With the endpoints unconfigured the leg
      # measured nothing — SIG-ENG-042 counts it unevaluated and the observe-gate
      # step below goes red rather than report a vacuous green.
      - name: Probe the live stack (skipped until endpoints are configured)
        run: |
          mkdir -p .observe
          echo "probe_offered=1" >> .observe/counts
          if [ -n "${SIG_STAGING_API_URL:-}" ]; then
            echo "probe_evaluated=1" >> .observe/counts
            uv run sig-ops probe --alert
          else
            echo "staging endpoints unset — probe leg measured nothing (SIG-ENG-042: counted below)"
          fi

      # SIG-ENG-042 (P35.2): the run reports what it offered and what it
      # evaluated; a scheduled check that measured nothing fails — never a
      # green artifact on zero measurement.
      - name: Measured-nothing gate (SIG-ENG-042)
        if: always()
        run: uv run sig-ops observe-gate --counts .observe/counts

      # The dashboard/readout artifact: a deterministic render of the recorded
      # probe log + alert ledger + egress report.
      - name: Render the observability readout
        run: uv run sig-ops dashboard --out observability-dashboard.md

      - name: Upload the recorded alerts, metrics log, and readout
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: observability-${{ github.run_id }}
          path: |
            alerts.jsonl
            probes.jsonl
            observability-dashboard.md
            .observe/counts
          if-no-files-found: ignore
