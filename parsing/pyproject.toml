[project]
name = "sig-parsing"
version = "0.1.0"
description = "SIG parsing package: the §24 layered parser stack (genre detection, tables, clauses) that connectors extract through (§47)."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sig-parsing = "parsing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parsing"]
