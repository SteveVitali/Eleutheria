# SPDX-License-Identifier: Apache-2.0
# SIG's own licences (SIG-LIC-005) and the export compartment model
# (SIG-LIC-004a). This table is DATA, not code: adding a source under a new
# share-alike licence is a new [compartments.*] / [licenses.*] row here and MUST
# NOT require a schema or code change. The export gate in policy.licensing reads
# it at runtime. See docs/2_canonical_design_spec.md §42 and docs/adr/ADR-009,
# ADR-011.

# ---------------------------------------------------------------------------
# Per-licence facts. `relicensable_to` is the data-driven compatibility
# relation: the set of export licences that content under this licence MAY be
# placed under. Every licence is trivially relicensable to itself. Share-alike
# licences (ODbL-1.0, CC-BY-SA-4.0) are relicensable to themselves ONLY — which
# is exactly why they cannot be merged with each other and cannot be folded into
# the permissive CC-BY-4.0 graph (SIG-LIC-004a). CC0-1.0 (public domain) may be
# placed under any of them.
# ---------------------------------------------------------------------------

[licenses."Apache-2.0"]
kind = "code"
share_alike = false
attribution_required = true
relicensable_to = ["Apache-2.0"]

[licenses."CC-BY-4.0"]
kind = "data"
share_alike = false
attribution_required = true
relicensable_to = ["CC-BY-4.0"]

[licenses."CC-BY-SA-4.0"]
kind = "data"
share_alike = true
attribution_required = true
relicensable_to = ["CC-BY-SA-4.0"]

[licenses."ODbL-1.0"]
kind = "data"
share_alike = true
attribution_required = true
relicensable_to = ["ODbL-1.0"]

[licenses."CC0-1.0"]
kind = "data"
share_alike = false
attribution_required = false
relicensable_to = ["CC0-1.0", "CC-BY-4.0", "CC-BY-SA-4.0", "ODbL-1.0"]

# Licence Ouverte 2.0 (Etalab) — the French government's open-data licence,
# confirmed on data.gouv.fr datasets (e.g. DECP `fr-lo`). Attribution-only,
# non-share-alike; per Etalab's own guidance it is CC-BY-compatible, but SIG
# records it under its own expression rather than silently mapping (ADR-084):
# `relicensable_to` is deliberately just itself until HG-02 counsel confirms
# the CC-BY-4.0 compatibility mapping.
[licenses."LicenceOuverte-2.0"]
kind = "data"
share_alike = false
attribution_required = true
relicensable_to = ["LicenceOuverte-2.0"]

# CC-BY-SA-2.0 — the licence the IDOT Illinois Gateway traffic-camera layer is
# published under (ArcGIS item 8a885da23dfb46caaa1827ad920fb5b1 licenseInfo,
# retrieved 2026-09-17). Share-alike: relicensable to itself ONLY — it can
# neither fold into CC-BY-4.0 nor merge with CC-BY-SA-4.0 (a different version
# is a different licence).
[licenses."CC-BY-SA-2.0"]
kind = "data"
share_alike = true
attribution_required = true
relicensable_to = ["CC-BY-SA-2.0"]

# LicenseRef-DerivedFacts-Citations — the ADR-085 basis the counsel-flipped
# document sources run on (CCOPS filings, pathways pages, madada, the coarse
# international adapters, declarationcamera_be): SIG emits derived facts and
# citations, never re-hosts the upstream expressive content.
#
# HG-02 resolved 2026-09-16 (counsel, recorded in LEDGER GATE DECISIONS +
# ADR-086): the derived facts/citations MAY be published — in the dedicated
# `derived_facts` compartment under this expression, self-relicensable only.
# Keeping the LicenseRef (rather than folding into CC-BY-4.0) is the
# conservative reading: the basis stays visible and the facts can never merge
# into sig_graph/osm_physical/portal (the licence math intersects to itself).
[licenses."LicenseRef-DerivedFacts-Citations"]
kind = "data"
share_alike = false
attribution_required = true
relicensable_to = ["LicenseRef-DerivedFacts-Citations"]

# --- P26.9 (SOURCES.8) licences ----------------------------------------------
# OGL-Canada-2.0 — the Open Government Licence - Canada 2.0, declared on the
# City of Winnipeg open-data portal (data.winnipeg.ca dataset 42pk-2u2c licence
# metadata, retrieved 2026-09-18). Attribution-only, non-share-alike; recorded
# under its own expression rather than silently mapped to CC-BY-4.0 (the
# LicenceOuverte-2.0 precedent) — the relicensable_to set stays self-only until
# HG-02 counsel confirms the CC-BY compatibility mapping.
[licenses."OGL-Canada-2.0"]
kind = "data"
share_alike = false
attribution_required = true
relicensable_to = ["OGL-Canada-2.0"]

# OGL-3.0 — the UK Open Government Licence v3.0, declared verbatim on the
# Sheffield City Council ArcGIS item c5b5971a1c1248faa95649d081849aa1
# (retrieved 2026-09-18). Attribution-only, non-share-alike; self-relicensable
# only pending counsel's compatibility mapping.
[licenses."OGL-3.0"]
kind = "data"
share_alike = false
attribution_required = true
relicensable_to = ["OGL-3.0"]

# CC-BY-3.0 — Creative Commons Attribution 3.0 Unported, declared verbatim on
# the Baltimore CitiWatch item b676679350764f56a990c25a8ce2bda0 (retrieved
# 2026-09-18). A different CC-BY version is a different licence — it neither
# folds into CC-BY-4.0 nor merges with it (the CC-BY-SA-2.0 precedent).
[licenses."CC-BY-3.0"]
kind = "data"
share_alike = false
attribution_required = true
relicensable_to = ["CC-BY-3.0"]

# LicenseRef-Ottawa-ODL-2.0 — the Open Government Licence - City of Ottawa
# (v2.0), named by ArcGIS item licenseInfo on Ottawa's open-data org
# (adf1e7bd0338404196dc0d552aa6c79b, d709c922c64b4c389afac3fb21d481fb; licence
# text verified 2026-09-18 via the Wayback capture of ottawa.ca open-data
# page). OGL-family: worldwide, royalty-free, perpetual, non-exclusive use for
# any lawful purpose + attribution. A municipal LicenseRef (not the federal
# OGL-Canada expression); self-relicensable only.
[licenses."LicenseRef-Ottawa-ODL-2.0"]
kind = "data"
share_alike = false
attribution_required = true
relicensable_to = ["LicenseRef-Ottawa-ODL-2.0"]

# --- P26.13 (SOURCES.12) licences ---------------------------------------------
