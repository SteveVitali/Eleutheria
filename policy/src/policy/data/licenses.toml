attribution_required = true
relicensable_to = ["LicenseRef-Peel-ODL-1.0"]

# LicenseRef-StAlbert-ODL-1.0 — the "City of St. Albert Open Government
# License" named verbatim on ArcGIS item 6f2ca1b545844065b719483d562d553e.
# The licence grant TEXT could not be captured (data.stalbert.ca/pages/licence
# is a JS-rendered shell; no Wayback capture) — camreg_stalbert_ab stays gated
