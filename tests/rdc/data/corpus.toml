# sig.rdc-corpus/1 — the real-data regression corpus manifest (P35.23,
# SIG-CONF-008 / L3-confidence-program §3.5 + draft row SIG-CONF-D08).
#
# One licence-aware captured slice per recorded failure archetype, or a filed
# D-… deferral row when no licensed slice exists. `committed` slices carry
# bytes under this directory (licence lane raw-ok, non-ODbL, attribution in
# SOURCES.md) and run in the PR lane; `restricted` slices commit only
# member digests and run in the scheduled sig-rdc-probe job (SIG-CONF-013
# posture) over the screened compartment bucket.
#
# The estimand headers below are the SIG-CONF-012 contract (draft row
# SIG-CONF-D12): every sig.rdc-report/1 carries them verbatim and states
# that the numbers are mechanical censuses — never real-world precision or
# recall. A header missing them fails the report lint.

schema = "sig.rdc-corpus/1"
corpus_id = "rdc"
version = 1
generated_by = "P35.23 (docs/tickets/348_P35.23__real-data-regression-corpus.md)"

[estimands]
m4 = "per-class join/no-join outcomes over modelled perturbations of corpus records — a mechanical census against the declared ruleset contract, never an estimate of real-world precision or recall"
m5 = "share of mechanically-declared known-distinct pairs the matcher merges — a census over the declared negative classes only, never an estimate of real-world precision or recall"
m6 = "metamorphic invariants over the corpus record set — cluster-set equality under input-order permutation and blocking-page changes, unchanged distinct-record count under declared-mirror edits, and idempotent re-run — never an estimate of real-world precision or recall"

