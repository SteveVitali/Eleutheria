#
# Virtual workspace root (SIG-ENG-011). This file defines the uv workspace, its
# members (the §47 package layout), the shared dev toolchain, and the shared
# lint/type-check/test configuration. It is intentionally NOT a distributable
# package: SIG ships as the per-area member packages under each §47 directory.

[tool.uv.workspace]
members = [
    "ontology",
    "db",
    "connectors",
    "parsing",
    "resolution",
    "reconcile",
    "inference",
    "tasks",
    "api",
    "exports",
    "orchestration",
    "policy",
    "ops",
    # Added by ADR-023 after the frozen §47 layout: the OCFL write-once evidence
    # store (§17). §47 names no home for it; ADR-023 records the deviation.
    "evidence",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "hypothesis>=6.100",
    # The claim-spine (P02.1) tests stand up a real PG18+PostGIS container and
    # apply the sqitch plan against it (§48, SIG-STORE-024). testcontainers pulls
    # the `docker` SDK transitively; psycopg is the client driver.
    "testcontainers>=4.8",
    "psycopg[binary]>=3.2",
    # The public-API (P14.1) tests drive the FastAPI app through Starlette's
    # TestClient, which speaks the ASGI transport over httpx (SIG-API-001..013).
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Only lint/format code this repo owns as Python source. web/ is TypeScript;
# docs/ and scratch/ are prose/build-scratch and are out of scope here.
extend-exclude = ["web", "docs", "scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# FastAPI's dependency-injection markers (Depends/Query/Header) are call-in-
# argument-default *by design* — that is how the framework declares a dependency
# (SIG-API-001, the P14.1 public API). Treat them as immutable so B008 does not
# fire on the idiomatic pattern; every other B008 case still errors.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true
strict_equality = true

# The ontology generators (P01.1) drive third-party toolchains that ship no type
# stubs / py.typed marker (LinkML, PyYAML, rdflib). Ignore *only* their missing
# imports; our own code stays fully type-checked.
[[tool.mypy.overrides]]
module = ["linkml.*", "linkml_runtime", "yaml", "rdflib", "rdflib.*"]
ignore_missing_imports = true

# The evidence store (P02.2) drives boto3 (S3 / Object Lock) and playwright (live
# WACZ capture); neither ships type stubs / a py.typed marker. Ignore *only* their
# missing imports — our own code stays fully type-checked.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "playwright.*", "blake3"]
ignore_missing_imports = true

# The probabilistic ER matcher (P05.1) drives Splink 4 on DuckDB (SIG-IDENT-021) with
# pandas/numpy/igraph in its transitive closure. These ship py.typed markers, but their
# stubs don't type-check cleanly under this project's 3.11 target (numpy's stubs use
# 3.12-only `type` statement syntax), so `follow_imports = "skip"` treats them as Any
# rather than parsing them. Our own ER code stays fully type-checked.
[[tool.mypy.overrides]]
module = ["splink", "splink.*", "duckdb", "duckdb.*", "pandas", "pandas.*", "numpy", "numpy.*", "igraph", "igraph.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
