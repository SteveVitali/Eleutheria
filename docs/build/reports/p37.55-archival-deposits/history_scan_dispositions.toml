# P37.55 (Q-E2-23 [B-6] = a): the reviewed disposition of each class the
# public-history scan (`scripts/ci/history_scan.py`, schema sig.history-scan/1)
# found in retained history. `exempt` = a reviewed false positive; `disclosed`
# = accepted-and-disclosed (the A-0.4 / P34.18 retained-history pattern —
# recorded here, never hidden). Matchers name literal sha256s, path globs,
# token sha256s, or domains — never the matched bytes. An entry matching no
# finding is stale and fails the report (the file can never drift silently).
schema = "sig.history-scan-dispositions/1"
run = "P37.55"
decision = "Q-E2-23 [B-6] = a — scan the public history for secrets and restricted data first, then submit"

