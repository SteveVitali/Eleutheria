# docs/build/tools/record_policy/return_pass.toml — the committed RETURN PASS map
# (return-pass-map/1; P34.29 / B3 §3.13 row M5, SIG-MEM-010).
#
# `docs/build/tools/return_pass.py` renders the LEDGER's `### RETURN PASS — current`
# region (a `history.policy` `exempt` generated region — regenerated, never
# hand-edited) and the CURRENT STATE `returnPass:` key from this map plus the
# obligation-event heads (`docs/build/reports/obligations/events.jsonl`) and the
# S1b dispositions (`UNIVERSE_DISPOSED.csv`). This file is the ONE committed
# source the orchestrator's boundary comparison and the OM-19 leg-runner
# backstop (OP-24) read.
#
# Row kinds:
#   obligation — a seeded RETURN PASS row keyed by the landed ticket that owes
#                the leg (the T5 γ keying); the re-run line names the Round-11
#                chain row that runs it.
#   leg        — a landed Round-11 row with queued OM-19 live legs; `[[row.legs]]`
#                carries each queued leg's id, window (earliest time + excluded
#                hours), go id (or "pre-authorised: S5-3"), re-run line and
#                `live:` dependants.
#   operator   — a `—` keyed row for a return path with no ticket (a scheduled
#                cron or a pure operator action); excluded from `returnPass:`.
#
# Cell texts are verbatim record prose (seeded from OPERATIONAL_READINESS §(f3)
# and the C7/T5 table SEED-16/SEED-17 wrote); `check` enforces that each leg's
# fields stay inside the cells, that membership matches the dispositions, and
# that the committed region equals this render byte-for-byte. Regeneration
# triggers: an implement-spec close that opens or closes a live-leg deferral,
# an orchestrator gate skip, an OM-19 leg queued or run, the round's REC tail.

