Sources: `docs/build/OPERATIONAL_READINESS.md` §(f3) (sha256 `581fcb5558ca…`, last changed by `45dcc789`) for the blocking domains and packets; `UNIVERSE_DISPOSED.csv` (sha256 `7af12151e419…`) and plan §9.2 / §8.6 for the dispositions; `data/round11_plan.csv` rows for the gates (`operator_gate`) and order. Not RETURN PASS rows (each has exactly one other home, plan §9.2): the 9 owed rows disposed `ticket` (manifest rows, e.g. D-R10-MEMORY-1 → P34.30, D-P32.16-1 → P37.59), the 9 `later-phase` rows (LATER-01/02/03/04/06/17, each with its trigger; LATER-10 moved into the round as P37.70 at S6), the 7 `decision` rows answered at GATE-P and the 2 `already-done` rows (D-P21.3-2, D-SOURCES.12-1) — SEED-14 records their re-homing in DEFERRALS. *Agent interpretation (labelled):* B3 keys a row by the ticket in its `live-return-pass(<ticket>)` disposition; S1b names Round-11 catalog units there, so each key is the landed Round-10 ticket whose deferral the unit discharges (plan §8.6: row 183 → P35.61, 188 → P35.62, 191 → P35.63, 179–182 → P37.16, plus D-P21.5-1 → P37.55 and D-P31.4-1 → P34.39a). A key is never re-dispatched; the orchestrator runs its leg as the named Round-11 row, in chain order or as an OM-19 leg.

*Superseding note — 2026-10-01T16:52:21Z (SEED-17, Stage B T5; appended).* The SEED-16 version of this table (commit `e2ab1897`) keyed each row by the not-yet-run Round-11 row that runs the leg (P34.39a, P35.61, P35.62, P35.63, P37.16a, P37.16b, P37.55). Both build-memory validators add the `returnPass` ids to the landed set when they compute the lowest unlanded chain row, so that keying would misfire once the chain reached row 247 (SEED-05-10-16 run ledger, issue for P34.29/P34.9). The orchestrator decided (Stage-B carry γ, `docs/build/planning/2026-09-30-next-phase/stageB/CARRY.md`) to key the rows by the landed Round-10 ticket with the Round-11 row as the re-run line; obligations, gates, operator actions and packets are unchanged, and the four P32.18–P32.21 rows share P37.16a/b. P34.29's generator reproduces this keying (its contract, deliverable 1).
'''

