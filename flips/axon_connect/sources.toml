publication_basis = "P36.76 leg A is a bounded screen under GATE-G5's OM-20 naming (single recorded GETs of public registration pages + the :8443 faststream screen, expiring GATE-G6); the FUSUS posture (SIG-INGEST-038) records a marked-host presence as a candidate, never a feed. Ingestion itself is leg B — flipped under B-35 (I7-IT7 = a, full fetch under A-17's envelope); first wire still the operator's OP-26 act."
[sources.axon_connect.redistribution]
