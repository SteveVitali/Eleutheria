[sources.axon_connect]
name = "Axon Fusus Connect <Place> sites"
source_kind = "vendor_site"
homepage_url = "https://connect.volusiasheriff.gov/"
default_tier = "R2"
# P36.76 / R11-ACQ-31 — the per-agency `Connect <Place>` / Fusus white-label
# camera-registration surfaces (the committed I9a-C003 set in
# data/axon_connect_targets.toml). Custody DERIVE: the connector persists ONLY
# the screened records (sig.axon-connect-page/1 programme facts + the
# sig.fusus-screen/1 marked-host record — hash, markers, status), never the
# served page's bytes (ADR-185). Programme facts only — R11-A16 forbids
# registrant bytes; a marked-host presence is a SIG-ACQ-020 candidate, never
# a feed.
custody_posture = "DERIVE"
compact_status = "public_terms_only"
robots_policy = "honor"
# Leg A = the OM-20 row-351 mutation GATE-G5 named verbatim (2026-10-25T18:40Z,
# expires GATE-G6): one recorded GET per committed host of the public
# registration page + one of the :8443 faststream screen — screen records +
# page hashes only. Leg B — the first real host's wire/fetch as a connector
# run — is the operator's act (OP-26), separately authorised.
access_method = "bounded screen (one recorded GET per committed host: public registration page + :8443 faststream screen; leg B is the operator's)"
verified = true
last_verified = 2026-10-01
ingestion_permitted = true
rights_reviewed_by = "maintainer (delegated)"
rights_reviewed_on = 2026-10-01
review_packet = "docs/build/reports/rights/p3676/leg-b-packet.md"
notes = "FLIPPED 2026-10-01 — \"I7-IT7 = a: IT7 full fetch\" (B-35, decision_catalog.csv 2026-10-01T04:46:04Z): the agency-hosted Axon Fusus 'Connect <Place>' pages are fetched in full under A-17's envelope — public, unauthenticated pages only, no logins/keys/circumvention, rate-limited, robots per GL-GATE-08, terms text captured verbatim, exposure disclosed (D3-Q3 answered b). Basis: LicenseRef-OperatorAccepted-DBRight — Axon terms prohibit automated access, so the flip is a considered acceptance, not a discovered permission. Custody stays DERIVE (only screened records persist; served bytes never) and private registrants are never stored or published (Part VIII + SIG-PUB-002 not waived). Posture stays public_terms_only. Prepared on r11/sources-flips as flips/axon_connect; applied in the operator-signed commit (OP-25/OP-26)."
[sources.axon_connect.rights]
