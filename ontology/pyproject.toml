[project]
name = "sig-ontology"
version = "0.1.0"
description = "SIG ontology: the single LinkML source of truth and its generators (§47, §20.1)."
requires-python = ">=3.11"
dependencies = [
    "linkml>=1.11,<1.12",
    "pyyaml>=6.0",
    "rdflib>=7.0",
]

[project.scripts]
sig-ontology = "ontology.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontology"]
