#
# The SIG capability vocabulary (§13.2, §11.6) — SKOS source of truth. Capability
# slugs follow the grammar `verb.object.scope` (SIG-ONTO-023); a noun list cannot
# express scope or direction. The export / onward-disclosure class is present by
# requirement (SIG-ONTO-024) — it is where the harm the project documents occurs.
# Governance capabilities are NEGATIVE (restrictions), modelled so that "no
# evidence of a restriction" never becomes "restriction absent" (SIG-ONTO-025).
scheme: capability
title: SIG capability vocabulary (§13.2)
version: 1.0.0
grammar: verb.object.scope
scopes: [own, partner, state, region, national, commercial, subject]
classes: [query, alerting, live_operations, acquisition, export_disclosure, governance]
