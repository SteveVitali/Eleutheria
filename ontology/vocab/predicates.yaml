#
# The predicate registry (§13.6, SIG-ONTO-066/067) — source of truth. A predicate
# MUST NOT be added without a volatility class + half-life (§28.3), a resolution
# strategy (§28.4), and its row in the directness matrix (§10.5): a predicate with
# none of those cannot be resolved, only guessed at. The directness rows carry the
# published §10.5 values for the matrix predicates and a conservative default
# elsewhere; the full (genre × predicate) matrix is completed in the reconcile
# ruleset (P08), which consumes this registry.
#
# P30.2a / ADR-104: the two evidence genres the hosted spine actually carries for
# camera-registry claims (`camera_registry`, `connector_run`) join the genre axis, and
# the 14 camera-registry predicates measured on the hosted spine are registered. Every
# pre-existing predicate reads D6 for the two new genres — the conservative default,
# identical in effect to the pre-P30.2a KeyError exclusion; assessing those cells is
# owed (D-P30.2a-1). `value_tolerance` (optional) is the predicate's own U4 tolerance
# (SIG-RECON-014): claims whose values agree within it corroborate one candidate, and a
# spread beyond it is UNRESOLVED (U4) with both values kept visible.
#
# P31.5 / ADR-112: the procurement (§11.11/§11.12 + the notice surface) and accountability
# (§11.17/§11.18) predicates measured on the hosted spine are registered (the procurement half
# of D-P30.2a-1; legislation/portal families and the agenda_document/portal_document/bill_index
# genres are P31.8). Two optional fields: `object_kind` (`entity_ref` for a partner predicate
# whose claims also name an `organization` entity; `literal` otherwise) and `maps_to` (an existing
# registry row with the same meaning, whose volatility, strategy and legacy-genre directness the
# row copies — the resolver keys on the spine predicate id, so the mapping is recorded, not
# aliased). `connector_run` directness follows ADR-104's rule for an unclassified connector pull:
# D3 for a record's descriptive facts, D1 for its own identifiers and its own-text matches.
