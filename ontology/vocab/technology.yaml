#
# The SIG technology vocabulary (§13.1) — SKOS source of truth. 14 domains, 36
# families, 104 technologies; every family carries an -unspecified leaf
# (SIG-ONTO-020/054); every technology carries a distinguishing criterion, an
# evidence signature, and a salience L/M/H/C (SIG-ONTO-056). Slugs are
# lowercase-hyphenated, stable forever, encode family-discriminator, never a
# vendor (SIG-ONTO-053/055). Authored source; the SKOS artifact is generated from it.
scheme: technology
title: SIG technology vocabulary (§13.1)
version: 1.0.0
hierarchy: domain → family → technology
counts:
  domains: 14
  families: 36
  technologies: 104
domains:
- slug: surveillance-vehicle
  label: Vehicle surveillance
  families:
  - slug: alpr
    label: Automated licence plate readers
    technologies:
    - slug: alpr-fixed
      label: Fixed ALPR
      distinguishing_criterion: Pole/structure-mounted, permanently sited at one location.
      evidence_signature:
      - license plate reader
      - fixed LPR
      - pole-mounted camera
      salience: M
    - slug: alpr-mobile
      label: Mobile ALPR
      distinguishing_criterion: Mounted on a patrol vehicle and reads while in motion.
      evidence_signature:
      - mobile LPR
      - vehicle-mounted plate reader
      salience: M
    - slug: alpr-covert
      label: Covert ALPR
      distinguishing_criterion: Concealed/disguised siting intended to avoid detection.
      evidence_signature:
      - covert LPR
      - concealed camera
      salience: H
    - slug: alpr-trailer
