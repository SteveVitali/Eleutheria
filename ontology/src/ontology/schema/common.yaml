  # --- The fourteen roles (§12.4, SIG-ONTO-047) -------------------------------
  Role:
    description: The fourteen separately-modelled roles (§12.4). Never collapsed to owner/operator.
    permissible_values:
      owner: {description: "Who could lawfully remove it?"}
      purchaser: {description: "Whose money bought it?"}
      funder: {description: "Whose grant/appropriation supplied that money?"}
      installer: {description: "Who physically mounted it?"}
      host: {description: "Whose pole/wall/right-of-way is it on?"}
      operator: {description: "Who aims, tunes, and responds to it?"}
      data_controller: {description: "Who can change the retention setting?"}
      data_processor: {description: "Could they lawfully use it for their own purposes?"}
      platform_provider: {description: "Who would the capability disappear with?"}
      accessor_read: {description: "Can they view without initiating a search?"}
      searcher: {description: "Can they execute queries against the corpus?"}
      alert_recipient: {description: "Do they get notified?"}
      auditor: {description: "Can they see the search log as of right?"}
      regulator: {description: "Can they prohibit it?"}

  # --- The three sharing edge types (§12.2, SIG-ONTO-042) ---------------------
