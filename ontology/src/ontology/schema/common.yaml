#
# Common types, shared slots, and the STRUCTURAL controlled vocabularies of §13
# (evidence/epistemics §13.3, the four lifecycle tracks §13.4, roles §12.4, and
# the small closed enums referenced by entity/edge predicate surfaces). The large
# open vocabularies — the technology tree (§13.1) and the capability grammar
# (§13.2) — are NOT permissible-value enums here: they are versioned SKOS concept
# schemes whose term lists live in ontology/vocab/ (§13 l.2153) and are bound to
# slots by the `technology_code` / `capability_code` types below.
id: https://ontology.sig-project.org/schema/common
name: sig_common
title: SIG common types, slots, and structural vocabularies
description: >-
  Shared LinkML building blocks for the SIG ontology: custom scalar types, the
  universal temporal/provenance slots, and the closed structural enums of §13.3,
  §13.4, §12.4, and §13.5.
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  sig: https://ontology.sig-project.org/schema/
  skos: http://www.w3.org/2004/02/skos/core#
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: sig
default_range: string
imports:
  - linkml:types

# --- Custom scalar types ------------------------------------------------------
types:
  edtf:
    typeof: string
    base: str
    uri: xsd:string
    description: >-
      An Extended Date/Time Format (ISO 8601-2 / EDTF) string. Uncertain and
      open-ended time is preserved verbatim; "early 2025" is NOT coerced to a
      point (§9.3, ADR-004).
  geometry_wkt:
    typeof: string
    base: str
    uri: xsd:string
    description: A geometry as WKT/EWKT, SRID 4326 unless otherwise stated (§19.1).
  bcp47:
    typeof: string
    base: str
    uri: xsd:string
    description: A BCP-47 language tag qualifying a label-bearing value (§9.7, SIG-ONTO-069).
  technology_code:
    typeof: string
    base: str
    uri: xsd:string
    description: >-
      A slug from the versioned SKOS Technology concept scheme (§13.1). Bound to
      the scheme by IRI; the authoritative term list is the generated SKOS
      artifact, never inlined here (so the 14/36/104 counts have one home).
  capability_code:
    typeof: string
    base: str
    uri: xsd:string
    description: >-
      A `verb.object.scope` slug from the versioned SKOS Capability concept
      scheme (§13.2, §11.6).
  predicate_code:
    typeof: string
    base: str
    uri: xsd:string
    description: A slug from the predicate registry (§13.6, SIG-ONTO-066).
  money:
    typeof: decimal
    base: Decimal
    uri: xsd:decimal
    description: A monetary amount; always paired with a currency slot.
  duration_iso:
    typeof: string
    base: str
    uri: xsd:string
    description: An ISO-8601 duration (e.g. retention period), distinct from an ordinal bucket.

# --- Universal slots ----------------------------------------------------------
slots:
  id:
    identifier: true
    range: uriorcurie
    description: The entity's stable minted identity (L2 identity only, §8.2).
  valid_from:
    range: edtf
    description: When the fact/relationship became true (valid time, §9.2).
  valid_to:
    range: edtf
    description: When it ceased to be true; distinct from unknown vs ongoing (§9.5).
  valid_from_kind:
    range: TemporalBoundKind
    description: Whether valid_from is known, unknown, or ongoing (§9.5, SIG-ONTO-044).
  valid_to_kind:
    range: TemporalBoundKind
    description: Whether valid_to is known, unknown, or ongoing (§9.5, SIG-ONTO-044).
  observed_at:
    range: edtf
    description: When SIG observed the state (observation time, never collapsed with valid time — §9).
  # Cross-cutting provenance handles (the claim/evidence spine is P02; these are
  # the ontology-level references that make every fact evidenced — §3.1).
  sources:
    range: uriorcurie
    multivalued: true
    description: Supporting evidence artifacts/sources; every fact is evidenced (SIG-CHART-013).

# --- Structural enums: evidence and epistemics (§13.3) ------------------------
enums:
  TemporalBoundKind:
    description: How a temporal bound is known (§9.5).
    permissible_values:
      known: {description: "A specific known bound."}
      unknown: {description: "Bound exists but is not known."}
      ongoing: {description: "The fact is still in force (open interval)."}
  SourceReliability:
    description: Reliability R of the publisher, not the claim (§10.4).
    permissible_values:
      R1: {description: "Highest reliability."}
      R2: {}
      R3: {}
      R4: {}
      R5: {}
      R6: {description: "Lowest reliability."}
  ClaimDirectness:
    description: Directness D from the (genre × predicate) matrix (§10.5).
    permissible_values:
      D1: {description: "Authoritative record of the fact itself."}
      D2: {description: "First-party report of the fact."}
      D3: {description: "Secondhand report or close proxy."}
      D4: {description: "Establishes a related fact; short inference."}
      D5: {description: "Bears on target only through a modelling assumption."}
      D6: {description: "Non-probative for this predicate — excluded from the admissible set."}
  ArtifactIntegrity:
    description: Integrity I of the artifact (§10.6).
    permissible_values:
      I1: {}
      I2: {}
      I3: {}
  ArtifactType:
    description: >-
      The genre of an evidence artifact (§10.3.2). SIG-INGEST-047 additionally
      carries state_auditor_survey, warrant, and procurement_aggregator_record
      (§23.6) — the state-auditor surveys are R1 government datasets and the
      aggregator record is the paywalled procurement-aggregator lead under a LINK
      custody posture.
    permissible_values:
      contract: {}
      invoice: {}
      council_minutes: {}
      agenda_packet: {}
      audit_export: {}
      configuration_export: {}
      portal_page: {}
      policy_document: {}
      court_filing: {}
      news_article: {}
      dataset: {}
      press_release: {}
      presentation: {}
      email: {}
      photograph: {}
      osm_element: {}
      radio_observation: {}
      budget: {}
      grant_award: {}
      statute: {}
      regulation: {}
      screenshot: {}
      state_auditor_survey:
        description: >-
          A state auditor's periodic survey of agency surveillance-technology
          holdings — an R1 government dataset (§23.6, SIG-INGEST-047).
      warrant:
        description: A warrant artifact (§23.6, SIG-INGEST-047).
      procurement_aggregator_record:
        description: >-
          A record from the paywalled commercial procurement aggregator carried
          under a LINK custody posture (§23.6, SIG-INGEST-047).
      other: {}
  Currency:
    description: Currency C derived at query time from volatility half-life (§28.3).
    permissible_values:
      C1: {description: "CURRENT."}
      C2: {description: "AGING."}
      C3: {description: "STALE."}
      C4: {description: "HISTORICAL."}
  WeightClass:
    description: Composed weight class W (§10.6).
    permissible_values:
      W0: {}
      W1: {}
      W2: {}
      W3: {}
      W4: {}
  EvidenceRole:
    description: The role a piece of evidence plays for a claim (§13.3).
    permissible_values:
      establishes: {}
      corroborates: {}
      contextualizes: {}
      contradicts: {}
      supersedes_basis: {}
      attests_absence: {}
  EpistemicStatus:
    description: Required epistemic status of an accountability event (§11.17, SIG-ONTO-038).
    permissible_values:
      alleged: {}
      reported: {}
      confirmed: {}
      adjudicated: {}
      policy_action: {}
      vendor_statement: {}
      disputed: {}
      retracted: {}
  AbsenceKind:
    description: How an absence is known — negative space is queryable (§9.5).
    permissible_values:
      not_researched: {}
      searched_not_found: {}
      evidence_of_absence: {}
      not_applicable: {}
  ContradictionState:
    description: State of a contradiction (§31).
    permissible_values:
      uncontested: {}
      resolved_conflict: {}
      unresolved_conflict: {}
      insufficient: {}
  ValueKind:
    description: RDF-style value kind — known value, unknown value, or no value (§9.5).
    permissible_values:
      value: {}
      somevalue: {description: "A value exists but is unknown."}
      novalue: {description: "There is provably no value."}
  PredicateVolatility:
    description: Volatility class governing currency decay (§28.3, SIG-RECON-008).
    permissible_values:
      IMMUTABLE: {description: "Never changes; half-life infinite; always C1."}
      GLACIAL: {}
      SLOW: {}
      MODERATE: {}
      FAST: {}
      VOLATILE: {}
  ResolutionStrategy:
    description: Per-predicate resolution strategy (§28.4, SIG-RECON-012).
    permissible_values:
      latest_observation_wins: {}
      authoritative_source_wins: {}
      interval_union: {}
      interval_intersection: {}
      max_support: {}
      never_resolve: {description: "Recorded but deliberately not adjudicated (§12.4 contested facts)."}
  SkosMappingRelation:
    description: SKOS mapping relations for crosswalks (§20.3).
    permissible_values:
      exactMatch: {}
      closeMatch: {}
      broadMatch: {}
      narrowMatch: {}
      relatedMatch: {}

