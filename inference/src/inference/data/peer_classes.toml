# Declared §32.1 peer classes (P31.9 / DEEPEN.5, ADR-115).
#
# Peer class = (entity_type, connector): a claim SUBJECT belongs to a class iff
# its entity_type matches and at least one of its tier-0, currently-valid claims
# was written by an ingest_run whose connector_name is in `connectors`. The
# negative space of a subject is the UNION of the `tracked` predicate sets of
# every class it belongs to, minus the predicates it already claims. A
# predicate absent from `tracked` is NEVER negative space for that class; a
# subject whose claims all come from undeclared connectors produces no
# negative-space rows (nothing is declared tracked for it — the honest
# "no declared coverage surface" state, never a guess).
#
# `tracked` is seeded from the measured per-connector emit surface of the
# hosted spine (2026-09-25: the set of predicates the connector has ever
# claimed, read-only measurement), MINUS per-claim match/marker bookkeeping
# predicates whose absence is an extraction outcome, not a research gap —
# `matched_keyword`, `content_term`, `bill_matched_keyword`,
# `unmapped_surveillance_tag` (a marker: its absence means the element's tags
# all mapped). Extending coverage = a data change here + an ADR decision when
# the rule itself changes (SIG-ENG-001/003).
#
# Changes after this declaration are VERSIONED (§20): bump `version`.

version = "1.0.0"

# --- device / deployment observation registries -----------------------------

[[class]]
entity_type = "deployment"
connectors = ["dot_511"]        # state-DOT/511 + municipal camera registries
tracked = [
  "camera_coordinate_source", "camera_county", "camera_direction",
  "camera_external_ref", "camera_jurisdiction", "camera_latitude",
  "camera_longitude", "camera_name", "camera_operator", "camera_roadway",
  "camera_status", "external_id",
]

