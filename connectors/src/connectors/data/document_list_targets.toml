# The `document_list` connector's committed target inventory (P37.52 /
# R11-ACQ-25, I8 §6.2). This table is DATA, not code (SIG-ENG-001 /
# SIG-INGEST-038): the reviewed document-list surfaces the I4/I6/I9b
# discovery named — identifiers, reviewed field declarations and provenance
# only; a row is a URL, a kind, a source, an adapter and an evidence ref,
# never content. Every row is a public unauthenticated surface (https, a
# committed host); all eight sources stay behind `ingestion_permitted=false`
# — the loader gate REFUSES every live fetch until the operator's OP-26
# Wave-D flips under ING-GO-D (HG-03 RB-04 `a`; the WSIPC and NASPO rows
# additionally RB-07 `a` — facts and citations only, `facts_citations_only`
# suppresses every verbatim `description` claim).
#
# Rows are `id`-sorted — the loader refuses an unsorted inventory
# (deterministic order required).

schema = "sig.document-list-targets/1"

[inventory]
# Derivation provenance: the eight ACQ-25 plan rows
# (data/acquisition_plan.csv AP-T2-042/-043/-058/-063/-076/-089/-130/-131,
# candidates I9b-C006 / I9b-C070 / I9b-C005 / I9b-C037 / I6-C004 / I4-C252 /
# I4-C253 / I4-C255), rights batch RB-04 (US agenda/procurement/grant/records
# documents) with AP-T2-058 + AP-T2-076 on RB-07 (facts + citations only).
source_ref = "docs/build/planning/2026-09-30-next-phase/data/acquisition_plan.csv (AP-T2-042/-043/-058/-063/-076/-089/-130/-131) + data/candidates_{I4,I6,I9b}.csv"
captured_on = "2026-11-13"
target_count = 8

# florida_buy_gaggle_contract — procportal_fl_florida_buy_cooperative: the
# Florida Buy (PAEC) cooperative Gaggle contract page (I9b-C006 / I9b-F011):
# the page enumerates its seven contract documents (agenda, award letter,
# bid documents, interlocal agreement, vendor response, 2024 extension,
# 2025 renewal) — pointers only, the documents' contents are never fetched
# (P8-2 no re-hosting).
[[inventory.targets]]
id = "florida_buy_gaggle_contract"
source = "procportal_fl_florida_buy_cooperative"
kind = "doclist_html"
adapter = "contract_docs_page"
url = "https://floridabuy.paec.org/gaggle-net-inc/"
publisher = "Panhandle Area Educational Consortium (PAEC), Florida Buy"
jurisdiction = "us.state_abbr:FL"
link_re = "(?i)\\.(pdf|docx?|xlsx?)(\\?|$)|/(documents?|files?|downloads?)/"
expect = ["GAGGLE", "Florida Buy"]
evidence = "I9b-C006 / I9b-F011 (candidates_I9b.csv) — contract page lists 7 linked documents (agenda, award letter, bid documents, interlocal agreement, vendor response, 2024 extension, 2025 renewal); 200 GET 2026-09-30"
[inventory.targets.contract]
ref = "florida-buy-gaggle-net-inc"
title = "GAGGLE.NET, INC. cooperative contract (Florida Buy / PAEC)"
vendor = "Gaggle.Net, Inc."
buyer = "Panhandle Area Educational Consortium (Florida Buy)"

# il_gata_csfa_3496_awardlist — grant_il_illinois_gata_csfa: the Illinois GATA
# CSFA 569-00-3496 AwardList (I4-C252 / I4-F187/F188): the served default-FY
# table mints one `grant_award` record per row keyed on the award's own id —
# the grantee column is organisation-shaped by review (units of government);
# a person-shaped name is a recorded rejection, never a subject.
[[inventory.targets]]
id = "il_gata_csfa_3496_awardlist"
source = "grant_il_illinois_gata_csfa"
kind = "doclist_html"
adapter = "award_table"
url = "https://omb.illinois.gov/PUBLIC/GATA/CSFA/AwardList.aspx?CSFA=3496"
publisher = "Illinois Law Enforcement Training and Standards Board via Illinois GOMB GATA Catalog of State Financial Assistance"
jurisdiction = "us.state_abbr:IL"
expect = ["Award ID", "Grantee Name", "CSFA"]
evidence = "I4-C252 / I4-F187/F188 (candidates_I4.csv) — AwardList.aspx?CSFA=3496 serves ~176 award rows on the default FY view (177 <tr> incl. header); FY selector 2025-2030 stays the page's own control (never submitted); 200 GET 2026-09-30"
[inventory.targets.program]
ref = "il-gata-csfa-3496"
program_name = "ILETSB Law Enforcement Camera Grant (CSFA 569-00-3496)"
funder = "Illinois Law Enforcement Training and Standards Board"
instrument_type = "grant award"
period = "FY2025"
[inventory.targets.columns]
award_id = "Award ID"
grantee = "Grantee Name"
start_date = "Start Date"
end_date = "End Date"
amount = "Amount"

