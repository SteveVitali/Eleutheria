[[api_host]]
host = "eyesonflock.com"
endpoint_prefix = "/api/v1"
tos_basis = "eyesonflock.com/api/v1 is the project's documented public JSON API, published CC-BY-SA-4.0 (rights resolved SIG-INGEST-030, 2026-08-20)."
