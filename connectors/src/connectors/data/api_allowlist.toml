# DocumentCloud — the documented public read API (api.documentcloud.org);
# single-document lookups only (the records connector refuses listings,
# SIG-INGEST-036). robots.txt is Disallow:/ — the API prefix is the documented
# programmatic surface. The source itself stays rights-gated (per-document
# rights vary); this entry records the API-mode basis, not permission.
[[api_host]]
host = "api.www.documentcloud.org"
endpoint_prefix = "/api/"
tos_basis = "api.www.documentcloud.org/api/ is DocumentCloud's documented public API; targeted document lookups under the platform ToS."
rate_limit_per_min = 5
counsel_reviewed = false

# CourtListener REST API v4 — documented keyed access (wiki.free.law); targeted
# docket/opinion lookups only (the accountability connector refuses collections
