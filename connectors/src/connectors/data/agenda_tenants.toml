#     error envelope (tenant exists on its own portal but isn't provisioned on the
#     shared host — verified=false), or 403 (access restricted — verified=false).
#   * civicclerk — {tenant}.api.civicclerk.com/v1/Events answers the event index
#     (verified=true) or 404s (link-rotted — verified=false).
#   * primegov   — POST {tenant}.primegov.com/api/v2/PublicPortal/search serves a
