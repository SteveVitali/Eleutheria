# --- platform census (P26.5): enumerated hosts that are NOT ingest targets ----
# [[platform_census]] rows are registry DATA, never targets — tenant_targets()
# reads only [tenants.*]. Each row is a vendor-tenant host the P26.5 enumeration
# found, with the honest reason it is not an ingest target:
#   robots_disallow_all  — the host's robots.txt is `User-agent: *` / `Disallow: /`
#                          (Granicus platform-wide; the refusal stands, never
#                          bypassed — SIG-INGEST-012 / Rule 2);
#   no_bounded_api       — the host serves, but the platform exposes no bounded
#                          public JSON index a targeted lookup can name
#                          (NovusAGENDA's WebForms postback portal, CivicPlus
#                          AgendaCenter HTML, IQM2 Meeting Management HTML,
#                          BoardDocs NSF views);
#   unreachable          — enumerated name did not answer (NXDOMAIN/timeout/5xx);
#   access_restricted    — the host answers 401/403;
#   redirect             — the host only redirects (parking/SSO hand-off);
#   non_jurisdiction_host— a vendor infra/sandbox hostname, not a jurisdiction
#                          tenant (PrimeGov dev/person-named sandboxes);
#   not_provisioned      — a Legistar slug the shared InSite host does not
#                          provision AND whose portal does not serve.
