# SPDX-License-Identifier: Apache-2.0
# The committed OGC WFS inventory (P37.69b / R11-ACQ-23b —
# `sig.ogc-wfs-targets/1`). Every row is reviewed data: the service URL is
# derived ONLY from the committed candidate record (the seat notes record
# the derivation), the declared typename/selector is the seat's own literal
# where the record carries one, and the bound (`count`) is the reviewed page
# size. A row never invents an endpoint; the `[[enumerated]]` table records
# seats whose concrete WFS endpoint is NOT evidenced by the committed
# record (D-P37.69b-1).
#
# KINDS:
#   wfs_capabilities — ONE `?service=WFS&request=GetCapabilities` document;
#                      emits the ogc_service record (served feature-type
#                      names + declared version); `expected_typenames` pins
#                      names the document MUST serve; `feature_type_selector`
#                      ("sole" or a literal name) resolves a bounded
#                      wfs_get_feature follow-on inside the same run
#                      (discover_more — the served document itself names the
#                      feature type, never a guessed one).
#   wfs_get_feature  — ONE bounded `…&request=GetFeature&typenames=<t>&
#                      count=<n>` page; emits traffic_camera rows via the
#                      shared CameraRegistryEntry emit + one open_data_index
#                      count record.
#
# WFS 2.0.0 (`typenames` + `count`) is the declared family member; other
# service versions are a later lane and fail at expansion.

schema = "sig.ogc-wfs-targets/1"
inventory_version = "2026.11.14"

# ------------------------------------------------------ Runnymede (I5-C312) --
