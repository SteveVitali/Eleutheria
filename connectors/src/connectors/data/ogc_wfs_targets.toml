# record names "GeoServer WFS community:cctv_cameras"; its first resource is
# the WMS GetCapabilities URL on the same GeoServer virtual-service path —
# the WFS sibling at /wfs is the recorded GeoServer mount (the conventional
# OWS sibling of the committed /wms URL; the derivation is recorded here,
# never hidden).

[[targets]]
id = "p37_69b_wfs_runny_capabilities"
