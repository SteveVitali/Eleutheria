[params]
# Areas chained into one discovery `out count;` request (bounded so the GET URL
# stays under the instance's request limit).
areas_per_count = 50
# Seconds between Overpass requests (the reviewed ~30s pacing; rate_limit_per_min
# 2 on the emitted targets — the shared rate limiter enforces it per host).
pace_seconds = 30
# Query timeouts (seconds) — fetch tiles carry the ACQ-17 180s budget; the
# count probes are cheap aggregates and keep a shorter bound.
fetch_timeout = 180
count_timeout = 90
# Discovery-vs-fetch reconciliation: a tile is drifting when
# |actual - expected| > max(floor, expected * tolerance_pct) — elements can be
# mapped or deleted between the two passes, so small deltas are movement,
# not drift.
count_tolerance_pct = 0.02
count_tolerance_floor = 2
