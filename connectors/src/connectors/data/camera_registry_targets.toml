# --- P36.6 (ACQ-10): Chicago per-camera violation usage series --------------
# Two socrata_aggregate targets on the already-flipped camreg_chicago_il (the
# plan's licence-match widen passed — same portal, same publisher, the
# LicenseRef-PublicRecord-FactualCompilation basis + Chicago's C5 revocation
# clause ride the existing flip). Each emits camera × month enforcement_count
# claims over the design's committed 2023-10-onward first window — never the
# per-violation/citation rows Part VIII prohibits.

[[targets]]
id = "chicago_speed_violations_monthly"
axis_order = "lon-lat"
source_id = "camreg_chicago_il"
kind = "socrata_aggregate"
platform = "socrata"
url = "https://data.cityofchicago.org/resource/hhkd-xvj4.json"
layer_url = "https://data.cityofchicago.org/resource/hhkd-xvj4.json"
# P36.6 (ACQ-10, I8 NEW-7): the published rows are already per-camera-DAY
# counts (catalog description 'the daily volume of violations ... for each
# camera', I4-C053) — the transport groups them to camera × month:
# subject camera_id, period date_trunc_ym(violation_date), sum(violations)
# AS count. address/intersection/latitude/longitude stay OUT of the group —
# the subject's location evidence lives on the registered location layers
# (chicago_il_speed_cameras), never re-asserted off an aggregate row.
aggregate_subject_field = "camera_id"
aggregate_period_field = "violation_date"
aggregate_period_kind = "month"
aggregate_count_field = "violations"
aggregate_count_function = "sum"
aggregate_measure = "violations"
where = "violation_date >= '2023-10-01'"
agency = "City of Chicago Department of Transportation"
operator = "City of Chicago Department of Transportation"
state = "US-IL"
jurisdiction_scheme = "iso.3166_2"
observed_count = 5760
observed_fields = "camera_id,intersection,violation_date,violations,latitude,longitude"
verified = 2026-09-30
enum_source = "r11-acq-01:AP-T1-026"
license_spdx = "LicenseRef-PublicRecord-FactualCompilation"
rights_note = "Rides the existing camreg_chicago_il flip (GL-GATE-07, LicenseRef-PublicRecord-FactualCompilation) — the plan's licence-match widen passed (same data.cityofchicago.org portal, same CDOT publisher, same licence surface as the flipped location datasets). Chicago's C5 revocation clause applies to these targets exactly as to the location layers."
notes = "P36.6 (ACQ-10) registration review (plan AP-T1-026, cand I4-C053). 'Speed Camera Violations' hhkd-xvj4 — 'daily volume of violations that have occurred in Children's Safety Zones for each camera ... July 1, 2014 until present, minus the most recent 14 days' (catalog description verbatim; the 14-day publisher lag is asserted cadence, never smoothed). The group row count was NOT read — observed_count=5,760 is the ACQ-10 plan estimate (≈160 cameras × 36 months of the committed 2023-10 window); a group table outgrowing its planned pages fails loud on the paging bound. Aggregate camera × month rows ONLY — the published per-day rows are never emitted row-level, and no plate/owner/citation surface exists in the schema (I4-C053). The published schema's `address` column is a denied field (F-330): deliberately absent from the declared surface — never requested, never emitted; its name is recorded here as the exclusion."
place_geoid = "1714000"  # P36.6 (ACQ-10, I8 R4): Census place GEOID for Chicago, IL.
jurisdiction_place = "Chicago"
technology = "ate-speed"

