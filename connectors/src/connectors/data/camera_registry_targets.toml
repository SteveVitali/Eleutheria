# P26.9 — municipal / transit / non-US camera-registry endpoints (the SOURCES.8
# enumeration registry, sibling to `dot_511_targets.toml`).
#
# `[[targets]]` rows are verified endpoint+layer registrations; `kind`
# determines the platform adapter:
#   - `arcgis_query`  — an ArcGIS FeatureServer/MapServer layer; `url` is the
#     layer root and the connector expands it into deterministic paginated
#     `/query` requests over the observed row count.
#   - `socrata_rows`  — a Socrata `/resource/<id>.json` dataset; `url` is the
#     resource root and the connector expands it into deterministic
#     `$limit/$offset` pages over the observed row count.
# `platform` records the publishing platform for audit; `jurisdiction_scheme`
# is the candidate-identifier scheme carried on the `camera_jurisdiction`
# claim (`us.state_abbr` for US admin-1 codes, `iso.3166_2` for ISO 3166-2
# subdivision codes, `iso.3166_1_alpha2` for country-level publishers).
# `observed` is the row count seen at enumeration time; `verified` is the last
# verification date. These rows are the enumerative audit — every registry the
# connector fetched is here, and rows for un-yielding/negative outcomes are
# kept in `[[enumerated]]` rather than silently dropped.
#
# REGISTRY-ONLY (Part VIII): these endpoints enumerate camera RECORDS. Camera
# image / video / feed / HLS / iframe / still fields are NEVER fetched or
# emitted; field names are matched by the media blocklist and only the NAMES
# land in `excluded_fields`.
#
# A gated source keeps its `[[targets]]` rows — the endpoint is real and
# verified; the source row's `ingestion_permitted=false` is what stops the
# fetch (the gate, not the registry, is the control).

