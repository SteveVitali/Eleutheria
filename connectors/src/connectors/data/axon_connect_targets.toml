#
# P36.76 / R11-ACQ-31 — the committed Axon Fusus `Connect <Place>` site set.
#
# This is DATA, not code (SIG-ENG-001): the bounded inventory of agency-published
# `Connect <Place>` / Fusus white-label camera-registration surfaces the
# `axon_connect` connector may address — the I9a-C003 candidate set plus the
# lead-resolution evidence recorded beside each row. The connector discovers
# NOTHING beyond this table: a target outside the committed set is refused at
# discover() (SIG-INGEST-045i — identifiers only, never content).
#
# Two bounded targets per site, generated by connectors.axon_connect:
#
#   * `connect_page`        — ONE recorded GET of the public registration page
#                             (`registration_url`), parsed to programme facts;
#   * `marked_host_screen`  — ONE recorded GET of `https://<host>:8443
#                             /faststream/login.html`, persisted ONLY as the
#                             sig.fusus-screen/1 record (hash + markers +
#                             status — never the login page's bytes).
#
# Both legs are the OM-20 row-351 named mutation ("screen records + page
# hashes + registry-row appends — single recorded GETs of public registration
# pages"), pre-authorised at GATE-G5 (2026-10-25T18:40Z, expires GATE-G6). Leg
# B — the first real host's wire/fetch as a connector run — is the operator's
# act (OP-26); the source row stays ingestion_permitted=false.

schema = "sig.axon-connect-targets/1"

[inventory]
#: Where the candidate set comes from — the lead research pass's records.
source_ref = "I9a-C003"
evidence_ref = "docs/build/planning/2026-09-30-next-phase/research/I7-candidates.md (Axon section: I9a-C003 hosts, I9a-F004 fetch record, I9a-Q002 lead list)"
captured_on = "2026-10-27"
selection_rule = "agency-published Axon Fusus `Connect <Place>`/Fusus white-label camera-registration pages — the I9a-C003 lead set resolved to hosts by the recorded evidence column; public registration surfaces only, never registrant surfaces"
site_count = 6
#: Site-level opt-outs (§26 rule 7's site-granular twin): an agency that asked
#: SIG to stop is listed here and fetch() refuses before any egress — the
#: column exists so a recorded opt-out is honoured without a rebuild.
opted_out_sites = []

