# The versioned agenda-content vocabulary (P26.6 / SOURCES.6) — the reviewed
# keyword/type set the `procurement` connector scans captured agenda/minutes/
# matter documents for, plus the Part VIII forbidden-token guard applied to every
# emitted literal.
#
# This table is DATA, not code (SIG-ENG-001): the term set, the claim predicate
# the matches emit under, and the guard lists are data rows reviewed on their
# own. Changes are VERSIONED MIGRATIONS (§20): bump `vocab_version` and add the
# change, never silently rewrite a row, so a re-extraction under a new vocabulary
# is a new interpretation, never a destructive overwrite (SIG-INGEST-017).
#
# Scope is deliberately surveillance-only: a document whose captured text matches
# a [[terms]] pattern emits a `content_term` claim carrying the matched VERBATIM
# literal as raw_value (a slice of the captured text, located by a byte_range /
# page locator — the OKC-document convention). Nothing is inferred beyond the
# captured bytes: a match asserts "this document contains this term", never
# "this deployment exists".
#
# NOTE ON TOML ORDERING: every top-level key MUST appear ABOVE the first [[terms]]
# header — otherwise TOML nests it under that table.

# The vocabulary version stamped onto emitted rows (§20).
# 2026.09.18 (P26.10 / SOURCES.9): additive procurement-prose recall fix — the
# 2026.09.17 set was reviewed against agenda/minutes phrasing; live procurement
# records phrase the SAME reviewed technologies differently. Added, never
# rewritten: `alpr` gains "license plate recognition" / "licence plate
# recognition" / "\blpr\b" (the dominant US procurement expansion — Montgomery
# County's parking ALPR solicitation says "License Plate Recognition (LPR)",
# not "ALPR"); `cctv` gains "security camera" + "surveillance system" (the
# canonical names for the technology the term was reviewed to cover — a bid
# titled "Security Camera System" carries no other vocab literal). Both stay
# verbatim-literal claims: a match still asserts only "this record contains
# this term".
# 2026.10.10 (P35.8 / ACQ-04, I4 NEW-6): the Round-11 widening bump — adds the
# reviewed ATE, mobile-forensics, video-analytics, biometric, SMM,
# electronic-monitoring and school-surveillance term classes (plus the vendor
# rows the Legistar keyword pass names: Axon, BriefCam, Genetec, Rekor, Fusus,
# Verra Mobility, Clearview AI) so the keyword-filtered matter pass's
# client-side precision filter keeps exactly the reviewed hits. Social-media
# monitoring gains the SMM vendor names on WORD BOUNDARIES (the I4 NEW-6
# finding: a bare substring catches 'Brinc' inside 'Parsons Brinckerhoff');
# `alpr` gains the bare "license plate"/"licence plate" phrasings and "license
# plate camera" (the technology name itself — the forbidden-token list above
# stays narrower than a plate NUMBER, unchanged); `drone` gains "unmanned aero"
# (the keyword `unmanned aer` is the server-side substring; the filter keeps
# the aeronautical/aerospace phrasings it surfaces); `gunshot_detection` gains
# the "gunshot locat"/"gunfire locat" locator phrasings. Additions only — no
# prior row or pattern is rewritten.
vocab_version = "2026.10.10"

# Part VIII §0.7 / §43.2 guard for emitted agenda-content rows (the mechanical
# form of "no plate / per-trip / per-person / per-search data"). A matched
# literal or emitted field carrying one of these tokens is SUPPRESSED — the
# suppression is recorded on the document row, never emitted and never a crash.
#
# Deliberately NARROWER than the OKC list: "license plate" / "licence plate" are
# NOT forbidden here because the surveillance vocabulary itself legitimately
# names the technology ("automated license plate readers" is a claim the ticket
# exists to emit). What stays forbidden are the per-DATUM tokens — a plate
# number, a per-trip/per-person/per-search fact, a home address — i.e. records
# ABOUT a person/plate/search, not a technology name. raw_value is always the
# reviewed, bounded literal — never a free-text excerpt — so the guard's reach
# is over exactly the literals below and the row's other string fields.
forbidden_tokens = [
  "plate number", "plate_number",
  "per-person", "per_person", "per person",
  "per-trip", "per_trip", "per trip",
  "travel history", "travel_history", "trip history", "individual travel",
  "per-search", "per_search", "per search", "hotlist hit", "hotlist_hit",
  "home address", "home_address",
]

# Predicate ids that NAME a natural person — refused outright (§43.4 default).
# The agenda-content path never emits these; the guard exists so a future vocab
# change cannot smuggle a person-named predicate past review.
person_naming_predicates = [
  "officer_name", "person_name", "individual_name", "named_individual",
]

# --- the surveillance-relevance term set ---------------------------------------
# Each [[terms]] row: a stable machine `id` (the typed claim's value), a human
# `label`, a coarse `kind` (technology | vendor | instrument | program), and the
# reviewed regex `patterns` (matched case-insensitively against the captured
# document text). Patterns carry word-boundary anchors where a bare substring
# would false-positive ("uas" inside "persuasion", "alpr" inside a name).

[[terms]]
id = "alpr"
kind = "technology"
label = "automated license plate reader"
patterns = [
  "\\balpr\\b", "\\balprs\\b",
  "automated license plate", "automatic license plate",
  "license plate reader", "licence plate reader", "license-plate reader",
  # P26.10: the dominant procurement phrasing for the same technology family —
  # "License Plate Recognition (LPR)" is how US solicitations name ALPR.
  "license plate recognition", "licence plate recognition", "\\blpr\\b",
  # P35.8: the bare technology name itself — the keyword pass's server-side
  # `license plate` substring surfaces titles like "License Plate Camera
  # Program" that carry no reader/recognition phrasing; the forbidden-token
  # list stays narrower than a plate NUMBER, so the name is claimable.
  "license plate", "licence plate", "license plate camera",
]

[[terms]]
id = "flock_safety"
kind = "vendor"
label = "Flock Safety"
patterns = ["flock safety", "flock group", "\\bflock\\s+cameras?\\b", "\\bflock\\s+system"]

[[terms]]
id = "vigilant"
kind = "vendor"
label = "Vigilant Solutions"
patterns = ["vigilant solutions", "\\bvigilant\\b"]

[[terms]]
id = "rtcc"
kind = "program"
label = "real-time crime center"
patterns = [
  "\\brtcc\\b", "real.?time crime", "real-time crime cent",
  "crime center", "crime centre",
]

[[terms]]
id = "drone"
kind = "technology"
label = "drone / unmanned aerial system"
patterns = [
  "\\bdrone\\b", "\\bdrones\\b", "\\buas\\b", "\\bsuas\\b",
  "unmanned aerial", "unmanned aircraft",
  # P35.8: the server-side `unmanned aer` substring also surfaces the
  # aeronautical/aerospace phrasings — kept by the precision filter.
  "unmanned aero",
]

[[terms]]
id = "shotspotter"
kind = "vendor"
label = "ShotSpotter / SoundThinking"
patterns = ["shotspotter", "shot spotter", "soundthinking", "acoustic gunshot"]

[[terms]]
id = "surveillance_ordinance"
kind = "instrument"
label = "surveillance oversight ordinance"
patterns = [
  "surveillance ordinance", "\\bccops\\b", "surveillance technolog",
  "surveillance equipment", "surveillance oversight", "surveillance policy",
]

[[terms]]
id = "facial_recognition"
kind = "technology"
label = "facial recognition"
patterns = ["facial recognition", "face recognition", "facial biometric"]

[[terms]]
id = "body_worn_camera"
kind = "technology"
label = "body-worn camera"
patterns = ["body.?worn", "body camera", "bodycam", "body-worn cam"]

[[terms]]
id = "cctv"
kind = "technology"
label = "CCTV / video surveillance"
patterns = [
  "\\bcctv\\b", "closed.?circuit", "video surveillance", "surveillance camera",
  "security camera network",
  # P26.10: procurement prose names the same technology "security camera
  # (system)" and "(security) surveillance system" — additive recall for the
  # reviewed term family.
  "security camera", "surveillance system",
]

[[terms]]
id = "cell_site_simulator"
kind = "technology"
label = "cell-site simulator"
patterns = ["cell.?site simulator", "\\bstingray\\b", "imsi catcher"]

[[terms]]
id = "predictive_policing"
kind = "technology"
label = "predictive policing"
patterns = ["predictive policing", "\\bpredpol\\b", "predictive analysis"]

[[terms]]
id = "gunshot_detection"
kind = "technology"
label = "gunshot detection"
# P35.8: the locator phrasings the keyword pass surfaces ("gunshot location
# technology") join the detection phrasings — additions only.
patterns = ["gunshot detection", "gunfire detection", "acoustic sensor",
            "gunshot locat", "gunfire locat"]

[[terms]]
id = "social_media_monitoring"
kind = "technology"
label = "social media monitoring"
# P35.8 (I4 NEW-6): the SMM vendor names ride WORD BOUNDARIES — a bare
# substring is how 'Brinc' lands inside 'Parsons Brinckerhoff' (I4-Q015).
patterns = [
  "social media monitoring", "social-media monitoring", "\\bgeofeedia\\b",
  "social media surveillance", "social media intelligence",
  "\\bdataminr\\b", "babel street", "\\bskopenow\\b", "shadowdragon",
  "shadow dragon", "voyager labs", "\\bcobwebs\\b", "\\bfivecast\\b",
]

# The procurement-matter vocabulary (P26.2's reviewed contract_matter_patterns)
# rides the same scan: a document carrying contract-family language emits a
# `contract_notice` content claim, so a surveillance-adjacent agenda document is
# flagged as procurement-relevant even when no technology term appears.
[[terms]]
id = "contract_notice"
kind = "instrument"
label = "contract / procurement instrument"
patterns = [
  "\\bcontract\\b", "\\bcontracts\\b", "\\bagreement\\b", "\\bpurchase order\\b",
  "\\bprocurement\\b", "\\blease\\b", "\\bleases\\b", "\\bleasing\\b",
  "\\binterlocal\\b", "professional services", "\\bsettlement\\b",
  "\\bsolicitation\\b", "\\bbid award\\b", "\\brfp\\b", "\\brfq\\b",
]

# --- the Round-11 term classes (P35.8 / ACQ-04, I4 NEW-6) ---------------------
# The classes the widened Legistar matter pass names server-side — the reviewed
# patterns below are the client-side word-boundary precision filter that drops
# the substring noise the broad `substringof` terms return.

[[terms]]
id = "automated_traffic_enforcement"
kind = "technology"
label = "automated traffic enforcement"
patterns = [
  "automated traffic enforcement", "automated enforcement",
  "automated traffic", "red light camera", "red-light camera",
  "speed camera", "speed safety camera", "speed enforcement",
  "photo enforcement", "photo radar",
]

[[terms]]
id = "mobile_forensics"
kind = "technology"
label = "mobile-device forensics"
# Word boundaries on the short vendor tokens — 'XRY'/'MSAB' must not land
# inside a longer word.
patterns = [
  "mobile forensic", "cell.?phone extraction", "phone forensic",
  "device extraction", "forensic extraction",
  "\\bcellebrite\\b", "graykey", "grayshift",
  "magnet forensics", "magnet axiom", "axiom forensics",
  "oxygen forensic", "belkasoft", "\\bmsab\\b", "\\bxry\\b",
]

[[terms]]
id = "video_analytics"
kind = "technology"
label = "video analytics"
patterns = [
  "video analytics", "video analytic", "video synopsis",
  "video content analy", "behavioral video",
]

[[terms]]
id = "biometric"
kind = "technology"
label = "biometric identification"
patterns = [
  "\\bbiometric", "iris recognition", "iris scan",
  "voiceprint", "voice recognition", "gait recognition",
]

[[terms]]
id = "electronic_monitoring"
kind = "program"
label = "electronic monitoring"
# Cook County's EM contract chain (I4-C218) is the reviewed anchor. The bare
# "monitoring" word is deliberately ABSENT — a workers-comp or medical
# monitoring title is the I4-C218 noise class the precision pass drops.
patterns = [
  "electronic monitoring", "electronic monitor",
  "ankle monitor", "ankle bracelet", "\\bgps monitor",
  "\\bscram\\b", "\\battenti\\b", "sentinel offender",
  "\\btrack group\\b", "electronic home detention",
  "electronic supervision", "house arrest monitor",
]

[[terms]]
id = "school_surveillance"
kind = "program"
label = "school surveillance"
patterns = [
  "\\bgaggle\\b", "gaggle.net", "goguardian", "\\bsecurly\\b",
  "lightspeed systems", "lightspeed filter", "lightspeed alert",
  "linewize", "student monitoring", "school surveillance",
  "student safety monitor",
]

[[terms]]
id = "axon"
kind = "vendor"
label = "Axon Enterprise"
patterns = ["\\baxon\\b", "axon enterprise", "axon body", "axon fleet"]

[[terms]]
id = "briefcam"
kind = "vendor"
label = "BriefCam"
patterns = ["briefcam", "brief cam"]

[[terms]]
id = "genetec"
kind = "vendor"
label = "Genetec"
patterns = ["genetec"]

[[terms]]
id = "rekor"
kind = "vendor"
label = "Rekor Systems"
patterns = ["\\brekor\\b", "rekor systems"]

[[terms]]
id = "fusus"
kind = "vendor"
label = "Fusus"
patterns = ["\\bfusus\\b", "axon fusus"]

[[terms]]
id = "verra_mobility"
kind = "vendor"
label = "Verra Mobility"
patterns = ["verra mobility", "\\bverra\\b", "american traffic solutions"]

[[terms]]
id = "clearview_ai"
kind = "vendor"
label = "Clearview AI"
# The disambiguated forms only — a bare "Clearview" false-positives on the
# municipality name and on "Clearview Data Systems" (the CROL reviewed
# false-positive class, I8 §4.2); the keyword pass's server-side `Clearview`
# substring still surfaces the titles, and only these forms keep them.
patterns = ["clearview ai", "clearview face", "clearview facial"]
