# statrep_us_ice_287_monthly — the SAME landing page's monthlyEncounter* /
# encounterReport* PDF links as pointers ONLY (AP-T2-193 is S3-flagged,
# IND-P8): the files' contents are never fetched, so no per-encounter or
# person-level row can exist by construction — the aggregate-only screen is
# structural.
[[inventory.targets]]
id = "ice_287g_monthly_index"
source = "statrep_us_ice_287_monthly"
kind = "federal_index"
adapter = "index_links"
url = "https://www.ice.gov/identify-and-arrest/287g"
license_spdx = "CC0-1.0"
publisher = "U.S. Immigration and Customs Enforcement, ERO"
