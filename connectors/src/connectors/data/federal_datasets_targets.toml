# The `federal_datasets` connector's committed target inventory (P37.49 /
# R11-ACQ-21, I8 §6.2). This table is DATA, not code (SIG-ENG-001 /
# SIG-INGEST-038): the reviewed federal-dataset surfaces the I4/I6 discovery
# named — identifiers + provenance only, a row is a URL, a kind, a source and
# an evidence ref, never content. Every row is a public unauthenticated
# surface (https, a committed host); all eight sources stay behind
# `ingestion_permitted=false` — the loader gate REFUSES every live fetch
# until the operator's OP-26 Wave-D flips under ING-GO-D (HG-03 RB-05 `a`).

schema = "sig.federal-dataset-targets/1"

[inventory]
# Derivation provenance: the eight ACQ-21 plan rows
# (data/acquisition_plan.csv AP-T2-002/-006/-011/-016/-034/-070/-087/-193,
# candidates I4-C085 / I6-C024 / I6-C036+I4-C116 / I4-C280 / I4-C211 /
# I4-C115 / I4-C027 / I4-C281), rights batch RB-05 (US federal works) with
# AP-T2-193 additionally S3-flagged (IND-P8) — pointer lane only.
source_ref = "docs/build/planning/2026-09-30-next-phase/data/acquisition_plan.csv (AP-T2-002/-006/-011/-016/-034/-070/-087/-193) + data/candidates_consolidated.csv (I4-C085, I6-C024, I6-C036+I4-C116, I4-C280, I4-C211, I4-C115, I4-C027, I4-C281)"
captured_on = "2026-11-13"
target_count = 13

# --- Federal Register API term searches (fr_documents) -----------------------
# legis_us_federal_register_api — the surveillance-technology document sweep
# (I6-C024: one term per query; the API's OR is not relied on). Six committed
# terms, one bounded first page each — deeper pagination is the cadence job's
# windowed re-query, recorded not fabricated.
[[inventory.targets]]
id = "dhs_ai_inventory_index"
source = "statrep_us_dhs_ai_use"
kind = "federal_index"
adapter = "index_links"
url = "https://www.dhs.gov/ai/use-case-inventory"
license_spdx = "CC0-1.0"
publisher = "U.S. Department of Homeland Security (Office of the Chief Information Officer)"
link_re = "(?i)(use-case|use_case|inventory)"
expect = ["Use Case Inventory"]
evidence = "I4-C115 / I4-F090 (candidates_consolidated.csv) — inventory page enumerates per-component inventories (214 DHS use cases across 12 components at review); page verified live-read 2026-11-13"

# statrep_us_ice_287_participating — the 287(g) landing page resolves the
# current dated participatingAgencies*.xlsx link (I4-C280: filename changes
# each issue — link discovery, never a pinned stale name); the resolved
# workbook is the federal_xlsx child target the roster adapter reads.
[[inventory.targets]]
id = "fr_term_aerostat"
source = "statrep_tx_south_padre_island_faa"
kind = "federal_json"
adapter = "fr_documents"
url = "https://www.federalregister.gov/api/v1/documents.json?conditions%5Bterm%5D=aerostat&per_page=100&page=1&fields%5B%5D=document_number&fields%5B%5D=title&fields%5B%5D=type&fields%5B%5D=publication_date&fields%5B%5D=citation&fields%5B%5D=html_url&fields%5B%5D=agencies"
license_spdx = "CC0-1.0"
publisher = "Office of the Federal Register (NARA) / GPO"
expect = []
evidence = "I4-C027 (candidates_consolidated.csv) — 'aerostat' term query surfaces the South Padre Island restricted-area NPRM (doc 2025-16236, Docket FAA-2025-2318); response shape verified live-read 2026-11-13"

