expect = ["287(g)"]
evidence = "I4-C281 / I4-F205 (candidates_consolidated.csv) — landing page links monthly PDFs Jan 2025 - Sep 2026 plus the Oct 2019 - Jan 2021 series; contents never read (fetch cap) — pointer lane only under S3"

# statrep_us_wiretap_summary_tables — the annual Wiretap Report's data-table
# index (I4-C085): the Wire 1-9 + appendix table pages enumerate as document
# pointers. The tables' per-jurisdiction aggregates ride a follow-up —
# judge/officer names are never read (the §43.4 S5 gate; Wire 2's
# authorizations-by-judge table stays a pointer).
[[inventory.targets]]
id = "nces_ssocs_dataset_index"
source = "camreg_us_nces_school_survey_on_crime"
kind = "federal_index"
adapter = "index_links"
url = "https://nces.ed.gov/use-work/dataset/2021-22-school-survey-crime-and-safety-ssocs-public-use-data-files-and-users-manual"
license_spdx = "CC0-1.0"
publisher = "National Center for Education Statistics (IES, US Dept of Education)"
link_re = "(?i)(ssocs|survey-crime-and-safety|\\.(zip|csv|sav|dat|dta|sas7bdat))"
expect = ["SSOCS"]
evidence = "I4-C211 / I4-F174/F175 (candidates_consolidated.csv) — dataset page enumerates 9 public-use waves 1999-2000..2021-22; 200 GET verified 2026-09-30"

