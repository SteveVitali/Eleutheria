# The local-group registry (SIG-INGEST-039, SIG-TASK-014) and the national
# partner roster (SIG-INGEST-040). DATA, not code.
#
# The local-group URLs were RECOVERED from the last surviving archive capture of
# the ecosystem directory and then individually re-tested on 2026-08-20 (SC-11);
# they are not the outline's bare names. A 403 means the site is alive behind bot
# protection, not that it is gone (http_status records the distinction).
#
# Two coverage facts are first-class, never silent drops:
#   * groups the outline names but the recovered directory does not carry are
#     status="unlocated" (SIG-INGEST-039a);
#   * FlockReporter — the directory itself — is status="disappeared" with
#     disappeared_observed_at (SIG-INGEST-039b): its DNS ceased to resolve
#     between 2026-07-28 (its only capture) and 2026-08-20.

