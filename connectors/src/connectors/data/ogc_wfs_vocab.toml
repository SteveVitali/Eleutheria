# The versioned OGC WFS vocabulary (P37.69b / R11-ACQ-23b, I8 §6.2 — the
# international open-data family part b). This table is DATA, not code
# (SIG-ENG-001): the connector's shared predicate allowlist, forbidden
# predicate genres, committed service host set, the served-CRS → axis-order
# map and the default sensitivity class are data rows reviewed on their own.
# Changes after P37.69b are VERSIONED MIGRATIONS — bump `vocab_version` and
# add the change, never silently rewrite a row (SIG-INGEST-017).
#
# NOTE ON TOML ORDERING: every top-level key MUST appear ABOVE the first
# [table] header — otherwise TOML nests it under that table.

schema = "sig.ogc-wfs-vocab/1"

# The family's own vocabulary version, stamped onto every emitted row (§20).
vocab_version = "2026.11.14"

# The predicate allowlist enforced as a hard schema gate (SIG-INGEST-033):
# the ogc_wfs connector may write ONLY service-record and count-record
# predicates — the capabilities document's own served facts plus the
# reviewed per-seat declarations (camera rows ride dot_511's shared emit
# under ITS allowlist, exactly as the P37.69a ODS/file lanes did). A person
# name, a deployment assertion, an operator inference or a device field is a
# schema error on this lane.
predicate_allowlist = [
  "portal_index",
  "external_id",
  "title",
  "published_by",
  "jurisdiction",
  "technology",
  "as_of",
]

# Predicate genres this family must never emit (belt-and-suspenders beside
# the allowlist — a belt that fails closed on an edit adding a forbidden
# genre member to the allowlist).
forbidden_predicate_genres = [
  "person_identifier",
  "person_contact",
  "person_role",
  "camera_operator",
  "deployment_status",
]

# The committed OGC service host set — a served or configured URL off this
# set is a review error, never silently allowed.
hosts = [
  "maps.runnymede.gov.uk",
  "southkesteven.statmap.co.uk",
  "clacks.cloud.cadcorp.com",
]

# Operator-published camera registries: the reviewed default class is C1
# (§43.3 — publisher-open data, point coordinates republish exactly).
default_sensitivity_class = "C1"

# The served-CRS → declared axis-order map (P35.16 / F-322): a GML `pos`
# pair is read under the order the SERVED `srsName` declares — an unmapped
# srsName is ContentDrift, never a guessed order. EPSG:4326 GML order is
# lat-lon; CRS:84 is lon-lat.
[srs_axis_orders]
"urn:ogc:def:crs:EPSG::4326" = "lat-lon"
"http://www.opengis.net/def/crs/EPSG/0/4326" = "lat-lon"
"EPSG:4326" = "lat-lon"
"urn:x-ogc:def:crs:EPSG:4326" = "lat-lon"
"CRS:84" = "lon-lat"
"urn:ogc:def:crs:OGC::CRS84" = "lon-lat"
"http://www.opengis.net/def/crs/OGC/0/CRS84" = "lon-lat"
