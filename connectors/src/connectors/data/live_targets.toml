# DECP consolidated monthly file — the verbatim F9.16 shape
# ({"marches":{"marche":[...]}}) the france_belgium procurement connector parses.
# decp-2024-01.json is the smallest monthly file (~1.4MB), a *resource* of the
# dataset `donnees-essentielles-de-la-commande-publique-fichiers-consolides`.
#
# P25.7 dataset-API indirection: the `static.data.gouv.fr/resources/<dataset>/
# <timestamp>/` URL carries a regeneration timestamp — a republished resource
# moves URL and the pinned one 404s. The seed target is therefore the dataset
# document on the documented data.gouv.fr API v1 (`www.data.gouv.fr /api/1/`,
# allow-listed under ADR-083); the `france_belgium_procurement` connector
# resolves the reviewed resource's CURRENT `url` from the captured index at run
# time (`resource_title` is the reviewed selector). A regenerated resource
# resolves to its new timestamped URL; a removed/renamed resource is a recorded
# `link_rotted` disappearance — never a silent fallback to a stale URL.
[decp_fr]
kind = "procurement"
targets = [
  { id = "decp-dataset", url = "https://www.data.gouv.fr/api/1/datasets/donnees-essentielles-de-la-commande-publique-fichiers-consolides/", kind = "dataset_index", resource_title = "decp-2024-01.json", resource_kind = "contract" },
]

# --- document-capture targets (P25.5) ------------------------------------------
# For the counsel-flipped document sources the connector captures the upstream
# document itself as an EvidenceArtifact row (provenance + P07.1 verdict; the
# bytes are never re-hosted — LicenseRef-DerivedFacts-Citations). Field-level
# claims still come only from the curated extraction path; a changed shape fails
# loud rather than fabricating a claim.

# RAA — the national prefecture gazette index (data.gouv.fr CSV, ODbL-1.0). The
# `resource_index` kind parses the CSV STRICTLY (a changed header is
# ContentDrift) and fans out to a bounded set of prefecture gazette PDFs — the
# reviewed bounds live in france_belgium_vocab.toml [raa_index] (max_documents=8,
# HTTPS-only, departement-pattern rows only), never the full ~22k archive. The
# index CSV is allow-listed under static.data.gouv.fr /resources/; prefecture
# hosts are plain CRAWL.
[raa_prefectures]
kind = "resource_index"
targets = [
  { id = "raa-prefectures-index", url = "https://static.data.gouv.fr/resources/recueils-des-actes-administratifs-des-prefectures/20260914-114014/raa-des-prefectures.csv", kind = "resource_index" },
]

# MaDada — the platform's own Atom feed of successful requests (the platform
# publishes it; application/atom+xml). The `feed` kind parses Atom STRICTLY
# (entry-shape drift is ContentDrift) and emits records_request contexts with
# fr.cada acquisition — request text (title/summary/content) is NEVER read or
# retained (france_belgium_vocab.toml [madada_feed] `never_emit`).
[madada]
kind = "feed"
targets = [
  { id = "madada-successful-requests", url = "https://madada.fr/feed/search/%20(latest_status:successful%20OR%20latest_status:partially_successful)", kind = "feed" },
]

