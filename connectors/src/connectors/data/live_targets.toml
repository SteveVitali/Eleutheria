# --- coarse international curated adapters (P25.4) -----------------------------
# The three counsel-flipped coarse sources (HG-02, derived-facts basis) now have
# per-source adapter specs in coarse_international_vocab.toml [adapters.*] —
# each page is the discovery surface for its real data surface, parsed STRICTLY
# (a changed shape is ContentDrift, never silent zero).

# Carnegie AI GSI — the Next.js feature page is an `embedded_dataset_page`: its
# <script src> chunk links are the discovery surface (discover_more resolves the
# bounded `dataset_chunk` targets); the chunk carrying the `{arrayItem:!0,`
# marker embeds the 75-country dataset array. The page itself is captured as an
# EvidenceArtifact. The publications/interactive URL 301s to the /features/ page
# (the transport follows redirects) — the canonical surface is below.
[carnegie_ai_gsi]
kind = "document"
targets = [
  { id = "carnegie-aigs-index", url = "https://carnegieendowment.org/features/ai-global-surveillance-technology", kind = "document" },
]

# Facial Recognition World Map — the surfshark.com map page (`sheet_dataset`):
# it carries no per-country table but links bit.ly/TheFacialRecognitionWorldMap
# -> the Google Sheet below (docs.google.com robots Allow: /spreadsheet covers
