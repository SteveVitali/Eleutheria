# allow-listed (32 verified tenants fetched real matter indexes; `lacity` +
# `chicago` answer a recorded `tenant_api_error` envelope — not provisioned,
# recorded not fabricated). CivicClerk tenants answer robots.txt 404 →
# `no_policy_4xx` under ADR-087 (RFC 9309 §2.3.1.4) and serve real `/v1/Events`
# indexes (34 verified; `oklahomacityok` answers its index 404 → recorded
# `link_rotted`). PrimeGov's 9 verified tenants all answer robots.txt
# `Disallow:/` — under GL-GATE-08 / ADR-088 the verdict is probed + recorded
# and the fetch proceeds marked `robots_disregarded` (D-SOURCES.2-4 resolved
# by the operator's robots-disregard disposition; pre-P26.17 runs recorded
