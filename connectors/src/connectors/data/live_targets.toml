# ---------------------------------------------------------------------------
# P31.12 / BREADTH.1 — the four P29.3 accountability-breadth sources (targeted
# oversight-report lookups through the `accountability` connector). Each target
# names ONE reviewed published document — a report landing page or the report
# PDF itself, never an index, listing, or search surface (SIG-INGEST-036/037).
# The reviewed fields ride the row (SIG-INGEST-038 — data, not code):
#   external_id       the report's own identifier (GAO/OIG product number or
#                     the publication slug)
#   title / literals  the report title and verbatim strings the captured text
#                     must still carry — a missing literal is ContentDrift,
#                     fail closed, never a claim beyond the capture (§3.1)
#   epistemic_status / event_type / event_date / organizations / technologies
#                     the reviewed §11.17 event fields the one-per-report
#                     AccountabilityEvent carries (an oversight finding is
#                     never a deployment, device count, or operational state)
#   source_class      the OL-2E-AL-03 evidence class (the oversight body's own
#                     published report is the `primary_record`, SIG-ONTO-039)
#   review_note       the review provenance + the recorded access posture
# ---------------------------------------------------------------------------

# GAO — GAO-21-518 "Facial Recognition Technology: Federal Law Enforcement
# Agencies Should Better Assess Privacy and Other Risks" (published 2021-06-03).
