# SPDX-License-Identifier: Apache-2.0
# The committed open-data-portals inventory (P37.69a / R11-ACQ-23a —
# `sig.open-data-portals-targets/1`). Every row is reviewed data: the API
# base is derived ONLY from the committed candidate record's URL (a portal's
# standard CKAN mount is recorded in the seat notes), the declared query or
# dataset id is the seat's own literal, and the bound (`rows`/`limit`) is the
# reviewed page size. A row never invents an endpoint; the `[[enumerated]]`
# table records seats whose concrete endpoint is evidenced but NOT yet
# committed (D-P37.69a-1).
#
# KINDS:
#   package_search — ONE bounded `package_search?q=<query>&rows=<rows>` page;
#                    emits open_data_index + per-package dataset records.
#   package_show   — ONE `package_show?id=<dataset_id>` record; emits the
#                    dataset record + resource pointers (never fetched, P8-2).
#   ods_records    — ONE ODS v2 `…/datasets/<id>/records?limit=<n>` page;
#                    emits traffic_camera rows via the shared emit.
#   hub_search     — ONE reviewed POST to the data.europa.eu hub search API.

schema = "sig.open-data-portals-targets/1"
