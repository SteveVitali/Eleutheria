candidate_url = "https://data.gov.au/data/dataset/emergency-services-closed-circuit-television-camera-cctv-cov"
status = "endpoint_preflight_deferred"
notes = "ACQ-23a I5-C331. The committed record's dataset slug truncates mid-token (`…-cctv-cov`); the full `package_show` id needs a reviewed one-request preflight or the operator's flip-window census. The seat stays registered and gated; it wires the moment its literal lands."
