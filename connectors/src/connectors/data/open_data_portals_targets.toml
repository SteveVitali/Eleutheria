# missing URL preflights; a row here gains a [[targets]] row only after the
# reviewed endpoint lands in the committed record.

[[enumerated]]
id = "p37_69a_enum_geelong_ods"
source_id = "camreg_au_vic_geelong_closed_circuit"
candidate_url = "https://data.gov.au/data/dataset/closed-circuit-television-cctv-location"
status = "endpoint_preflight_deferred"
notes = "ACQ-23a I5-C327. The seat wires on the CKAN package record; the label's `opendatasoft_dataset` lane (a Geelong-hosted ODS records endpoint) is evidenced only by the package's resource list — the concrete dataset id lands under the same preflight review as the other uncommitted URLs."

