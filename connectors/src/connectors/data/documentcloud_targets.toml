# The `documentcloud` connector's committed seed inventory (P36.77 /
# R11-ACQ-32). This table is DATA, not code (SIG-ENG-001): the seed rows are
# the released-ALPR-materials surface the I6/I7 discovery named — reviewed
# on their own, never discovery output. Identifiers + provenance only: a row
# is a URL, a kind, a source and an evidence ref, never content.
#
# Every row is a PUBLIC UNAUTHENTICATED surface (ADR-184/187's terms-
# conflicted envelope): https, the committed host for its platform, the kind's
# reviewed public path — no credentials, no private endpoints, no query
# strings. The MuckRock ToS (muckrock.com/tos) governs DocumentCloud and is
# affirmatively restrictive ("data mining, robots, or similar data gathering
# and extraction tools" are outside the access licence) — leg A is bounded
# screen GETs only under GATE-G5's OM-20 naming (2026-10-25T18:40Z, expires
# GATE-G6); leg B (the first real wire as a connector run) is the operator's
# act under OP-26. All rows stay behind `ingestion_permitted=false` — the
# gate REFUSES until the operator's HG-03 line.

schema = "sig.documentcloud-targets/1"

[inventory]
# Derivation provenance: the I6/I7 released-materials decision is
# decision_catalog.csv row I7-C2 (DocumentCloud/MuckRock, "existing refused
# channel" posture) — the ticket labels this family "I7-C13"; no such catalog
# record exists (recorded deviation; the seed set below cites the verbatim
# candidate evidence ids).
source_ref = "I7-C2 (decision_catalog.csv; ticket label 'I7-C13' names no record — recorded deviation)"
evidence_ref = "docs/build/planning/2026-09-30-next-phase/research/I7-candidates.md + data/candidates_consolidated.csv + decision_catalog.csv (I7-U645/U669/U681, I6-C031); docs/tickets/DEFERRALS.md D-SOURCES.2-2/D-P21.3-2; docs/build/reports/rights/{documentcloud,muckrock}.md"
captured_on = "2026-10-27"
selection_rule = "the committed released-ALPR-materials surface the I6/I7 discovery named: DocumentCloud released-document API records + uploader pages + project indexes, the MuckRock public /foi/ request page, and the governing terms page — public unauthenticated pages only, one bounded GET each; GAO-26-108118's DocumentCloud copy and the named MuckRock project slugs are NOT seeded (their public URLs were never recorded — no invented targets)"
target_count = 11
opted_out_targets = []

