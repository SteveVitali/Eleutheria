# SPDX-License-Identifier: Apache-2.0
# The seeded source registry (docs/2_canonical_design_spec.md §22.6, SIG-INGEST-038).
# This table is DATA, not code (SIG-ENG-001): every source SIG may ingest from is
# a row here, seeded from the verified access matrix (§22.2), OL-21, and the
# sources research added (§22.3). Seeding a new source is a data row reviewed on
# its own — never a schema or code change.
#
# Invariants (enforced by connectors.registry + tests):
#   * ingestion_permitted defaults to false — a hard runtime gate, SIG-INGEST-028.
#     Every seed row is false: Phase 0 seeds the registry; connectors are Phase 4+.
#   * rights.redistributable is SEPARATELY REVIEWED and never derived from the SPDX
#     string (SIG-INGEST-024 / SIG-LIC-003). A row with no [rights] block is
#     UNDETERMINED + redistributable=false and fails the export gate CLOSED
#     (SIG-LIC-004): the fail-closed default for a source whose rights the lead
#     research pass did not resolve. A [rights] block is added only where the spec
#     resolves the licence, and always states redistributable explicitly.
#   * compact_status is the closed SIG-INGEST-027 vocabulary; no_response is a real
#     recorded state.
#   * default_tier is source reliability R1..R6 (§10.4), assigned per source.
#
# Fields per row map to §10.3.1 Source + the SIG-INGEST-023 minimum-field list.

