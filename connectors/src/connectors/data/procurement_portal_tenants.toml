# --- city Socrata contract/award datasets (platform = socrata) -----------------
# One tenant per city dataset: `host` + `dataset` name the SoQL /resource rows
# API endpoint (API-mode allow-listed hosts); the reviewed field aliases map
# the dataset's own column names onto the procurement_notice surface — title
# fields are scanned verbatim, and `where_terms` is the server-side recall
# filter (the verbatim vocab scan still decides every emitted claim).
# `id_fields` = stable external-id candidates; `title_fields`/`desc_fields` =
# the verbatim text scanned; `date_field` = bounded-window order; `limit` =
# the per-tenant window cap.

