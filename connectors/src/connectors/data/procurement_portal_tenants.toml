# The procurement-portal tenant registry (P26.10 / SOURCES.9) — a PUBLISHED
# artifact this ticket OWNS, the procurement analogue of agenda_tenants.toml
# (§22.3). Vendor procurement platforms are multi-tenant exactly like the agenda
# platforms: BidNet Direct (mdf commerce / Periscope S2G) hosts hundreds of
# agency storefronts as PATHS under one host, Bonfire serves per-tenant
# *.bonfirehub.com portals, OpenGov Procurement serves /portal/<agency> tenants
# behind one host, and city open-data portals publish Socrata contract/award
# datasets. No municipality->portal directory exists upstream; this is it.
#
# This is DATA, not code (SIG-ENG-001): `connectors.procurement.portal_tenants()`
# loads it and `portal_targets()` expands each row into that tenant's bounded
# index targets (the connector reads its targets from this registry, never a
# hardcoded list). Changes are versioned migrations (§20): bump
# `registry_version`, never silently rewrite a row.
#
# `enum_source` is REQUIRED on every row — the enumeration provenance (which
# index page / certificate-transparency set / catalog query surfaced the
# tenant). `verified` records whether the tenant's surface was probed live
# against the shared politeness UA; unverified rows say so (§3.1).
#
# `platform` is a coarse family label (bidnet | bonfire | opengov | socrata);
# `source_id` binds the tenant to its registry source row (data/sources.toml) —
# the row the loader gate + live runner read. A gated source keeps its tenant
# rows so a future rights decision needs no registry edit; the live gate refuses
# before any target is read.
#
# [[platform_census]] rows are registry DATA, never targets — portal_targets()
# reads only [tenants.*]. Each row is a host the enumeration FOUND and EXCLUDED:
#   robots_disallow_all — the host's robots.txt is `User-agent: *` /
#                          `Disallow: /` (the refusal stands, never bypassed);
#   waf_challenged      — the host answers programmatic requests with a WAF/JS
#                          challenge (HTTP 403 cf-mitigated) — a recorded
#                          outcome, never defeated (SIG-INGEST-013);
#   unreachable         — the enumerated name did not answer (NXDOMAIN/timeout);
#   non_jurisdiction_host — a vendor infra/marketing hostname, not an agency
#                          tenant;
#   gated_rights        — enumerated and rights-gated (a named DEFERRALS
#                          blocker), the row documents the surface.
#
# TOML ORDERING: scalars first, then [tenants.*] tables, then
# [[platform_census]] arrays.

# 2026.09.18 (P26.10 / SOURCES.9): initial registry. Live probes 2026-09-18 with
# the shared `procurement/1.0.0 (+https://sig-project.org/data-collection)` UA:
#   * bidnet — agency storefronts enumerated off each purchasing group's public
#     `/participating-buyers` page (server-rendered tenant list); each
#     storefront serves its own open/closed/awarded solicitation indexes and
#     public detail pages (no login wall for notice text; `?keywords=` is the
#     portal's own bounded search field). www.bidnetdirect.com robots.txt:
#     `User-agent: *` allows with `Crawl-delay: 5`; private/auth/dev paths are
#     disallowed and the storefront URLs below never touch them.
#   * socrata — contract/award datasets enumerated via the documented catalog
#     discovery API (api.us.socrata.com/api/catalog/v1) per city host; licence
#     metadata read off `/api/views/<id>` per dataset. Four datasets carry a
#     public-domain-class licence; Chicago's carries NO licence metadata → the
#     source stays rights-gated (D-SOURCES.9-1), the tenant row documents it.
#   * bonfire — both verified *.bonfirehub.com tenants answer robots.txt
#     `User-agent: *` / `Disallow: /` (platform-wide): every fetch is a recorded
#     robots refusal while the wall stands (D-SOURCES.9-2).
#   * opengov — procurement.opengov.com answers every `/portal/<agency>` path
#     (and robots.txt itself, an HTML 200 SPA shell) behind a Cloudflare managed
#     challenge (`cf-mitigated: challenge`, HTTP 403) → recorded disappearances
#     while the posture holds (D-SOURCES.9-3).
registry_version = "2026.09.18-p26.10"

# --- tenants: jurisdiction -> portal platform + per-tenant surface ------------
# Each row carries the jurisdiction (a candidate identifier — SIG-INGEST-034),
# the platform family, the source registry row the gate reads, and the
# platform-specific facts the target expansion needs (all reviewed data).

