# --- P35.11 / R11-ACQ-07: the ADR-185 S8 tribal screened lane ------------------
# Facts + citations only (B-37 "TR facts+cite"). The allowlists carry ONLY the
# screened fact/citation predicates the reviewed field maps use plus the
# mechanical disclosure_field_state — no person-name, registrant, row-level or
# device predicate is admitted by construction. `jurisdiction` anchors any
# name-only partner mint to the US-TRIBAL key space (none is configured).

