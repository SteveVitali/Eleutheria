# The `puerto_rico` connector's committed target inventory (P37.51 /
# R11-ACQ-24, I8 §6.2). This table is DATA, not code (SIG-ENG-001 /
# SIG-INGEST-038): the reviewed Puerto Rico territorial surfaces the I5
# discovery named — identifiers + provenance only, a row is a URL, a kind, a
# source and an evidence ref, never content. Every row is a public
# unauthenticated GET surface on a committed host; all eight sources stay
# behind `ingestion_permitted=false` — the loader gate REFUSES every live
# fetch until the operator's OP-26 Wave-D flips under ING-GO-D (HG-03 RB-08
# `a` territorial public records; the OCPR row additionally S7 `a`).
#
# The OCPR search form is a POST + __RequestVerificationToken form and is
# NEVER submitted (the I5 R3 bound); the committed surface is the landing
# page's fiscal-year bulk index + its #tblContracts results table shape.

schema = "sig.puerto-rico-targets/1"

[inventory]
# Derivation provenance: the eight ACQ-24 plan rows
# (data/acquisition_plan.csv AP-T2-021/-092/-137/-138/-139/-140/-141/-142,
# candidates I5-C226 / I5-C227 / I5-C228…C233), rights batch RB-08
# (territorial public records — I7-RB-08 `a`, GL-GATE-07 treats territories
# as US) with AP-T2-021 additionally S7-flagged (IND-P8).
source_ref = "docs/build/planning/2026-09-30-next-phase/data/acquisition_plan.csv (AP-T2-021/-092/-137/-138/-139/-140/-141/-142) + data/candidates_consolidated.csv (I5-C226…I5-C233)"
captured_on = "2026-11-13"
target_count = 11

# --- OCPR Consulta del Registro de Contratos (ocpr_registry_index) ---------

# procportal_pr_consulta_del_registro — the landing page (I5-C226): the
# "Contratos Otorgados por Año Fiscal" bulk-download index enumerates as
# document pointers (the FY file contents are never fetched by this
# connector — pointer lane); a populated #tblContracts results table, when
# served, parses to contract records on the registry's own column literals
# under the S7 contractor screen. Verified live-read 2026-11-13: the page
# serves (200), the FY index lists 2010-2011…2023-2024 with the recorded
# "Última actualización 20 dic. 2023" stamp, the search form is POST +
# __RequestVerificationToken (never submitted — R3) and the Results table
# ships empty server-side; the 2023-2024 FY link resolves to a recorded 404
# (the registry's bulk lane is stale — an honest live outcome, never a
# guessed URL).
[[inventory.targets]]
id = "ocpr_consulta_index"
source = "procportal_pr_consulta_del_registro"
kind = "ocpr_index"
adapter = "ocpr_registry_index"
url = "https://consultacontratos.ocpr.gov.pr/"
license_spdx = "LicenseRef-PublicRecord-FactualCompilation"
publisher = "Oficina de la Contralora de Puerto Rico (OCPR)"
expect = ["tblContracts", "downloadfrequentsearchfiscalyeardocument"]
evidence = "I5-C226 (candidates_consolidated.csv) — contract registry of all PR government entities; FY bulk links + the served column literals (Núm. Contrato/Contratista/Otorgado en/Vigencia/Cuantía por Pagar/Tipo de Servicio/Entidad/Cancelado/Documento); 200 GET verified 2026-11-13; FY download 404 recorded; robots=not-read"

