#
# The versioned `dot_511` connector vocabulary (P26.7 / SOURCES.7) — state DOT /
# 511 traffic-camera *location registries* (ArcGIS feature layers + per-state
# 511 JSON APIs). This table is DATA, not code (SIG-ENG-001): the predicate
# allowlist, the per-state field aliases, and the media-field blocklist are data
# rows reviewed on their own. Changes after P26.7 are VERSIONED MIGRATIONS (§20),
# not edits — bump `vocab_version` and add the change, never silently rewrite a
# row (SIG-INGEST-017).
#
# NOTE ON TOML ORDERING: every top-level key MUST appear ABOVE the first [table]
# header — otherwise TOML nests it under that table.

# The connector's own vocabulary version, stamped onto every run (§20).
# 2026.09.19.1 (P26.16 / SOURCES.15 live pass): added `ObjectID`/`object_id`
# id aliases (Chattanooga second layer, PG County Socrata) and `location_1`
# point-object alias (Socrata re-joined point columns); `extract_coordinate`
# now walks every matching lat/lon alias pair and falls back to the
# operator-published point geometry when aliased attributes are unusable
# (DMS text, projected values, swapped columns — recorded coordinate_source).
# Additive only.
# 2026.09.18.3 (P26.16 / SOURCES.15): GL-GATE-07 batch — added
# the observed id-field aliases (OID/FID2/OBJECTID_12/F__OBJECTID/
# CEVI_OID/ObjectId2/REC_ID/GLOBAL_ID) and media-blocklist names for
# device IPs/MACs/serials, stream URIs, and officer/editor name
# fields observed on batch layers (recorded excluded, never emitted).
# Additive only.
# 2026.09.18.2 (P26.13 / SOURCES.12): added the catalog-sweep registry aliases
# — UK council CCTV schemas (CAMERA_ID/CCTV_NUMBER/CCTV_NO/SITE_ID ids,
# CAMERA_LOCATION/ADDRESS_2 names, WARD/DIVISION/LOCAL_AUTH districts,
# title-case Lat/Long), the Peel red-light schema (CAMERA_NUM/OBJECTID_1/
# Street/StrInt*/MUN), the DC MPD CCTV schema (ADDRESS/WARD/PSA/STATUS), the
# Gold Coast SCN schema (NAME only — geometry carries position), and the
# Spanish Puerto Gaitán schema (latitud/longitud + `georeferencia` point
# object, nombre/sector). Projected coordinate fields (EASTING/NORTHING,
# POINT_X/POINT_Y) are deliberately NOT aliased — the ArcGIS outSR=4326
# geometry is the coordinate source for those layers. Additive only.
# 2026.09.18 (P26.9 / SOURCES.8): added the municipal/transit/international
# field aliases (Socrata + non-US ArcGIS schemas), the `point_fields` GeoJSON
# point-object candidates, and the extra media-bearing field names
# (iframe/photo/media/weathercam/still) — additive only.
vocab_version = "2026.09.19.1"

# The predicate allowlist enforced as a hard schema gate (SIG-INGEST-033): the
# `dot_511` connector may write ONLY the camera-registry surface — a
# registry-keyed traffic-camera infrastructure row carrying identity, location,
# roadway, jurisdiction, and operator predicates. `traffic_camera` is the entity
# assertion itself; the rest are its predicates. Anything else — a feed/image
# predicate, a person predicate, a deployment inference — is a schema error
# refused at the ingestion boundary (§10.5 D6).
predicate_allowlist = [
  "traffic_camera",
  "camera_external_ref",
  "camera_name",
  "camera_roadway",
  "camera_direction",
  "camera_jurisdiction",
  "camera_county",
  "camera_operator",
  "camera_status",
  "camera_latitude",
  "camera_longitude",
  "camera_coordinate_source",
  "external_id",
]

# Predicate GENRES this connector MUST NOT write (scope-creep guard): the
# registry is a LOCATION substrate — it asserts a camera exists at a published
# coordinate on a roadway. Feed content (image/video/stream URLs), person data,
# and deployment/audit inferences are refused by construction.
forbidden_predicate_genres = [
  "camera_image",
  "camera_video",
  "camera_stream",
  "feed_url",
  "snapshot",
  "plate_read",
  "person",
  "deployment_exists",
  "camera_count",
]

# The sensitivity class applied to every emitted camera coordinate before the
# claim lands (§43.3, SIG-PUB-004): C1 = "publicly visible hardware on public
# right-of-way" — pole-mounted DOT cameras, and the operator itself published
# the coordinate (C2's operator_published_upgrade converges to the same tier-0
# full precision). A target row may pin a stricter class; the connector applies
# `policy.sensitivity.apply_tier(geo_tier_for(class))` to every coordinate and
# emits NOTHING at tier 3 (jurisdiction only).
default_sensitivity_class = "C1"

# --- field aliases -----------------------------------------------------------
# Per-state ArcGIS/511 layers name the same fact differently (verified against
# the live layer schemas, 2026-09-17 — see dot_511_targets.toml observed_fields).
# Every alias list is ordered: the first present non-empty value wins, and the
# matched field name is recorded on the claim for provenance.

# Camera identity / stable reference. ArcGIS OBJECTID is the per-layer stable
# key; feeds may carry a camera id under any of these names.
id_fields = [
  "CAMERAID", "cameraId", "attributes_cameraId", "CAM_ID__", "camera_id",
  "device_id", "AssetID", "Equipment_Name", "Site__", "id", "Id", "ID",
  "rowid", "OBJECTID", "FID", "GlobalID", "GLOBALID", "ObjectId",
  # P26.9: municipal/transit/international registries (Socrata + non-US ArcGIS).
  "camid", "camera_number", "cam_number", "site_id", "assetid", "facilityid",
  "intersectionid", "location_id", "ESRI_OID", "esri_oid", "oid",
  "objectid", "globalid", "inventory_item_id", "camera_location_code",
  "location_code",
  # P26.13: catalog-sweep registries — UK council CCTV id columns, the Peel
  # red-light intersection id, the second OBJECTID on re-joined layers.
  "CAMERA_ID", "CAMERA_NUM", "CameraNum", "CCTV_NUMBER", "CCTV_NO",
  "OBJECTID_1", "SITE_ID", "FID_",
  # The Socrata `:id` pseudo-column — the stable per-row system id, LAST so any
  # publisher-provided id wins over it (e.g. Chicago red-light rows have no
  # publisher id column; the `:id` row ref is the registry key then).
  # P26.16: observed id fields on the GL-GATE-07 batch layers.
  "OID", "FID2", "OBJECTID_12", "F__OBJECTID", "CEVI_OID", "ObjectId2", "REC_ID", "GLOBAL_ID",
  # P26.16 live pass: mixed-case OBJECTID variant (Chattanooga second layer)
  # and Socrata snake_case (Prince George's County).
  "ObjectID", "object_id",
  ":id",
]

# Explicit latitude fields (checked BEFORE geometry — a published attribute is
# a stronger provenance claim than the derived geometry).
lat_fields = [
  "latitude", "Latitude", "LATITUDE", "attributes_latitude", "geometry_y", "y",
  # P26.9: Seattle ATSC cam/loc pairs, QLDC numbered coords.
  "Cam_Lat", "cam_lat", "Loc_Lat", "loc_lat", "latitude2", "lat",
  # P26.13: catalog-sweep registries — Nottingham title-case Lat, the Spanish
  # Puerto Gaitán schema. (Projected EASTING/NORTHING and POINT_X/POINT_Y are
  # deliberately absent — outSR=4326 geometry is their coordinate source.)
  "Lat", "latitud",
]
lon_fields = [
  "longitude", "Longitude", "LONGITUDE", "attributes_longitude", "geometry_x", "x",
  "Cam_Long", "cam_long", "Loc_Long", "loc_long", "longitude2", "lon",
  # P26.13: Nottingham title-case Long, the Spanish Puerto Gaitán schema.
  "Long", "longitud",
]

# P26.9: Socrata point-object fields — the GeoJSON-ish dict-valued columns a
# Socrata/CKAN row carries instead of (or beside) flat lat/lon attributes
# (`the_geom`, `location`, `geolocation`, …). Ordered: the first present dict
# value with GeoJSON Point coordinates or a lat/lon pair wins. A STRING value
# under one of these names (NOLA's text-address `location`) is not geometry —
# it is ignored here and remains available to the text aliases.
point_fields = [
  "the_geom", "point", "geolocation", "geometry_point", "geo_location",
  "geom", "location", "shape",
  # P26.13: Puerto Gaitán (datos.gov.co) publishes its point under the Spanish
  # `georeferencia` GeoJSON column.
  "georeferencia",
  # P26.16 live pass: Socrata re-joined point columns surface as `location_1`
  # (Prince George's County) beside the text `location` column.
  "location_1",
]

# Roadway / route the camera watches.
roadway_fields = [
  "highway", "Route", "roadway", "RoadwayName", "PrimaryRoad", "RouteID",
  "attributes_route", "Roadway", "ROADWAY", "linear_reference", "route",
  # P26.9: municipal registries.
  "roadwayname", "primary_st", "road", "street", "route_name",
  # P26.13: catalog-sweep registries — Peel red-light arms, title-case Street.
  "Street", "StrInt1", "StrInt2",
]

# Jurisdiction detail below the state (county/district/region as published).
county_fields = [
  "county", "County", "COUNTY", "district", "District", "District_Name",
  "CamRegion", "REGION", "Jurisdiction", "Organization", "ORG",
  # P26.9: municipal/non-US registries.
  "municipality", "suburb", "area", "region", "district_name", "zone",
  "neighborhood", "group_",
  # P26.13: catalog-sweep registries — DC ward/police-service-area, Glasgow
  # division/town/local-authority, Peel municipality, North Ayrshire camera
  # area, Nottingham district code/name, the Spanish `sector`.
  "WARD", "WARDNAME", "PSA", "DIVISION", "TOWN", "LOCAL_AUTH", "MUN",
  "CAMERA_AREA", "District_Code", "District_Name", "sector",
]

# Human-readable camera name / description.
name_fields = [
  "name", "Name", "CameraTitle", "attributes_title", "DESCRIPTION",
  "description", "Description", "CameraLocation", "LOCATION", "location",
  "Location", "Desc_", "STREETJUNCTIONID",
  # P26.9: municipal/transit/international registries. Non-scalar values (a
  # GeoJSON dict under `location`, e.g. Winnipeg) are skipped by the alias
  # lookup and remain available to `point_fields` instead.
  "location_name", "intersection", "camera_location", "cameralocation",
  "location_desc", "location_desc_en", "locationdescription",
  "intersectionname", "cam_name", "site", "approach", "cross_street",
  "commonname", "camera", "camera_description", "location_description",
  "camloc", "cam_location", "address", "school_name", "junction_blacksite",
  # P26.13: catalog-sweep registries — title/upper-case address columns (DC
  # MPD, Rochester, York), Lambeth's CAMERA_LOCATION, the Spanish `nombre`.
  "ADDRESS", "Address", "ADDRESS_2", "CAMERA_LOCATION", "nombre",
]

# Reported camera/device status.
status_fields = [
  "status", "Status", "CurrentStatus", "OPERATION_STATUS", "Live",
  # P26.9: municipal/transit/international registries.
  "comm_status", "camera_status", "lifecyclestatus", "isonline", "offline",
  "undermaintenance", "available", "condition", "operational", "active",
  # P26.13: DC MPD + Glasgow upper-case STATUS.
  "STATUS",
]

# Compass direction the camera faces / roadway direction.
direction_fields = [
  "direction", "Direction", "CompassDirection", "DIRECTION",
  # P26.9: municipal/transit/international registries.
  "camera_facing", "travel_direction", "cam_direction", "facing", "bearing",
  "view_direction", "dir",
]

# --- the media blocklist ------------------------------------------------------
# Field names that carry (or point at) feed CONTENT — snapshot/image/video/HLS
# URLs, file paths, stream references. The connector NEVER follows these, NEVER
# emits their values, and records only their NAMES on the entity row's
# `excluded_fields` so a reviewer can see the feed fields were present and
# deliberately dropped (P26.7 out-of-scope: "we ingest the camera *registry*,
# never the feed content — Part VIII"). Matching is case-insensitive and also
# catches `*url*`/`*image*`/`*video*`/`*snapshot*`/`hls*` field-name patterns.
media_field_names = [
  "snapshot", "SnapShot", "ImageURL", "ImageName", "ImgPath", "VideoUrl",
  "VideoURL", "videoId", "attributes_videoId", "hlsurl", "CCTVPublicURL",
  "attributes_filename", "attributes_publishedImageId", "ImageFileLoc",
  "ThumbFileLoc", "URL1", "URL2", "Url", "url", "STREAM_ERROR",
  # P26.9: municipal/transit/international registries — embed/iframe widgets,
  # still-capture URLs, photo attachments, per-row link-out fields.
  "iframe", "media", "photo", "photoreference", "weathercam", "link",
  "still_url", "location_assessment", "img", "thumbnail", "videolink",
  "image_file", "stream_url", "cam_url",
  # P26.16: device network fields + officer/editor person names on
  # batch layers — recorded on excluded_fields, never emitted.
  "ip_address", "ipaddress", "camera_ip_address_2", "cameraipaddress", "controlip", "switchip", "multisnsrip", "ptz_ip", "mac_address", "macaddress", "serialnumber", "serialnumberhousing", "serial_no", "encoderpath", "rtsp", "rtsp_uri", "rtmpt", "firmwareversion", "officer", "creator", "editor", "addedby", "modifiedby", "created_user", "last_edited_user", "enteredby", "lastmodifiedby", "lasteditor",
]
media_field_patterns = [
  "url", "image", "video", "snapshot", "screenshot", "hls", "stream", "thumb",
  "imgpath", "fileloc", "iframe",
]
