#
# The declared jurisdiction extents the P35.16 (R11-DATA-01 / F-322) geometry
# detectors evaluate a camera-registry point against — one
# `[[extents]]` row per `(scheme, code)` pair the merged target registry uses.
#
# These rows are SIG-DECLARED DETECTOR BOUNDS, not evidence: they answer "does
# the published point contradict the jurisdiction the registry row claims?" —
# the question F-322 recorded wrong for seven target groups. A point outside
# its declared extent is FLAGGED (`geometry_defect` claim / recorded finding),
# never silently corrected and never silently dropped. A target may override
# with its own `extent` field where the generic jurisdiction bound is not
# trustworthy (the ticket's explicit escape — city-tier and unresolved-
# jurisdiction targets).
#
# Shape: `extent = [min_lon, min_lat, max_lon, max_lat]` — lon-lat corner order,
# WGS84, matching the declared `axis_order = "lon-lat"` default. Bounds carry a
# small practical margin over the strict administrative border so a camera
# sited just across a boundary line is not flagged on a rounding artefact; the
# detector's job is catching continent/ocean-scale defects, not surveying the
# border.
#
# `sig.unresolved` targets carry no row by design — an unresolved jurisdiction
# has no declared bound to check against (the target's own `extent` or a later
# jurisdiction resolution supplies one; absence is a recorded skip, never a
# silent pass).

