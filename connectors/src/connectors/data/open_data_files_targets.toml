# The committed open-data-file inventory (P37.69a / R11-ACQ-23a —
# `sig.open-data-files-targets/1`). Every row is reviewed data: the URL is the
# committed record's literal file URL, `declared_fields` is the reviewed
# column contract (a renamed or dropped column is ContentDrift — never a
# guessed position), `expected_markers` the reviewed literals the served
# content must carry, and `max_rows` the declared bound. The `[[enumerated]]`
# table records seats whose concrete file URL is NOT yet committed —
# registry rows, never targets (D-P37.69a-1).
