ted_eu = "ted_eu"

# --- USAspending: sub-awards, not only prime awards (§23.6, SIG-ONTO-033) ------
# USAspending exposes prime awards AND sub-awards. Sub-awards are the traceable
# link from a federal grant program (Byrne JAG, UASI) to the LOCAL purchase that
# appears in no local procurement record. The connector MUST pull sub-awards
# (`subaward_type = "sub-grant"`/`"sub-contract"`), not only prime awards.
[usaspending]
api_base           = "https://api.usaspending.gov/api/v2"
subawards_endpoint = "/subawards/"                  # POST spending_by_award w/ subaward=true
prime_endpoint     = "/search/spending_by_award/"
# The award-id field on a sub-award that is the traceable federal_award_id link.
federal_award_id_field = "prime_award_generated_internal_id"
subaward_id_field      = "internal_id"
# Sub-awards MUST be pulled: this is the flag the connector asserts on every
# USAspending target (assert_pulls_subawards).
subaward = true

# --- Agenda-platform index endpoints (P26.2 / SOURCES.2) ----------------------
# Each agenda-platform tenant row names the per-tenant api_base; the platform's
# INDEX endpoint (the public meetings/matters listing the portal itself reads)
# is appended here — a bounded fetch (top/N or a reviewed POST body), never a
# crawl. Probed live 2026-09-16: webapi.legistar.com/v1/<client>/matters returns
# the client's public matter index; lacity.primegov.com PublicPortal /search
# returns the meeting index; {tenant}.api.civicclerk.com/v1/Events is the
# portal's own endpoint (the tenant key comes from the portal's embedded
# config — anonymous requests currently 404, recorded honestly, never faked).
[platform_endpoints.legistar]
# InSite API: the tenant matter index is `{api_base}/matters` (OData; $top bounds
# the pull, $orderby keeps the freshest records first). The bare api_base 404s.
index_path  = "/matters"
index_query = "$top=100&$orderby=MatterLastModifiedUtc%20desc"
# The human-readable legislation detail page for a matter (link, not bytes).
matter_link_template = "https://{tenant}.legistar.com/LegislationDetail.aspx?ID={matter_id}&GUID={matter_guid}"
# A matter becomes a Contract claim ONLY when its MatterTypeName matches one of
# these reviewed type-name substrings (case-insensitive). A municipality's
# contract-approval instruments carry contract-family type names (Mesa:
# 'Contract', 'Agreement'; San Antonio: 'Contract', 'Agreement', 'Purchase',
# 'Lease', 'Interlocal', 'Settlement', 'Professional Services'). An ordinance /
# resolution / appointment is legislative business, not a contract — it lands as
# an agenda_index row only, never a Contract (§3.1 — no synthetic certainty).
contract_matter_patterns = [
  "contract",
  "agreement",
  "purchase",
  "lease",
  "interlocal",
  "professional services",
  "settlement",
]
# P26.6 — the matter DOCUMENT endpoint + bounded window. `{api_base}/matters/
# {MatterId}` is the documented InSite matter detail (probed 2026-09-17:
# webapi.legistar.com/v1/seattle/matters/11400 → the matter JSON, API-mode
# allow-listed). A 200 JSON object missing every `doc_required_fields` key — or
# a non-JSON body — is genre drift (ContentDrift), not a document.
doc_url_template    = "{api_base}/matters/{item_id}"
doc_id_keys         = ["MatterId"]
doc_genre           = "json"
doc_required_fields = ["MatterId"]
# The reviewed window: at most 20 most-relevant matters per tenant per run
# (vocab-/contract-matching index items first, then index order = recency),
# and at most 350 document fetches per platform run so the monthly job stays
# inside its task window. Both bounds ride each generated target row as data.
doc_per_tenant = 20
doc_run_cap    = 350
# Canonical selection order — most-recent first by the item's own date fields
# (item DATA, never the server's return order), id as the deterministic
# tie-break. A re-run over the same index item set selects the same window.
doc_order_fields = ["MatterLastModifiedUtc", "MatterIntroDate"]

[platform_endpoints.primegov]
# PrimeGov PublicPortal: POST {api_base}/search returns the tenant meeting index
# (probed 2026-09-16 — LA City; a bounded body bounds the window).
index_path = "/search"
index_method = "post"
index_body = {}
# Meeting objects carry no contract-typing — index rows only.
# P26.6: the meeting's own `itemsSearchResultsDefaultLinkOnMeetingPortal` field
# names the human portal document — the document URL comes from the captured
# payload, never constructed. doc_genre "any" sniffs PDF/JSON/HTML from the
# captured bytes. NOTE: every PrimeGov host's robots.txt answers `Disallow: /`
# (platform-wide, P26.5 probe 2026-09-17) — these document targets resolve only
# if an index capture exists, and each fetch is a recorded robots refusal while
# the wall stands. The bound is reviewed anyway so the row is complete data.
doc_link_keys  = ["itemsSearchResultsDefaultLinkOnMeetingPortal"]
doc_genre      = "any"
doc_per_tenant = 20
doc_run_cap    = 100
doc_order_fields = ["meetingDate"]

[platform_endpoints.civicclerk]
# CivicClerk v1: {api_base} already names the Events index (the portal's own
# endpoint; api_base template is https://{tenant}.api.civicclerk.com/v1/Events).
# The endpoint speaks OData — $top bounds the pull (P26.3: verified 2026-09-17,
# the index is otherwise the tenant's full event list).
index_path  = ""
index_query = "$top=100"
# P26.6 — the meeting DOCUMENT endpoint (probed 2026-09-17):
# /v1/Meetings/{agendaId} answers the meeting JSON — `items[]` agenda objects
# (agendaObjectItemName/Description/HtmlContent) + `publishedFiles[]` (agenda
# PDF links) — for an event whose `agendaId` is non-zero. An event with no
# agenda (agendaId 0/absent) resolves no document. A non-JSON body is drift.
doc_url_template    = "https://{tenant}.api.civicclerk.com/v1/Meetings/{item_id}"
doc_id_keys         = ["agendaId"]
doc_genre           = "json"
doc_required_fields = ["id"]
doc_per_tenant      = 20
doc_run_cap         = 350
doc_order_fields    = ["startDateTime"]

[platform_endpoints.escribe]
# eScribe Meetings (P26.5): the tenant's public Meetings calendar page calls its
# own ASP.NET JSON webmethod — POST {api_base}/MeetingsCalendarView.aspx/
# GetCalendarMeetings answers {"d": [ …meeting records… ]} (verified live
# 2026-09-17 across the pub-* tenant surface; api_base template is
# https://pub-{tenant}.escribemeetings.com). The reviewed index_body bounds the
# calendar window — a dated slice, never a full-history crawl.
index_path   = "/MeetingsCalendarView.aspx/GetCalendarMeetings"
index_method = "post"
index_body   = { calendarStartDate = "2025-01-01T00:00:00", calendarEndDate = "2026-12-31T23:59:59" }
items_key    = "d"
# The human-readable meeting page (link, not bytes) — {tenant} is the pub-*
# slug, {matter_id} the meeting's ID guid. P26.6 probe (2026-09-17): the
# MeetingsCalendarView.aspx/Meeting path 404s; the classic Meeting.aspx page is
# the tenant's real public agenda/minutes document — corrected.
matter_link_template = "https://pub-{tenant}.escribemeetings.com/Meeting.aspx?Id={matter_id}&Agenda=Agenda&lang=English"
# P26.6 — the meeting DOCUMENT is that same server-rendered Meeting.aspx page
# (probed: 211 KB HTML agenda with item text, genre html). A non-HTML capture
# here is genre drift; a page with no text is an honest `empty` outcome.
doc_url_template = "{api_base}/Meeting.aspx?Id={item_id}&Agenda=Agenda&lang=English"
doc_id_keys      = ["ID", "Id"]
doc_genre        = "html"
doc_per_tenant   = 20
doc_run_cap      = 300
# GetCalendarMeetings returns the same meeting set in a DIFFERENT order per
# call (verified 2026-09-17 — 465/474 positions shuffled between two immediate
# fetches). Canonical order = the item's own StartDate (desc), ID tie-break —
# the bounded window is a function of the item SET, not server ordering.
doc_order_fields = ["StartDate"]

# --- Procurement-portal index endpoints (P26.10 / SOURCES.9) ------------------
# Each portal tenant row names its platform family + surface facts; the
# platform's INDEX shape is reviewed here — bounded targeted lookups (the
# portal's own search field / the documented SoQL rows API), never a crawl.
[platform_endpoints.bidnet]
# BidNet Direct agency storefronts: `{storefront}/solicitations/{kind}-bids`
# serves the tenant's server-rendered index (`mets-table-row` items; verified
# markup 2026-09-18 — `div.sol-num`, `a.solicitation-link`,
# `span.sol-publication-date`/`span.sol-closing-date` > `span.date-value`).
# `?keywords=<kw>` is the portal's OWN public search field — a bounded
# targeted lookup, never a crawl; the reviewed recall set below covers the
# agenda_content_vocab families (precision comes from the verbatim scan,
# never the keyword). Page-1 of each index is the reviewed window (25 items —
# deeper pages are out of scope for a sweep; `?page=` is robots-disallowed
# anyway). The storefront's open-bids index is additionally fetched
# unfiltered (the current window regardless of keywords).
index_kinds = ["open", "closed", "awarded"]
index_keywords = [
  "surveillance", "camera", "cctv", "license", "drone", "gunshot",
  "facial", "stingray", "unmanned", "predictive",
]
index_unfiltered_kinds = ["open"]
host = "www.bidnetdirect.com"
# Item markup facts (fail-closed): an index page that carries neither a
# `solicitation-link` item nor the `id="solicitationList"` container (the list
# region, present even on a zero-result page) is ContentDrift — the markup
# contract changed, never a silent empty.
items_marker = "solicitation-link"
empty_marker = "solicitationList"
# The detail DOCUMENT is the item's own public detail page — the captured
# `a.solicitation-link` href (never constructed): `<group>/<agency>/
# solicitations/<slug>/<id>?purchasingGroupId=<gid>&origin=2`. It serves the
# verbatim description text to anonymous viewers (verified 2026-09-18). A
# non-HTML body is genre drift; a page with no item text is `empty`.
doc_genre = "html"
doc_per_tenant = 12
doc_run_cap = 100
doc_order_fields = ["published", "closing"]
# index_kind -> procurement lifecycle state (§13.4): an open solicitation is
# rfp_issued; an awarded bid is awarded. A closed-not-awarded bid asserts no
# transition (closure alone is not a vocabulary state — §3.1).
[platform_endpoints.bidnet.notice_map]
open = "rfp_issued"
awarded = "awarded"

[platform_endpoints.socrata]
# City Socrata contract/award datasets: the documented SoQL rows API
# `https://{host}/resource/{dataset}.json` (API-mode allow-listed hosts). The
# per-tenant registry row carries the reviewed field aliases + window bound;
# the connector builds one bounded query per tenant — `$limit` rows ordered
# by the reviewed date field DESC (recent window, deterministic across
# re-runs) — and scans each record's reviewed text fields verbatim. A
# non-array payload is ContentDrift (Socrata error envelopes answer 200 JSON
# objects, not lists — fail closed).
index_path_template = "https://{host}/resource/{dataset}.json"
doc_per_tenant = 0
doc_run_cap = 0
# A dataset row is a published award/contract record — `contracted` is the
# lifecycle state the register itself asserts (an award the city recorded).
# Rows carrying their own notice-type field (e.g. NYC CROL's
# type_of_notice_description) map through the tenant's reviewed notice_map.
[platform_endpoints.socrata.notice_map]
default = "contracted"
solicitation = "rfp_issued"
award = "awarded"
award_notice = "awarded"
contract_award = "contracted"
contract_award_notice = "contracted"

# --- SAM.gov federal opportunities (P26.2 / SOURCES.2) -------------------------
# The documented public opportunities search (api.sam.gov, open.gsa.gov): a
# bounded keyword+window query, api_key from $SIG_SAM_GOV_KEY (HG-09, never in a
# file). A notice is a dated lifecycle event on the procurement track, NOT a
# contract — `notice_type` → lifecycle state is the reviewed data map below; an
# unlisted type emits index facts only (never a guessed lifecycle, §3.1).
[sam_gov]
api_base = "https://api.sam.gov/prod/opportunities/v2"
search_endpoint = "/search"
api_key_env = "SIG_SAM_GOV_KEY"
# The api.data.gov-gateway credential header (P26.4): the key rides the request
# header, never the URL — a keyed query would land in the recorded source_uri /
# run records (HG-09). Verified live 2026-09-17: X-Api-Key → 200, keyless → 404.
api_key_header = "X-Api-Key"

# Reviewed SAM notice type → procurement lifecycle state (§13.4) +
# acquisition_channel hint. `channel` is emitted only where the notice type ITSELF
# declares it (a Justification & Approval notice is a sole-source intent).
[sam_gov.notice_map]
Solicitation                        = { state = "rfp_issued" }
