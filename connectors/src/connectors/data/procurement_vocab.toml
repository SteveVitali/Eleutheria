# SPDX-License-Identifier: Apache-2.0
# The versioned `procurement` connector vocabulary (§23.6, §11.11, §11.12, P07.3).
# This table is DATA, not code (SIG-ENG-001): the Contract / FundingInstrument
# predicate surface, the acquisition-channel and funding-instrument vocabularies,
# the cooperative-vehicle source set, the agenda-platform set, and the USAspending
# sub-award facts are data rows reviewed on their own.
# Changes after P07.3 are VERSIONED MIGRATIONS (§20), not edits — bump
# `vocab_version` and add the change, never silently rewrite a row, so a
# re-extraction under a new vocabulary is a new interpretation, never a
# destructive overwrite (SIG-INGEST-017).
#
# The acquisition-channel and funding-instrument value sets mirror the frozen
# ontology enums AcquisitionChannel / FundingInstrumentType and the ProcurementState
# lifecycle track (ontology/schema/common.yaml, §11.11/§11.12/§13.4); they are
# duplicated here as the connector's runtime allowlist and a test asserts they stay
# in lock-step with the ontology (drift is a failed test).
#
# NOTE ON TOML ORDERING: every top-level key MUST appear ABOVE the first [table]
# header — otherwise TOML nests it under that table. The [sources] and per-source
# tables therefore come last.

# The connector's own vocabulary version, stamped onto every run (§20).
# 2026.09.16 (P26.2 / SOURCES.2): +procurement_notice surface (SAM.gov federal
# opportunities), +agenda_item index rows + the per-platform index endpoints /
# reviewed matter-type patterns the agenda-platform tenant path now resolves.
# 2026.09.17 (P26.5 / SOURCES.5): +escribe platform (eScribe Meetings — the
# ASP.NET `MeetingsCalendarView.aspx/GetCalendarMeetings` JSON webmethod,
# `items_key = "d"`) joins the agenda-platform set.
vocab_version = "2026.09.17"

# The predicate allowlist enforced as a hard schema gate (SIG-INGEST-033): the
# `procurement` connector may write ONLY the Contract (§11.11) and FundingInstrument
# (§11.12) predicate surfaces plus the dated lifecycle transition. Writing anything
# else — a device count, a deployment, a records request, a parsed-document claim —
# is a schema error, the D6 admissibility filter enforced at ingest (§10.5).
# `contract` and `funding_instrument` are the entity assertions themselves; the
# rest are their predicates.
predicate_allowlist = [
  "contract",
  "buyer",
  "seller",
  "amount",
  "currency",
  "signed_date",
  "start_date",
  "end_date",
  "renewal_options",
  "products",
  "quantities",
  "document",
  "acquisition_channel",
  "parent_cooperative_contract",
  "amends_contract",
  "lifecycle_transition",
  "external_id",
  "funding_instrument",
  "funder",
  "recipient",
  "instrument_type",
  "program_name",
  "award_date",
  "period",
  "conditions",
  "federal_award_id",
  # P26.2 (SOURCES.2): the SAM.gov federal-opportunity surface — a notice is a
  # dated procurement-lifecycle event (solicitation/award notice), NOT a
  # contract; `procurement_notice` is the entity assertion, the rest are its
  # predicates. And `agenda_item` is the agenda-platform index row marker.
  "procurement_notice",
  "notice_type",
  "posted_date",
  "response_deadline",
  "agenda_item",
]

# Predicate GENRES the procurement connector MUST NOT write (scope-creep guard,
# §23.6 / spec "Out of scope"): the device/deployment/config write-set owned by
# other tickets, the records-request surface (P07.2), and parsed-document claims
# (the parser is P07.1's; this connector CALLS it to classify a captured contract
# document, it does not run a layer engine). Named here so the refusal is data, not
# a magic string — the allowlist above is authoritative; this documents the
# out-of-scope write-set explicitly.
forbidden_predicate_genres = [
  "deployment_exists",
  "device_count",
  "camera_count",
  "records_request",
  "response_status",
  "parsed_document_claim",
  "configuration_state",
]

# The Contract acquisition-channel vocabulary (§11.11, AcquisitionChannel). A
# REQUIRED model element, not a convenience (SIG-ONTO-032).
acquisition_channels = [
  "direct_award",
  "competitive_rfp",
  "sole_source",
  "cooperative_piggyback",
  "bundle_inclusion",
  "free_trial",
  "donation",
  "grant_funded",
]

# The acquisition channel a piggyback contract carries. When a contract is on this
# channel it MUST set parent_cooperative_contract (the ridden master award) —
# SIG-ONTO-032: an agency riding a master award often files NO local RFP, and a
# model assuming a local competition would wrongly conclude no procurement evidence
# exists. Enforced in code (Contract.__post_init__), named here as data.
cooperative_channel = "cooperative_piggyback"

# The FundingInstrument instrument-type vocabulary (§11.12, FundingInstrumentType).
# Funder != recipient != purchaser: a BID/HOA/foundation/federal program can fund
# surveillance an agency operates, a pattern CCOPS ordinances (which regulate agency
# acquisition) miss (SIG-ONTO-033).
funding_instrument_types = [
  "federal_grant",
  "state_grant",
  "private_donation",
  "bid_assessment",
  "hoa_assessment",
  "foundation_grant",
  "asset_forfeiture",
  "vendor_provided_free",
]

# The procurement lifecycle-track states (§13.4, ProcurementState). A dated
# lifecycle transition is a (state, date) pair the connector may write.
procurement_states = [
  "unknown",
  "proposed",
  "rfp_issued",
  "awarded",
  "contracted",
  "cooperative_piggyback",
  "bundle_included",
  "free_trial",
  "donated",
  "third_party_funded",
  "grant_funded_pending",
  "renewed",
  "nonrenewed",
  "canceled",
  "rejected",
]

# Federal grant PROGRAM names that name local surveillance purchases in USAspending
# sub-award data (§11.12 program_name, SIG-ONTO-033). A program_name is a literal,
# recorded verbatim; this list documents the ones R4 verified route to LPR/ALPR and
# camera purchases by sheriffs and cities. NOT a closed vocabulary — a program not
# listed is still recorded from its raw value.
federal_programs = [
  "Byrne JAG",
  "Edward Byrne Memorial Justice Assistance Grant",
  "UASI",
  "Urban Area Security Initiative",
  "COPS",
  "Operation Stonegarden",
  "HIDTA",
  "Homeland Security Grant Program",
  "State Homeland Security Program",
]

# The cooperative purchasing vehicles (§22.3, §11.11). A contract sourced from one
# of these is a piggyback: acquisition_channel = cooperative_piggyback and it MUST
# link the master award via parent_cooperative_contract (SIG-ONTO-032). Values are
# registry source ids (data/sources.toml).
cooperative_vehicles = [
  "sourcewell",
  "omnia_partners",
  "naspo_valuepoint",
  "buyboard",
  "tips_usa",
  "hgacbuy",
  "equalis_group",
  "gsa",
]

# The agenda-platform registry source ids (§22.3). Agenda platforms are per-tenant
# APIs; the municipality->platform directory is the published tenant registry in
# data/agenda_tenants.toml, which the connector reads its targets from.
agenda_platforms = [
  "legistar",
  "primegov",
  "civicclerk",
  "civicplus",
  "escribe",
]

# The artifact_type genres this connector may stamp on a captured procurement
# document (§10.3.2, SIG-INGEST-047). Mirrors the frozen ArtifactType ontology enum;
# a test asserts these are members of it.
artifact_types = [
  "contract",
  "grant_award",
  "budget",
  "state_auditor_survey",
  "warrant",
  "procurement_aggregator_record",
]

# The registry source ids the `procurement` connector runs against, by connector
# role key (§22.6). Each is a row already seeded in data/sources.toml.
[sources]
usaspending    = "usaspending"
sam_gov        = "sam_gov"
govspend       = "govspend"
sourcewell     = "sourcewell"
omnia_partners = "omnia_partners"
gsa            = "gsa"
legistar       = "legistar"
primegov       = "primegov"
civicclerk     = "civicclerk"
escribe        = "escribe"

# --- USAspending: sub-awards, not only prime awards (§23.6, SIG-ONTO-033) ------
# USAspending exposes prime awards AND sub-awards. Sub-awards are the traceable
# link from a federal grant program (Byrne JAG, UASI) to the LOCAL purchase that
# appears in no local procurement record. The connector MUST pull sub-awards
# (`subaward_type = "sub-grant"`/`"sub-contract"`), not only prime awards.
[usaspending]
api_base           = "https://api.usaspending.gov/api/v2"
subawards_endpoint = "/subawards/"                  # POST spending_by_award w/ subaward=true
prime_endpoint     = "/search/spending_by_award/"
# The award-id field on a sub-award that is the traceable federal_award_id link.
federal_award_id_field = "prime_award_generated_internal_id"
subaward_id_field      = "internal_id"
# Sub-awards MUST be pulled: this is the flag the connector asserts on every
# USAspending target (assert_pulls_subawards).
subaward = true

# --- Agenda-platform index endpoints (P26.2 / SOURCES.2) ----------------------
# Each agenda-platform tenant row names the per-tenant api_base; the platform's
# INDEX endpoint (the public meetings/matters listing the portal itself reads)
# is appended here — a bounded fetch (top/N or a reviewed POST body), never a
# crawl. Probed live 2026-09-16: webapi.legistar.com/v1/<client>/matters returns
# the client's public matter index; lacity.primegov.com PublicPortal /search
# returns the meeting index; {tenant}.api.civicclerk.com/v1/Events is the
# portal's own endpoint (the tenant key comes from the portal's embedded
# config — anonymous requests currently 404, recorded honestly, never faked).
[platform_endpoints.legistar]
# InSite API: the tenant matter index is `{api_base}/matters` (OData; $top bounds
# the pull, $orderby keeps the freshest records first). The bare api_base 404s.
index_path  = "/matters"
index_query = "$top=100&$orderby=MatterLastModifiedUtc%20desc"
# The human-readable legislation detail page for a matter (link, not bytes).
matter_link_template = "https://{tenant}.legistar.com/LegislationDetail.aspx?ID={matter_id}&GUID={matter_guid}"
# A matter becomes a Contract claim ONLY when its MatterTypeName matches one of
# these reviewed type-name substrings (case-insensitive). A municipality's
# contract-approval instruments carry contract-family type names (Mesa:
# 'Contract', 'Agreement'; San Antonio: 'Contract', 'Agreement', 'Purchase',
# 'Lease', 'Interlocal', 'Settlement', 'Professional Services'). An ordinance /
# resolution / appointment is legislative business, not a contract — it lands as
# an agenda_index row only, never a Contract (§3.1 — no synthetic certainty).
contract_matter_patterns = [
  "contract",
  "agreement",
  "purchase",
  "lease",
  "interlocal",
  "professional services",
  "settlement",
]

[platform_endpoints.primegov]
# PrimeGov PublicPortal: POST {api_base}/search returns the tenant meeting index
# (probed 2026-09-16 — LA City; a bounded body bounds the window).
index_path = "/search"
index_method = "post"
index_body = {}
# Meeting objects carry no contract-typing — index rows only.

[platform_endpoints.civicclerk]
# CivicClerk v1: {api_base} already names the Events index (the portal's own
# endpoint; api_base template is https://{tenant}.api.civicclerk.com/v1/Events).
# The endpoint speaks OData — $top bounds the pull (P26.3: verified 2026-09-17,
# the index is otherwise the tenant's full event list).
index_path  = ""
index_query = "$top=100"

[platform_endpoints.escribe]
# eScribe Meetings (P26.5): the tenant's public Meetings calendar page calls its
# own ASP.NET JSON webmethod — POST {api_base}/MeetingsCalendarView.aspx/
# GetCalendarMeetings answers {"d": [ …meeting records… ]} (verified live
# 2026-09-17 across the pub-* tenant surface; api_base template is
# https://pub-{tenant}.escribemeetings.com). The reviewed index_body bounds the
# calendar window — a dated slice, never a full-history crawl.
index_path   = "/MeetingsCalendarView.aspx/GetCalendarMeetings"
index_method = "post"
index_body   = { calendarStartDate = "2025-01-01T00:00:00", calendarEndDate = "2026-12-31T23:59:59" }
items_key    = "d"
# The human-readable meeting page (link, not bytes) — {tenant} is the pub-*
# slug, {matter_id} the meeting's ID guid.
matter_link_template = "https://pub-{tenant}.escribemeetings.com/MeetingsCalendarView.aspx/Meeting?Id={matter_id}"

# --- SAM.gov federal opportunities (P26.2 / SOURCES.2) -------------------------
# The documented public opportunities search (api.sam.gov, open.gsa.gov): a
# bounded keyword+window query, api_key from $SIG_SAM_GOV_KEY (HG-09, never in a
# file). A notice is a dated lifecycle event on the procurement track, NOT a
# contract — `notice_type` → lifecycle state is the reviewed data map below; an
# unlisted type emits index facts only (never a guessed lifecycle, §3.1).
[sam_gov]
api_base = "https://api.sam.gov/prod/opportunities/v2"
search_endpoint = "/search"
api_key_env = "SIG_SAM_GOV_KEY"
# The api.data.gov-gateway credential header (P26.4): the key rides the request
# header, never the URL — a keyed query would land in the recorded source_uri /
# run records (HG-09). Verified live 2026-09-17: X-Api-Key → 200, keyless → 404.
api_key_header = "X-Api-Key"

# Reviewed SAM notice type → procurement lifecycle state (§13.4) +
# acquisition_channel hint. `channel` is emitted only where the notice type ITSELF
# declares it (a Justification & Approval notice is a sole-source intent).
[sam_gov.notice_map]
Solicitation                        = { state = "rfp_issued" }
"Combined Synopsis/Solicitation"    = { state = "rfp_issued" }
Presolicitation                     = { state = "proposed" }
"Sources Sought"                    = { state = "proposed" }
"Special Notice"                    = { state = "proposed" }
"Intent to Bundle Requirements"     = { state = "proposed" }
"Fair Opportunity / Limited Sources" = { state = "proposed" }
"Justification"                     = { state = "proposed", channel = "sole_source" }
"Award Notice"                      = { state = "awarded" }
