# --- P26.14 (FEDERAL.1): bounded federal sweep plans ---------------------------
# The widened surveillance keyword space shared by USAspending and SAM.gov.
# Keywords are API SEARCH terms (precision comes from the verbatim
# agenda_content_vocab scan at normalize, never the keyword); bounds are
# reviewed data — every generated target carries its page/size caps so a
# sweep stays finite and each slice is one counted request (a refused
# request is recorded and NEVER re-probed — SIG-INGEST-012/013).
[usaspending_sweep]
keywords = [
  "license plate reader",
  "automated license plate",
  "automatic license plate",
  "alpr",
  "facial recognition",
  "drone",
  "unmanned aerial",
  "cell-site simulator",
  "stingray",
  "shotspotter",
  "acoustic gunshot",
  "surveillance camera",
  "predictive policing",
  "geofence",
  "data broker",
  "gunshot detection",
  "real time crime center",
  "body camera",
  "video surveillance",
]
# Awarding agencies whose pass-through grant programs buy local surveillance
# (the high-signal funder set: Byrne JAG/UASI/HSGP live under DOJ + DHS; DoD
# is included for direct federal surveillance purchases).
agencies = [
  { name = "Department of Justice" },
  { name = "Department of Homeland Security" },
  { name = "Department of Defense" },
]
[usaspending_sweep.bounds]
page_size        = 100
sub_max_pages    = 2      # sub-award keyword slices: the federal→local link
prime_max_pages  = 1      # prime award keyword slices: bounded to the top window
agency_max_pages = 1      # agency slices search the whole keyword set at once
time_period = [ { start_date = "2018-01-01", end_date = "2026-12-31" } ]
# Assistance award types (grants/coops/direct payments — the pass-through set).
sub_award_type_codes   = [ "02", "03", "04", "05", "06", "07", "08", "09", "10", "11" ]
# All award types for prime slices (contracts A/B/C/D + assistance above).
prime_award_type_codes = [ "A", "B", "C", "D", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11" ]
sub_fields = [ "Sub-Award ID", "Sub-Awardee Name", "Sub-Award Date", "Sub-Award Amount", "Sub-Award Description", "Awarding Agency", "prime_award_generated_internal_id" ]
prime_fields = [ "Award ID", "Recipient Name", "Award Amount", "Start Date", "End Date", "Awarding Agency", "Description" ]

[sam_gov_sweep]
# The same reviewed keyword space over the documented opportunities search —
# one bounded title query per keyword (the API's own `title` field; `limit` +
# posted window bound each slice). The key rides X-Api-Key, never the URL.
keywords = [
  "license plate reader",
  "automated license plate",
  "automatic license plate",
  "alpr",
  "facial recognition",
  "drone",
  "unmanned aerial",
  "cell-site simulator",
  "stingray",
  "shotspotter",
  "acoustic gunshot",
  "surveillance camera",
  "predictive policing",
  "geofence",
  "data broker",
  "gunshot detection",
  "real time crime center",
  "body camera",
  "video surveillance",
]
limit       = 25
posted_from = "01/01/2026"
posted_to   = "12/31/2026"
# --- P26.19 (SOURCES.18): bound one run to a single daily quota window --------
# api.data.gov meters `sig-sam-gov-key` per UTC day (the 429 body names the
# reset: "You can access API after <date> 00:00:00+0000 UTC"). A run must fit
# comfortably inside ONE fresh window WITH HEADROOM and never burn it into a
# failure. `daily_request_budget` is the per-run request cap the sweep stops at
# BEFORE the hard 429 wall (a refused request still counts, so we never re-probe
# past it — SIG-INGEST-012/013). It is >= the keyword count above, so one
# fresh-window run covers the whole prioritised keyword space; if an operator
# lowers it below the keyword count the persisted `sweep_cursor` pages the
# remaining keywords across successive daily windows (never one run over quota).
daily_request_budget = 30

# ===========================================================================
# P26.15 (SOURCES.14) — the EU tender sweep: TED (Tenders Electronic Daily)
# ===========================================================================
# TED is the EU's procurement surface: every notice published in the Supplement
# to the Official Journal (OJ S) across ~30 countries — EU-27 + EEA + candidate
# states — including Frontex, Europol, national police forces, and municipal
# buyers. The Search API is the documented public reuse surface
# (docs.ted.europa.eu/api/latest/search.html): "this API ... does not require
# authentication, making it openly accessible to any system or user" (verbatim,
# retrieved 2026-09-18; keyless confirmed live 2026-09-18 — an anonymous
# checkQuerySyntax POST returned 200, no credential anywhere).
#
# POST /v3/notices/search — PublicExpertSearchRequestV1 (api-v3.yaml):
#   query          expert-search string (field=term / FT~"phrase" / AND, OR, IN)
#   fields         the enum of retrievable notice fields (verified names below)
#   page / limit   PAGE_NUMBER pagination (≤250 notices/page, ≤10k field values
#                  per page, ≤15k retrievable per query — all documented bounds)
#   scope          LATEST | ACTIVE | ALL
#   paginationMode PAGE_NUMBER (stateless; a page is independently retrievable).
#                  ITERATION/scroll mode is deliberately never used — the sweep
#                  is a bounded window, not an unbounded drain.
# Response: ExpertSearchResponse { notices[], totalNoticeCount,
#   iterationNextToken, timedOut }; i18n fields map {lang: text|[texts]} over
#   the notice's own languages (eng when supplied, else the notice's language).
# Verified live 2026-09-18: buyer-country values are ISO 3166-1 ALPHA-3 codes
# (POL, MKD, NOR); place-of-performance values are NUTS codes whose 2-letter
# prefix is the alpha-2 country (PL822 → PL); CPV values are bare 8-digit codes
# (32323500 — the check digit is not carried).
#
# A tender notice is PROCUREMENT EVIDENCE ONLY: it asserts a buyer published a
# notice containing a reviewed literal — procured ≠ deployed, never a device
# count, an operational state, or a deployment claim (§3.1, SIG-INGEST-033).

[ted_eu_sweep]
version          = "2026.09.18.1"
endpoint         = "https://api.ted.europa.eu/v3/notices/search"
page_size        = 250        # verified documented bound (api-v3.yaml limit ≤250)
max_pages_per_slice = 1       # one page per (keyword|CPV) slice — a bounded window
pagination_mode  = "PAGE_NUMBER"
scope            = "ALL"
only_latest_versions = true
# Rolling publication-date window (days back from the run date): the bound lands
# in the POST body's expert query, never in claim identity — the same notice
# re-found next month produces the identical claim (content-keyed dedupe).
search_window_days = 120
# The field set each slice requests (all names verified against api-v3.yaml's
# PublicExpertSearchRequestV1 fields enum + a live 200 response, 2026-09-18).
# 22 fields × 250/page = 5,500 field-values — inside the 10k/page bound.
fields = [
  "publication-number", "publication-date", "dispatch-date",
  "notice-type", "form-type", "notice-version", "procedure-identifier",
  "notice-title", "buyer-name", "buyer-country", "organisation-country-buyer",
  "place-of-performance", "place-of-performance-city-lot",
  "place-of-performance-subdiv-lot", "place-of-performance-country-lot",
  "description-proc", "classification-cpv",
  "total-value", "total-value-cur",
  "winner-name", "winner-country", "deadline-receipt-tender-date-lot",
]
# TED returns ISO 3166-1 ALPHA-3 country codes; the jurisdiction claim is the
# alpha-2 form (P26.9 convention). The mapping is reviewed data — an unmapped
# alpha-3 keeps its verbatim raw_value and emits no normalized identifier
# (never a fabricated code). EU-27 + EEA + UK/CH + candidate states.
[ted_eu_sweep.country_map]
AUT = "AT"
BEL = "BE"
BGR = "BG"
HRV = "HR"
CYP = "CY"
CZE = "CZ"
DNK = "DK"
EST = "EE"
FIN = "FI"
FRA = "FR"
DEU = "DE"
GRC = "GR"
HUN = "HU"
IRL = "IE"
ITA = "IT"
LVA = "LV"
LTU = "LT"
LUX = "LU"
MLT = "MT"
NLD = "NL"
POL = "PL"
PRT = "PT"
ROU = "RO"
SVK = "SK"
SVN = "SI"
ESP = "ES"
SWE = "SE"
NOR = "NO"
ISL = "IS"
LIE = "LI"
GBR = "GB"
CHE = "CH"
MKD = "MK"
ALB = "AL"
SRB = "RS"
MNE = "ME"
TUR = "TR"
UKR = "UA"
MDA = "MD"
XKX = "XK"
BIH = "BA"
USA = "US"
CAN = "CA"

# The 11 reviewed surveillance-relevance keyword slices — the ticket's own
# term set. `query` is the exact phrase sent inside FT~"…"; `patterns` are
# the case-insensitive verbatim-scan expressions applied to the RETURNED
# notice text — a matched_keyword claim's raw_value is the literal slice found
# in the notice, never the query term itself. EU phrasings included
# ("number-plate recognition", "video surveillance").
[[ted_eu_sweep.keywords]]
id = "cctv"
query = "CCTV"
kind = "technology"
patterns = ["\\bcctv\\b", "closed.?circuit television", "closed.?circuit surveillance"]

[[ted_eu_sweep.keywords]]
id = "surveillance_camera"
query = "surveillance camera"
kind = "technology"
patterns = [
  "surveillance cameras?", "video surveillance", "surveillance system",
  "camera surveillance", "surveillance network", "videosurveillance",
]

[[ted_eu_sweep.keywords]]
id = "anpr"
query = "ANPR"
kind = "technology"
patterns = ["\\banpr\\b", "automatic number.?plate", "number.?plate recognition"]

[[ted_eu_sweep.keywords]]
id = "automatic_number_plate"
query = "automatic number plate"
kind = "technology"
patterns = [
  "automatic number.?plate", "number.?plate recognition",
  "automatic licence.?plate", "licence.?plate recognition",
]

[[ted_eu_sweep.keywords]]
id = "facial_recognition"
query = "facial recognition"
kind = "technology"
patterns = ["facial recognition", "face recognition", "facial biometric"]

[[ted_eu_sweep.keywords]]
id = "drone"
query = "drone"
kind = "technology"
patterns = ["\\bdrones?\\b", "\\buas\\b", "\\buav\\b", "unmanned aerial", "unmanned aircraft"]

[[ted_eu_sweep.keywords]]
id = "unmanned_aerial"
query = "unmanned aerial"
kind = "technology"
patterns = ["unmanned aerial", "unmanned aircraft", "unmanned air system"]

[[ted_eu_sweep.keywords]]
id = "biometric"
query = "biometric"
kind = "technology"
patterns = ["biometrics?", "biometric identif", "biometric recogn"]

[[ted_eu_sweep.keywords]]
id = "acoustic_gunshot"
query = "acoustic gunshot"
kind = "technology"
patterns = [
  "acoustic gunshot", "gunshot detection", "gunshot locali[sz]",
  "gunfire detection", "shot detection",
]

[[ted_eu_sweep.keywords]]
id = "predictive_policing"
query = "predictive policing"
kind = "technology"
patterns = ["predictive policing", "\\bpredpol\\b", "predictive analysis"]

[[ted_eu_sweep.keywords]]
id = "body_worn_camera"
query = "body-worn camera"
kind = "technology"
patterns = ["body.?worn", "body cameras?", "bodycams?", "body-worn cam"]

# The verified CPV slices — 8-digit codes as TED stores/searches them (the
# check digit is not carried by the API). Verified against the CPV nomenclature
# listings (simap.ted.europa.eu CPV divisions 32/35/38/42/79) 2026-09-18 —
# 38000000 was reviewed and REJECTED (it is the whole laboratory/optical/
# precision-equipment division, not a surveillance code); 32323500
# "Video-surveillance system" was ADDED — the dominant code on live
# video-surveillance notices (verified in the 2026-09-18 probe).
[[ted_eu_sweep.cpv_codes]]
