# SPDX-License-Identifier: Apache-2.0
# The versioned `procurement` connector vocabulary (§23.6, §11.11, §11.12, P07.3).
# This table is DATA, not code (SIG-ENG-001): the Contract / FundingInstrument
# predicate surface, the acquisition-channel and funding-instrument vocabularies,
# the cooperative-vehicle source set, the agenda-platform set, and the USAspending
# sub-award facts are data rows reviewed on their own.
# Changes after P07.3 are VERSIONED MIGRATIONS (§20), not edits — bump
# `vocab_version` and add the change, never silently rewrite a row, so a
# re-extraction under a new vocabulary is a new interpretation, never a
# destructive overwrite (SIG-INGEST-017).
#
# The acquisition-channel and funding-instrument value sets mirror the frozen
# ontology enums AcquisitionChannel / FundingInstrumentType and the ProcurementState
# lifecycle track (ontology/schema/common.yaml, §11.11/§11.12/§13.4); they are
# duplicated here as the connector's runtime allowlist and a test asserts they stay
# in lock-step with the ontology (drift is a failed test).
#
# NOTE ON TOML ORDERING: every top-level key MUST appear ABOVE the first [table]
# header — otherwise TOML nests it under that table. The [sources] and per-source
# tables therefore come last.

# The connector's own vocabulary version, stamped onto every run (§20).
# 2026.09.16 (P26.2 / SOURCES.2): +procurement_notice surface (SAM.gov federal
# opportunities), +agenda_item index rows + the per-platform index endpoints /
# reviewed matter-type patterns the agenda-platform tenant path now resolves.
# 2026.09.17 (P26.5 / SOURCES.5): +escribe platform (eScribe Meetings — the
# ASP.NET `MeetingsCalendarView.aspx/GetCalendarMeetings` JSON webmethod,
# `items_key = "d"`) joins the agenda-platform set.
# 2026.09.17 (P26.6 / SOURCES.6): +content_term predicate (a captured agenda/
# minutes/matter document contains a reviewed agenda_content_vocab term —
# verbatim literal + document locator); +per-platform document endpoints
# (doc_url_template / doc_link_keys / doc_id_keys / doc_genre /
# doc_required_fields) and the reviewed bounded-window bounds
# (doc_per_tenant / doc_run_cap) each platform's index captures fan out under;
# escribe matter_link_template corrected to the verified Meeting.aspx page
# (the MeetingsCalendarView.aspx/Meeting link 404s — probed 2026-09-17).
# 2026.09.18 (P26.10 / SOURCES.9): +portal_index predicate (the per-tenant
# portal index outcome row), +procurement_portals source set (BidNet agency
# storefronts, Bonfire/OpenGov portals, city Socrata contract datasets), and
# the [platform_endpoints.bidnet]/[platform_endpoints.socrata] reviewed
# endpoint facts — bounded keyword-window searches and SoQL slices, verbatim
# agenda_content_vocab scans deciding every emitted claim.
# 2026.09.18 (P26.14 / FEDERAL.1): +matched_keyword +description predicates
# (the typed federal-award notice surface), +[usaspending_sweep] bounded
# prime/sub-award keyword-and-agency sweep plan and +[sam_gov_sweep] the
# widened SAM.gov keyword set — federal awards emit `procurement_notice`
# claims only (procured ≠ deployed: a purchase signal, never deployment
# evidence — SIG-INGEST-033 boundary preserved).
# 2026.09.18 (P26.15 / SOURCES.14): +place_of_performance predicate (verbatim
# NUTS/city place-of-performance literals on a TED notice — recorded as the
# notice states them, never fabricated into an ISO 3166-2 identifier) and
# +[ted_eu_sweep] the bounded EU tender sweep plan (TED Search API POST
# /v3/notices/search — keyless documented public API; 11 reviewed keyword
# slices + 10 verified CPV slices, one PAGE_NUMBER page each).
vocab_version = "2026.09.18-p26.15"

# The predicate allowlist enforced as a hard schema gate (SIG-INGEST-033): the
# `procurement` connector may write ONLY the Contract (§11.11) and FundingInstrument
# (§11.12) predicate surfaces plus the dated lifecycle transition. Writing anything
# else — a device count, a deployment, a records request, a parsed-document claim —
# is a schema error, the D6 admissibility filter enforced at ingest (§10.5).
# `contract` and `funding_instrument` are the entity assertions themselves; the
# rest are their predicates.
predicate_allowlist = [
  "contract",
  "buyer",
  "seller",
  "amount",
  "currency",
  "signed_date",
  "start_date",
  "end_date",
  "renewal_options",
  "products",
  "quantities",
  "document",
  "acquisition_channel",
  "parent_cooperative_contract",
  "amends_contract",
  "lifecycle_transition",
  "external_id",
  "funding_instrument",
  "funder",
  "recipient",
  "instrument_type",
  "program_name",
  "award_date",
  "period",
  "conditions",
  "federal_award_id",
  # P26.2 (SOURCES.2): the SAM.gov federal-opportunity surface — a notice is a
  # dated procurement-lifecycle event (solicitation/award notice), NOT a
  # contract; `procurement_notice` is the entity assertion, the rest are its
  # predicates. And `agenda_item` is the agenda-platform index row marker.
  "procurement_notice",
  "notice_type",
  "posted_date",
  "response_deadline",
  "agenda_item",
  # P26.6 (SOURCES.6): a captured agenda/matter document contains a reviewed
  # agenda_content_vocab term — the verbatim literal stays raw_value, the term
  # id is the typed value, and the claim carries the document locator.
  "content_term",
  # P26.10 (SOURCES.9): the per-tenant procurement-portal index outcome row —
  # one row per captured tenant index recording items/matches/bounds (the
  # portal analogue of the agenda_index marker).
  "portal_index",
  # P26.14 (FEDERAL.1): the typed federal-award notice surface. `description`
  # is the award's own description text verbatim; `matched_keyword` asserts
  # only that the record's text CONTAINS a reviewed surveillance-relevance
  # literal (raw_value = the verbatim slice) — never that a system was
  # deployed (procured ≠ deployed; the claim names a text match, period).
  "description",
  "matched_keyword",
  # P26.15 (SOURCES.14): the verbatim place-of-performance literals a TED
  # notice states (NUTS codes, city names) — recorded as stated; a NUTS code
  # is NOT an ISO 3166-2 identifier and is never emitted as one. `country` is
  # the normalized jurisdiction claim (the verbatim alpha-3 stays raw_value;
  # the alpha-2 comes from the reviewed [ted_eu_sweep.country_map]). `title`
  # is the notice's verbatim notice-title literal (same verbatim-field class
  # as `description`).
  "place_of_performance",
  "country",
  "title",
]

# Predicate GENRES the procurement connector MUST NOT write (scope-creep guard,
# §23.6 / spec "Out of scope"): the device/deployment/config write-set owned by
# other tickets, the records-request surface (P07.2), and parsed-document claims
# (the parser is P07.1's; this connector CALLS it to classify a captured contract
# document, it does not run a layer engine). Named here so the refusal is data, not
# a magic string — the allowlist above is authoritative; this documents the
# out-of-scope write-set explicitly.
forbidden_predicate_genres = [
  "deployment_exists",
  "device_count",
  "camera_count",
  "records_request",
  "response_status",
  "parsed_document_claim",
  "configuration_state",
]

