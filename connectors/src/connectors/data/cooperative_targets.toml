# The `cooperative` connector's committed seed inventory (P36.78 /
# R11-ACQ-33). This table is DATA, not code (SIG-ENG-001): the seed rows are
# the cooperative contract-page surface the I6/I7 discovery named and
# decision-catalog row I7-C3 [B-39] authorised under ADR-184's envelope —
# reviewed on their own, never discovery output. Identifiers + provenance
# only: a row is a URL, a kind, a source and an evidence ref, never content.
#
# Every row is a PUBLIC UNAUTHENTICATED surface: https, the committed host
# for its platform, the kind's reviewed public path — no credentials, no
# member-only endpoints, no query strings. Sourcewell's terms-use page
# (prohibited uses: "Use automated tools such as robots or spiders") and
# OMNIA's terms-of-use page ("you shall not: (a) use any robot, spider, or
# other automatic or manual device or process for the purpose of
# 'scraping,' 'crawling,' harvesting, or compiling information") are both
# affirmatively restrictive — leg A is bounded screen GETs only under
# GATE-G5's OM-20 naming (2026-10-25T18:40Z, expires GATE-G6); leg B (the
# first real wire as a connector run) is the operator's act under OP-26 /
# ING-GO-D (never granted — queues per OM-19). All rows stay behind
# `ingestion_permitted=false` — the gate REFUSES until the operator's HG-03
# line.

schema = "sig.cooperative-targets/1"

[inventory]
