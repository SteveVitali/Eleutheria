technology_field_pattern = '(?im)technology\s*:\s*(automatic\s+license\s+plate\s+readers?|license\s+plate\s+readers?|acoustic\s+gunshot\s+detection|gunshot\s+detection|social\s+media\s+monitoring|closed[\s-]circuit\s+television|cctv)'
legal_authority_pattern = 'SMC\s+14\.18|14\.18|Seattle\s+Municipal\s+Code'
# The usage review IS the mandated use statement (frequency/patterns of
# use, sharing, security, impacts) — its own count literals carry the
# use claims; names of officers/operators are never extracted.
reports_use_pattern = '(?i)usage\s+review|frequency\s+of\s+use'
use_fields = [
  { predicate = "usage_count", pattern = '(?im)(?:searches?|queries|uses?|deployments?)\s+(?:in\s+the\s+review\s+period|reported)[^0-9\n]{0,40}[:\-]?\s*(?P<value>\d[\d,]*)' },
]
mandated_sections = []

[adapters.us_dhs_privacy]
jurisdiction = "US"
# The federal PIA/SORN compliance surfaces: the PIA hub + the component
# indexes enumerate publication-page links; the three named-program
# targets (OBIM HART, CBP BSS, CBP telemetry) are publication pages whose
# links resolve the filing PDFs under /sites/default/files/. A filing's
# component rides its own DHS/<component>/PIA-... literal.
agency = "U.S. Department of Homeland Security"
ordinance_citation = "E-Government Act of 2002 § 208 (44 U.S.C. § 3501 note — privacy impact assessments)"
ordinance_literals = ["Section 208", "E-Government Act", "§ 208"]
# A SORN or component page naming only the Privacy Act gets no § 208
# stamp — the literal-required guard keeps the instrument honest; the
# filing's own authority still lands as legal_authority.
ordinance_literal_required = true
enacting_body_literal = "United States Congress"
enacting_body = "United States Congress"
document_genre = "statutory_report"
technology_mapped = true
# The PIA surfaces link filings whose anchors/paths carry the DHS/PIA
# naming convention — the reviewed scope screen admits those links only
# (FOIA/nav links and unrelated publication pages are never filings).
scope_terms = ["pia", "privacy impact assessment"]
# No default_technology — the row covers several programs; each filing is
# typed by its own literal (telemetry, HART, social-media) and an unmapped
# program mints ordinance claims only (SIG-ONTO-021 — never guessed).
agency_anchor_pattern = '(?im)DHS/(?P<agency>[A-Z]{2,6})/'
# A filing's own "DHS/<component>/PIA-NNN" literal derives the component
# agency when no index anchor carries it — verbatim from the filing.
agency_field_pattern = '(?im)DHS/(?P<agency>[A-Z]{2,6})/PIA'
technology_anchor_pattern = '(?i)(?P<tech>commercial\s+telemetry\s+data|homeland\s+advanced\s+recognition\s+technology|social\s+media\s+monitoring|border\s+surveillance\s+systems?)'
technology_field_pattern = '(?im)technology\s*:\s*(commercial\s+telemetry\s+data|homeland\s+advanced\s+recognition\s+technology|social\s+media\s+monitoring|border\s+surveillance\s+systems?)'
legal_authority_pattern = 'Section\s+208|E[\s-]Government\s+Act|5\s+U\.?S\.?C\.?\s*§?\s*552a|Privacy\s+Act\s+of\s+1974'
mandated_sections = []

[adapters.us_dhs_sorn]
jurisdiction = "US"
# The I3-C072 SORN family rides Federal Register document pages (no API
# adapter — I8 §5.6): each notice is a disclosure_document whose Privacy
# Act authority lands verbatim. A filing's own technology literal types
# it — and the literal "license plate readers" hits the Part VIII
# forbidden-token gate: suppressed, recorded on the artifact row, never
# emitted (the filings name plate data verbatim; Part VIII binds).
agency = "U.S. Department of Homeland Security"
ordinance_citation = "Privacy Act of 1974, 5 U.S.C. § 552a (system of records notices)"
ordinance_literals = ["5 U.S.C. 552a", "Privacy Act of 1974", "552a"]
enacting_body_literal = "United States Congress"
enacting_body = "United States Congress"
document_genre = "statutory_report"
technology_mapped = true
# No default_technology — each notice is typed by its own literal or emits
# ordinance claims only (SIG-ONTO-021).
# The notice's own system identifier (ICE-009 / CBP-007 / ...) derives the
# component agency — verbatim from the filing, never the publisher string.
agency_field_pattern = '(?im)(?P<agency>ICE|CBP|USCIS|FEMA|TSA|USSS|OBIM)-\d{3}'
technology_field_pattern = '(?im)technology\s*:\s*(license\s+plate\s+readers?|automated\s+license\s+plate\s+readers?|automated\s+targeting\s+system|border\s+crossing\s+information)'
legal_authority_pattern = '5\s+U\.?S\.?C\.?\s*§?\s*552a|Privacy\s+Act\s+of\s+1974'
mandated_sections = []
