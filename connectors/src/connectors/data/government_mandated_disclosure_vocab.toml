scope_terms = ["alpr", "license plate", "licence plate", "surveillance", "facial recognition", "drone", "uav", "shotspotter", "gunshot", "cell-site", "cell site", "stingray", "body-worn", "body worn", "real-time crime", "cctv", "video surveillance", "automated traffic enforcement", "speed camera", "red light"]
technology_anchor_pattern = '(?i)(?P<tech>ALPR|license\s+plate\s+readers?|facial\s+recognition|shotspotter|gunshot\s+detection|cell[-\s]site\s+simulator|body[-\s]worn\s+cameras?|video\s+surveillance|cctv|automated\s+traffic\s+enforcement|drones?|uas|uav)'
agency_anchor_pattern = '(?i)^(?P<agency>.+?)\s*(?:—|–|-)'
legal_authority_pattern = 'Reports\s+to\s+the\s+General\s+Assembly|mandated'
