technology_anchor_pattern = '(?i)annual\s+report(?:\s+\d{4})?\s+(?P<tech>\S.*?)\s*(?:\s+v\d+)?$'
# The filings cite the ordinance as "§10-66" / "10-66".
legal_authority_pattern = '§\s*10-\d+|10-6\d'
# The §10-66(b) mandated annual-report questionnaire — the nine questions the
