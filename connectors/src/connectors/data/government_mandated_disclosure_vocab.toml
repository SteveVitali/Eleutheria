# --- P25.5: per-source index→document adapter specs (reviewed data) ------------
#
# Each CCOPS index page is the discovery surface for its mandated filings. The
# adapter extracts <a href> links from the captured index, keeps the ones
# matching the spec below (same host, url_contains, suffixes), and resolves them
# into bounded `disclosure_document` targets. `ordinance_literals` are the
# ordinance-citation literals expected on the index page (an index-page claim
# cites the literal verbatim with a byte-range locator). `mandated_sections`
# are the POST Act IUP field schema (the legally required sections of a NYC
# impact & use policy) — each yields a `disclosure_field_state` claim recording
# answered / present_but_empty / absent (mandated != populated, F3.20).

[adapters.seattle]
jurisdiction = "seattle"
agency = "City of Seattle"
ordinance_citation = "Seattle Municipal Code 14.18 (Surveillance Ordinance)"
ordinance_literals = ["SMC 14.18", "Chapter 14.18", "14.18", "Surveillance Ordinance"]
enacting_body_literal = "Seattle City Council"
enacting_body = "Seattle City Council"
doc_url_contains = "/documents/"
doc_suffixes = [".pdf"]
mandated_sections = []

[adapters.nyc_post]
jurisdiction = "nyc"
agency = "New York City Police Department"
ordinance_citation = "NYC Administrative Code § 14-189 (POST Act)"
ordinance_literals = ["POST Act", "Public Oversight of Surveillance Technology"]
enacting_body_literal = "New York City Council"
enacting_body = "New York City Council"
doc_url_contains = "/post-final/"
doc_suffixes = [".pdf"]
# The IUP filename slug: "<technology>-nypd-impact-and-use-policy[_*].pdf" — the
# technology name precedes this marker (used when the title heading is absent).
technology_filename_marker = "-nypd-impact-and-use-policy"
# The POST Act IUP field schema — the sections the statute requires a policy to
# carry. Section state is recorded; a literal value is emitted only where the
# document's own text supplies it (never fabricated).
mandated_sections = [
  { field = "capabilities", heading = "CAPABILITIES OF THE TECHNOLOGY" },
  { field = "rules_of_use", heading = "RULES, PROCESSES & GUIDELINES" },
  { field = "safeguards", heading = "SAFEGUARD & SECURITY MEASURES" },
  { field = "retention_access_use", heading = "RETENTION, ACCESS & USE" },
  { field = "public_access", heading = "PUBLIC ACCESS OR USE" },
  { field = "external_entities", heading = "EXTERNAL ENTITIES" },
  { field = "training", heading = "TRAINING" },
  { field = "audit_oversight", heading = "INTERNAL AUDIT & OVERSIGHT" },
  { field = "health_safety", heading = "HEALTH & SAFETY REPORTING" },
  { field = "disparate_impacts", heading = "DISPARATE IMPACTS" },
]

[adapters.sf]
jurisdiction = "sf"
agency = "City and County of San Francisco"
ordinance_citation = "San Francisco Administrative Code Chapter 19B (Acquisition of Surveillance Technology)"
ordinance_literals = ["Chapter 19B", "19B"]
enacting_body_literal = "Board of Supervisors"
enacting_body = "San Francisco Board of Supervisors"
doc_url_contains = "/documents/"
doc_suffixes = [".pdf"]
mandated_sections = []

# --- P31.13 (BREADTH.2): Oakland / Cambridge / Somerville ----------------------
# Reviewed 2026-09-26 against the live index surfaces (P29.3 rights packets,
# LicenseRef-PublicRecord-FactualCompilation). All three publish their mandated
# filings the way Seattle/SF do — an index page whose <a href> links are the
# discovery surface; the adapter spec below is the reviewed window per city.

[adapters.oakland]
jurisdiction = "oakland"
agency = "Oakland Police Department"
ordinance_citation = "Oakland Municipal Code Chapter 9.64 (Surveillance Technology Ordinance)"
ordinance_literals = ["OMC 9.64", "Chapter 9.64", "9.64", "Surveillance Technology Ordinance"]
enacting_body_literal = "City Council"
enacting_body = "Oakland City Council"
# The Privacy Advisory Commission index links every filing under
# /files/assets/.../documents/pac/*.pdf — the ordinance itself plus the
# mandated <technology> Annual Report (YYYY) filings (probed 2026-09-26).
doc_url_contains = "/documents/pac/"
doc_suffixes = [".pdf"]
# The annual-report anchors name the technology verbatim:
# "Automated License Plate Reader Annual Report (2019)(PDF, 226KB)",
# "Shotspotter Annual Report (2020)", "Mobile ID Annual Report (2020)". The
# captured literal rides raw_value verbatim; a name colliding with a Part VIII
# forbidden token (the ALPR filings literally say "license plate") is suppressed
# at the claim surface and recorded on the artifact — never dropped silently.
technology_anchor_pattern = '(?i)^\s*(?P<tech>\S.*?)\s+annual\s+report\b'
# Oakland filings cite the ordinance as "Oakland Municipal Code (OMC) 9.64".
legal_authority_pattern = '(?:Oakland\s+Municipal\s+Code|O\.?M\.?C\.?)[^\n]{0,10}9\.64|Chapter\s+9\.64'
# Oakland annual reports are memoranda, not a fixed questionnaire — no mandated
# field schema to score populated/absent against.
mandated_sections = []

[adapters.cambridge]
jurisdiction = "cambridge"
agency = "City of Cambridge"
ordinance_citation = "Cambridge Municipal Code Chapter 2.128 (Surveillance Technology)"
ordinance_literals = ["Chapter 2.128", "2.128"]
enacting_body_literal = "City Council"
enacting_body = "Cambridge City Council"
# The reviewed LegiFile detail page (ID=18518) attaches the combined annual
# surveillance report via a FileOpen.aspx link (probed 2026-09-26 — HTTP 200,
# digital-native PDF, 78 pages of per-department questionnaires).
doc_url_contains = "fileopen.aspx"
doc_suffixes = [".aspx"]
# The filing's own questionnaire field — the combined citywide report repeats
# "Surveillance Technology: <name>" once per department filing; multi captures
# each declared technology (one `technology` disclosure claim per literal).
technology_field_pattern = '(?im)surveillance\s+technology\s*:\s*[•\-–\*▪]?\s*([^\n•;]{2,80})'
technology_field_multi = true
# The report cites its mandate as "Chapter 2.128" of the municipal code.
legal_authority_pattern = 'Chapter\s+2\.128|§\s*2\.128'
# The Chapter 2.128 mandated annual-report questionnaire — the eight questions
# the filing is legally required to answer (mandated != populated, F3.20); the
# combined report repeats them once per department and the first occurrence's
# state is recorded per filing.
mandated_sections = [
  { field = "technologies_used", heading = "What Surveillance Technologies has the department used in the last year" },
  { field = "data_sharing", heading = "Has any Surveillance Technology data been shared with a third-party" },
  { field = "complaints", heading = "What complaints (if any) has your department received about Surveillance Technology" },
  { field = "policy_violations", heading = "Were any violations of the Surveillance Use Policy found in the last year" },
  { field = "effectiveness", heading = "Has Surveillance Technology been effective in achieving its identified purpose" },
  { field = "records_requests", heading = "Did the department receive any public records requests concerning Surveillance Technology" },
  { field = "annual_costs", heading = "What were the total annual costs of the Surveillance Technology" },
  { field = "disparate_impact", heading = "Are any communities disproportionately impacted by Surveillance Technology" },
]

[adapters.somerville]
jurisdiction = "somerville"
agency = "City of Somerville"
ordinance_citation = "Somerville Code of Ordinances Chapter 10, Article VI (§10-66)"
ordinance_literals = ["10-66", "§ 10-66", "§10-66"]
enacting_body_literal = "City Council"
enacting_body = "Somerville City Council"
# The reviewed Legistar LegislationDetail page (GUID 11D1E64A-…, ID 7350978)
# attaches the six §10-66(b) annual-report PDFs as View.ashx file links
# (probed 2026-09-26 — HTTP 200, digital-native PDFs).
doc_url_contains = "view.ashx"
doc_suffixes = [".ashx"]
# The §10-66 questionnaire's own "Surveillance Technology:" field literal
# (the ShotSpotter filing reads "Surveillance Technology:  ShotSpotter").
technology_field_pattern = '(?im)surveillance\s+technology\s*:\s*[•\-–\*▪]?\s*([^\n•;]{2,80})'
# Fallback: the attachment's own anchor text names the technology
# ("Revised 2024 Surveillance Technology Annual Report ShotSpotter",
# "... Annual Report 2024 FLIR v2"). A bare-year residue (the combined
# "Annual Report 2024" filing) is dropped — a year is not a technology.
technology_anchor_pattern = '(?i)annual\s+report(?:\s+\d{4})?\s+(?P<tech>\S.*?)\s*(?:\s+v\d+)?$'
# The filings cite the ordinance as "§10-66" / "10-66".
legal_authority_pattern = '§\s*10-\d+|10-6\d'
# The §10-66(b) mandated annual-report questionnaire — the nine questions the
# ordinance requires each filing to answer (mandated != populated, F3.20);
# headings are the verbatim clause openings as filed.
mandated_sections = [
  { field = "use_description", heading = "A description of how surveillance technology has been used" },
  { field = "data_sharing", heading = "Whether and how often data acquired through the use of the surveillance technology was shared" },
  { field = "complaints", heading = "A summary of community complaints or concerns about the surveillance technology" },
  { field = "audits_violations", heading = "The results of any internal audits" },
  { field = "effectiveness", heading = "Whether the surveillance technology has been effective at achieving its identified purpose" },
  { field = "records_requests", heading = "The number of public records requests received by the city" },
  { field = "annual_costs", heading = "An estimate of the total annual costs for the surveillance technology" },
  { field = "civil_rights_impact", heading = "Whether the civil rights and liberties of any communities or groups" },
  { field = "new_agreements", heading = "A disclosure of any new agreements made in the past 12 months" },
]

# =============================================================================
# P36.8 / R11-ACQ-12 (I8 §5.5): the statutory ALPR-regime publishers.
#
# Ten state/federal publishers ride the same fail-closed machinery the CCOPS
# adapters use — every claim routes through disclosure_claim (genre gate,
# use-predicate guard, Part VIII aggregate schema). The statutory keys:
#
#   document_genre        reviewed fallback genre — applies ONLY when the
#                         capture's own text classifies to no genre; a
#                         text-derived genre always stands.
#   technology_mapped     opt-in: extracted technology literals pass through
#                         [technology_map]; an unmapped literal mints NO claim.
#   default_technology    the reviewed slug the filing class itself declares
#                         (validated against ontology/vocab/technology.yaml;
#                         never emitted AS a claim — it is the aggregate field
#                         and the filing-level typing only).
#   reports_use           the filing class is BY STATUTE a use report (MN BCA's
#                         "agencies that use" list; the Nebraska annual form).
#   reports_use_pattern   a verbatim literal whose presence in the document's
#                         own text is the use statement.
#   entries               page-carried registration/location rows: an "agency"
#                         row is a registration ASSERTION (inventory_entry —
#                         WA AGO did not verify them, I9a-C036); a "location"
#                         row is a published fixed-reader literal — a
#                         deployment_location disclosure_use where the filing
#                         reports use, verbatim, never geocoded (SIG-GEO-003).
#   field_patterns        reviewed literal -> disclosure-claim patterns.
#   use_fields            reviewed literal -> disclosure_use patterns; run ONLY
#                         where the filing reports use; the predicate must be
#                         a deployment predicate (validated).
#   agency_anchor_pattern derives the per-filing agency from the resolved
#                         index link's anchor text (Nebraska's per-agency PDFs).
#   scope_terms           the surveillance-relevance screen for broad mandated-
#                         report catalogues (MD DLS, VA RGA) — a link is
#                         admissible only when a scope term appears in its
#                         anchor or URL (surveillance-relevant entries only).
#
# Every source stays ingestion_permitted=false (HG-03 RB-03 `a`).

[adapters.wa_ago]
jurisdiction = "US-WA"
agency = "Washington State Office of the Attorney General"
ordinance_citation = "RCW 10.130 (Automated License Plate Reader System registration)"
ordinance_literals = ["RCW 10.130", "10.130", "ESSB 6002"]
enacting_body_literal = "Washington State Legislature"
enacting_body = "Washington State Legislature"
document_genre = "statutory_report"
technology_mapped = true
default_technology = "alpr-unspecified"
doc_url_contains = "/alpr"
doc_suffixes = [".pdf"]
# RCW 10.130.030 registers agencies that "operate or intend to operate" — a
# registration is an agency ASSERTION (the AGO states it does not verify the
# entries, I9a-C036), modelled as inventory_entry; no use_status — a
# registration is never a verified deployment.
entries = [
  { kind = "agency", pattern = '(?is)<li[^>]*class="registration"[^>]*>\s*<strong>(?P<agency>[^<]+)</strong>\s*(?:&mdash;|&#8212;|—|–|-)?\s*(?P<tech>ALPR(?:\s+system)?|automatic license plate reader(?:s)?)?', status = "registered" },
]
mandated_sections = []

[adapters.mn_bca]
jurisdiction = "US-MN"
agency = "Minnesota Bureau of Criminal Apprehension"
ordinance_citation = "Minn. Stat. § 13.824 (Automated License Plate Reader Data)"
ordinance_literals = ["13.824", "Minn. Stat. 13.824"]
enacting_body_literal = "Minnesota Legislature"
enacting_body = "Minnesota Legislature"
document_genre = "statutory_report"
technology_mapped = true
default_technology = "alpr-unspecified"
doc_url_contains = "/documents/"
doc_suffixes = [".pdf"]
# The statute's own list is a use statement — "agencies that use license plate
# readers" (Minn. Stat. 13.824 subd. 8(b)) — so agency rows carry use_status
# and the published fixed-location literals are deployment_location use
# claims keyed to the agency heading that precedes them. Location strings
# stay LITERALS — never geocoded in Round 11 (a new geometry lineage needs
# its own review, I8 §5.5).
reports_use = true
entries = [
  { kind = "agency", pattern = '(?is)<h3[^>]*class="agency"[^>]*>\s*(?P<agency>[^<]+?)\s*</h3>', status = "reported_in_use", use_status = true, technology_literal = "LPR" },
  { kind = "location", pattern = '(?is)<li[^>]*class="fixed-location"[^>]*>\s*(?P<location>[^<]+?)\s*</li>', technology = "alpr-fixed" },
]
mandated_sections = []

[adapters.va_vsp]
jurisdiction = "US-VA"
agency = "Virginia Department of State Police"
ordinance_citation = "Code of Virginia § 2.2-5517 (ALPR reporting requirements)"
ordinance_literals = ["2.2-5517", "§ 2.2-5517"]
enacting_body_literal = "Virginia General Assembly"
enacting_body = "Virginia General Assembly"
document_genre = "statutory_report"
technology_mapped = true
default_technology = "alpr-unspecified"
technology_field_pattern = '(?im)technology\s*:\s*(ALPR|automated\s+license\s+plate\s+readers?|automatic\s+license\s+plate\s+readers?|automated\s+license\s+plate\s+recognition|license\s+plate\s+readers?|license\s+plate\s+recognition|ANPR|LPR|facial\s+recognition|UAS|drones?)'
legal_authority_pattern = '2\.2-5517'
# The reporting spec's own required metrics — recorded as mandated-field
# states (answered / present_but_empty / absent), never a populated value.
mandated_sections = [
  { field = "cameras_by_type", heading = "Cameras owned or leased by type" },
  { field = "queries", heading = "Queries conducted" },
  { field = "stops", heading = "Stops initiated" },
]

[adapters.va_vscc]
jurisdiction = "US-VA"
agency = "Virginia State Crime Commission"
ordinance_citation = "Code of Virginia § 2.2-5517 (ALPR reporting requirements)"
ordinance_literals = ["2.2-5517", "§ 2.2-5517"]
enacting_body_literal = "Virginia General Assembly"
enacting_body = "Virginia General Assembly"
document_genre = "statutory_report"
technology_mapped = true
default_technology = "alpr-unspecified"
technology_field_pattern = '(?im)technology\s*:\s*(ALPR|automated\s+license\s+plate\s+readers?|automatic\s+license\s+plate\s+readers?|automated\s+license\s+plate\s+recognition|license\s+plate\s+readers?|license\s+plate\s+recognition|ANPR|LPR|facial\s+recognition|UAS|drones?)'
legal_authority_pattern = '2\.2-5517|Virginia\s+State\s+Crime\s+Commission'
# The VSCC update reports agency use (surveyed query counts, approved
# systems) — the use predicates emit only where the report's own text
# carries the use literal.
reports_use_pattern = '(?i)queries\s+conducted|in\s+use\s+by|operating\s+(?:ALPR|license\s+plate)'
use_fields = [
  { predicate = "usage_count", pattern = '(?im)queries?\s+conducted\s*[:\-]?\s*(?P<value>[\d,]+)' },
]
field_patterns = [
  { predicate = "vendor_name", pattern = '(?i)(?P<value>Flock Safety|Vigilant Solutions|Thomson Reuters CLEAR|Motorola Solutions)' },
  { predicate = "retention_period", pattern = '(?i)for\s+no\s+more\s+than\s+(?P<value>\d+[ \t]+hours|\d+[ \t]+days)' },
]
mandated_sections = []

[adapters.ne_crime]
jurisdiction = "US-NE"
agency = "Nebraska Commission on Law Enforcement and Criminal Justice"
ordinance_citation = "Neb. Rev. Stat. § 60-3206 (ALPR Privacy Act — annual report)"
ordinance_literals = ["60-3206", "ALPR Privacy Act"]
enacting_body_literal = "Nebraska Legislature"
enacting_body = "Nebraska Legislature"
document_genre = "statutory_report"
technology_mapped = true
default_technology = "alpr-unspecified"
doc_url_contains = "/alpr-reports/"
doc_suffixes = [".pdf"]
# Each per-agency filing names its agency in the index link's anchor
# ("Bellevue Police Department — 2024 ALPR Report") — the reviewed pattern
# derives the agency, never the publisher name.
agency_anchor_pattern = '(?i)^(?P<agency>.+?)\s*(?:—|–|-)\s*\d{4}\s+ALPR'
# The filed form names its own agency ("Agency: <name>") — the reviewed
# field literal when the document itself carries it.
agency_field_pattern = '(?im)agency\s*:\s*([^\n]{2,80})'
# The filed form is BY STATUTE the annual use report — only agencies that
# use ALPRs file under 60-3206(3)(a); the count literals the form carries
# are measured-use claims.
reports_use = true
technology_field_pattern = '(?im)technology\s*:\s*(ALPR|automated\s+license\s+plate\s+readers?|automatic\s+license\s+plate\s+readers?|automated\s+license\s+plate\s+recognition|license\s+plate\s+readers?|license\s+plate\s+recognition|ANPR|LPR|facial\s+recognition|UAS|drones?)'
legal_authority_pattern = '60-3206|ALPR\s+Privacy\s+Act'
field_patterns = [
  { predicate = "retention_period", pattern = '(?im)data\s+retention\s*[:\-]?\s*(?P<value>[^\n]{3,60})' },
  { predicate = "sharing_partner", pattern = '(?im)data\s+shared\s+with\s*[:\-]?\s*(?P<value>[^\n]{3,60})' },
]
use_fields = [
  { predicate = "usage_count", pattern = '(?im)confirmed\s+non-?correlated\s+matches?\s*[:\-]?\s*(?P<value>[\d,]+)' },
  { predicate = "usage_count", pattern = '(?im)manual\s+entries\s*[:\-]?\s*(?P<value>[\d,]+)' },
]
mandated_sections = []

[adapters.vt_dps]
jurisdiction = "US-VT"
agency = "Vermont Department of Public Safety"
ordinance_citation = "23 V.S.A. § 1607 (Automated License Plate Recognition — annual report)"
ordinance_literals = ["23 V.S.A.", "1607", "§ 1607"]
enacting_body_literal = "Vermont General Assembly"
enacting_body = "Vermont General Assembly"
document_genre = "statutory_report"
technology_mapped = true
default_technology = "alpr-unspecified"
technology_field_pattern = '(?im)technology\s*:\s*(ALPR|automated\s+license\s+plate\s+readers?|automatic\s+license\s+plate\s+readers?|automated\s+license\s+plate\s+recognition|license\s+plate\s+readers?|license\s+plate\s+recognition|ANPR|LPR|facial\s+recognition|UAS|drones?)'
legal_authority_pattern = '23\s+V\.?S\.?A\.?\s*§?\s*1607'
# The DPS report names its operating agencies and reports query counts —
# the agency rows ride the same `entries` mechanism the index pages use,
# the query literal is a measured-use claim where the report carries it.
reports_use_pattern = '(?i)queries?\s+conducted|operating\s+agencies'
use_fields = [
  { predicate = "usage_count", pattern = '(?im)queries?\s+conducted\s*[:\-]?\s*(?P<value>[\d,]+)' },
]
entries = [
  { kind = "agency", pattern = '(?im)^\s*•\s*(?P<agency>[A-Z][^\n•;]{2,80}(?:Police|Sheriff|Constab|Department|Agency|Barracks)[^\n•;]*)', status = "reported_operating", use_status = true },
]
# The DPS report's per-agency table lives IN the filing — document_entries
# lets the `entries` mechanism run over a document's bytes (index-page
# adapters leave it off so resolved filings never re-fire page rows).
document_entries = true
mandated_sections = []

[adapters.il_isp]
jurisdiction = "US-IL"
agency = "Illinois State Police"
