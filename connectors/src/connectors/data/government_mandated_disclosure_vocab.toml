# SPDX-License-Identifier: Apache-2.0
# The versioned `government_mandated_disclosure` connector vocabulary
# (§22.6 H3 / SIG-INGEST-049*, P24.7 / CCOPS.1 / GL-CCOPS-01).
#
# This table is DATA, not code (SIG-ENG-001): the source-class registration
# (SIG-INGEST-049), the depth-not-breadth scope numbers (SIG-INGEST-049a), the
# claim-type set and the genre -> permitted-claim-type gate (the mechanical form
# of the procured != deployed rule), the predicate allowlist (the SIG-INGEST-049b
# dossier field list), the per-agency aggregate schema gate (Part VIII), and the
# field-state vocabulary (mandated != populated) are data rows reviewed on their
# own. Changes after P24.7 are VERSIONED MIGRATIONS (§20): bump `vocab_version`
# and add the change, never silently rewrite a row.
#
# NOTE ON TOML ORDERING: every top-level key MUST appear ABOVE the first [table]
# header — otherwise TOML nests it under that table.

# The connector's own vocabulary version, stamped onto every run (§20).
# 2026.09.17 — P25.5: added [adapters.*] — the reviewed per-source index→document
# discovery specs and mandated-section lists the live extraction adapter reads.
# 2026.09.26 — P31.13 (BREADTH.2): +[sources] oakland / cambridge / somerville
# and their [adapters.*] — reviewed index→document specs for the Oakland PAC
# filing index, the Cambridge LegiFile annual surveillance report attachment,
# and the Somerville Legistar §10-66 annual-report attachments; the new adapter
# keys `technology_field_pattern` / `technology_field_multi` /
# `technology_anchor_pattern` / `legal_authority_pattern` carry the reviewed
# field-literal, anchor-literal and citation patterns these municipalities'
# filings actually use.
vocab_version = "2026.09.26"

# The five claim types the connector may emit. `disclosure_use` is the
# epistemically-loaded one: it may be asserted ONLY where the disclosure itself
# reports actual use (a deployment-genre document, or a mandated inventory that
# reports an in-use status — the legally compelled statement of use, never an
# inference). `compliance_finding` carries the non-compliance metric
# (SIG-INGEST-049e). An authorization/procurement status NEVER yields
# `disclosure_use` — procured != deployed.
claim_types = [
  "ordinance",
  "inventory_entry",
  "disclosure",
  "disclosure_use",
  "compliance_finding",
]

# The genres from which a `disclosure_use` / `compliance_finding` claim may be
# asserted unconditionally. Mirrors parsing.genre.DEPLOYMENT_GENRES; a test
# asserts the two stay in lock-step.
deployment_genres = ["deployment_report"]

# The genres that can NEVER evidence actual use, however labelled: a procurement
# record evidences a purchase and a vendor disclosure evidences a product — a
# mandated-disclosure row asserting `in_use` from either is the procured->
# deployed over-inference this connector refuses (RISK-P21-16 applied to the
# CCOPS class).
never_use_genres = ["procurement_record", "vendor_disclosure"]

# The predicate allowlist enforced as a hard schema gate (SIG-INGEST-033): the
# connector may write ONLY these predicates — the SIG-INGEST-049b dossier field
# list plus the ordinance/inventory/compliance surface. Writing anything else is
# a schema error — the D6 admissibility filter enforced at ingest (§10.5).
predicate_allowlist = [
  # ordinance facts (the legal instrument the disclosure is mandated by)
  "ordinance_citation",
  "enacting_body",
  "oversight_body",
  "effective_date",
  "reporting_cadence",
  # inventory-entry facts (a technology's status in the mandated inventory)
  "technology",
  "technology_category",
  "approval_status",
  "vendor_name",
  "product_name",
  "policy_status",
  "pilot_status",
  "deprecation_reason",
  # disclosed field facts — the SIG-INGEST-049b dossier fields, recorded as
  # COMMITMENTS / declared facts (retention, audit, partners, cost, subsidy,
  # signage, access, training, disparate impact, legal authority)
  "retention_period",
  "audit_mechanism",
  "sharing_partner",
  "acquisition_cost",
  "operating_cost",
  "vendor_subsidy",
  "signage_visibility",
  "data_access",
  "training",
  "disparate_impact",
  "legal_authority",
  # the mandated != populated distinction: records that a mandated field was
  # `present_but_empty` or `absent` in this filing (never a fabricated value)
  "disclosure_field_state",
  # measured-use facts (disclosure_use claims ONLY — the use predicates)
  "in_use",
  "usage_count",
  "complaint_count",
  "deployment_location",
  "effectiveness_claim",
  # the non-compliance metric (SIG-INGEST-049e)
  "in_use_without_policy_count",
  "policy_compliance_share",
  # an upstream document capture recorded as an EvidenceArtifact (§10.2) —
  # provenance + P07.1 verdict only; the bytes are never re-hosted
  "document",
  "non_compliance_finding",
]

# The use predicates: any claim carrying one of these MUST be a `disclosure_use`
# claim, and (via the document gate) may only come from a disclosure that reports
# actual use. This is the second, predicate-level guard behind procured!=deployed.
deployment_predicates = [
  "in_use",
  "usage_count",
  "complaint_count",
  "deployment_location",
  "effectiveness_claim",
]

# The inventory statuses that disclose actual use. Every other status
# (`approved_policy`, `draft_policy_reviewed`, `seeking_procurement_or_pilot`,
# `deprecated`) is an authorization/procurement status — never use evidence.
in_use_statuses = ["in_use", "in_use_without_approved_policy"]

# The field-state vocabulary — mandated != populated (F3.20): a mandated
# questionnaire field is `answered`, `present_but_empty` (the row exists but the
# city left it blank — e.g. Seattle's unfilled Fiscal 1.1/1.2 tables), or
# `absent` (the field is not in the filing). The three are kept distinct and are
# never conflated with an answer.
field_states = ["answered", "present_but_empty", "absent"]

# The genre -> permitted claim-types gate. A document of genre G may only produce
# claims whose type is in the list. `disclosure_use`/`compliance_finding` appear
# ONLY under deployment_report — the other genres may yield the
# ordinance/inventory/disclosure surface but never a use or compliance claim.
[genre_claim_types]
procurement_record = ["inventory_entry", "disclosure"]
vendor_disclosure  = ["inventory_entry", "disclosure"]
agenda_minutes     = ["ordinance", "inventory_entry", "disclosure"]
policy_document    = ["ordinance", "inventory_entry", "disclosure"]
deployment_report  = ["ordinance", "inventory_entry", "disclosure", "disclosure_use", "compliance_finding"]

# The per-agency AGGREGATE row schema gate (Part VIII / §18.1-analogue). Every
# emitted claim MUST carry `agency` + `reporting_period`; `technology` is
# required for every claim type except `ordinance` (a jurisdiction-scoped fact).
# `aggregate_level` is stamped `agency_technology_period` — the disclosure's own
# granularity. The forbidden columns + tokens are the schema property that makes
# "no person-level or non-aggregate CCOPS data" mechanical, not a policy note.
[aggregate]
required_fields = ["agency", "reporting_period"]
technology_exempt_claim_types = ["ordinance"]
aggregate_level = "agency_technology_period"
# Column names / substrings that MUST NEVER appear on an emitted row: a plate, a
# person, a per-search/per-incident id, an officer or user identity, a raw
# per-event timestamp, a device serial. A claim carrying any of these would be
# exactly the person-level / non-aggregate leak Part VIII forbids.
forbidden_output_columns = [
  "plate", "plate_hash", "license_plate",
  "person", "person_name", "individual",
  "search_id", "incident_id", "case_id", "trip_id",
  "officer", "officer_name", "user_name", "badge",
  "device_serial", "imei",
  "searched_at", "event_timestamp",
  "home_address",
]
# Content tokens refused in a predicate id or a raw value (§0.7 / §43.2,
# RISK-P0-08): the disclosure emits institutional aggregate facts ONLY.
forbidden_tokens = [
  "license plate", "licence plate", "plate number", "license_plate", "plate_number",
  "per-person", "per_person", "per person",
  "per-trip", "per_trip", "per trip",
  "travel history", "travel_history", "individual travel",
  "per-search", "per_search", "per search", "hotlist hit", "hotlist_hit",
  "home address", "home_address",
]
# Predicate ids that NAME a natural person — refused outright (the officer-naming
# gate's no-publish default applied at ingest; the connector never emits one).
person_naming_predicates = ["officer_name", "person_name", "individual_name", "named_individual"]

# SIG-INGEST-049 — the source class registration. Municipal
# surveillance-ordinance disclosures are their own source class, distinct from
# both `civil_society_dataset` and `vendor_portal`. `licence: public record` is
# the CLASS posture (these are statutorily published municipal records); the
# per-source SPDX stays UNDETERMINED until a rights packet + operator flip
# (HG-03) — the export gate fails closed (SIG-LIC-004).
[source_class]
name = "government_mandated_disclosure"
licence = "public record"
format = "pdf"
extraction = "document_pipeline"
distinct_from = ["civil_society_dataset", "vendor_portal"]

# SIG-INGEST-049a — depth, not breadth, with the honest numbers carried (F3.19 /
# F3.27): ~26 jurisdictions ≈ 5% of the US population and ~0.14% of US
# law-enforcement agencies; ZERO publish machine-readable output; the canonical
# national list is a JPEG on the ACLU page (revised 2024-11); vocabularies,
# cadences and scopes differ per city; at least one city runs months past its
# statutory deadline; at least one blocks automated access. It will never be a
# national picture — its highest use is calibration, not coverage (049d).
[scope]
jurisdictions = 26
us_population_share = 0.05
us_agency_share = 0.0014
machine_readable_outputs = 0
canonical_list = "ACLU CCOPS national map (JPEG only, revised 2024-11)"
registry_row_cap = 26
note = "depth, not breadth — a curated document corpus, never a national picture; highest value is calibration against a legally compelled disclosure (SIG-INGEST-049a/049d)"

# The registry source each paying source adapter draws its fixtures from
# (SIG-INGEST-049c): Seattle (quarterly + the fixed 50-field SIR), NYC POST Act
# (42 policies on a stable URL pattern), SF Chapter 19B (biannual citywide
# inventory with a compliance metric). All stay ingestion_permitted=false until
# a rights packet + operator flip (HG-03); a live run REFUSES at the gate.
[sources]
seattle = "ccops_seattle"
nyc_post = "ccops_nyc_post"
sf = "ccops_sf"
# P31.13 (BREADTH.2): the three further CCOPS municipalities whose P29.3
# GL-GATE-07 rights packets flipped (LicenseRef-PublicRecord-FactualCompilation).
# Each runs the same index→document adapter; the reviewed per-source specs
# below carry the municipality's real link shapes, citation literals, and the
# mandated-questionnaire fields its ordinance's annual report is legally
# required to answer.
oakland = "ccops_oakland"
cambridge = "ccops_cambridge"
somerville = "ccops_somerville"

# --- P25.5: per-source index→document adapter specs (reviewed data) ------------
#
# Each CCOPS index page is the discovery surface for its mandated filings. The
# adapter extracts <a href> links from the captured index, keeps the ones
# matching the spec below (same host, url_contains, suffixes), and resolves them
# into bounded `disclosure_document` targets. `ordinance_literals` are the
# ordinance-citation literals expected on the index page (an index-page claim
# cites the literal verbatim with a byte-range locator). `mandated_sections`
# are the POST Act IUP field schema (the legally required sections of a NYC
# impact & use policy) — each yields a `disclosure_field_state` claim recording
# answered / present_but_empty / absent (mandated != populated, F3.20).

[adapters.seattle]
jurisdiction = "seattle"
agency = "City of Seattle"
ordinance_citation = "Seattle Municipal Code 14.18 (Surveillance Ordinance)"
ordinance_literals = ["SMC 14.18", "Chapter 14.18", "14.18", "Surveillance Ordinance"]
enacting_body_literal = "Seattle City Council"
enacting_body = "Seattle City Council"
doc_url_contains = "/documents/"
doc_suffixes = [".pdf"]
mandated_sections = []

[adapters.nyc_post]
jurisdiction = "nyc"
agency = "New York City Police Department"
ordinance_citation = "NYC Administrative Code § 14-189 (POST Act)"
ordinance_literals = ["POST Act", "Public Oversight of Surveillance Technology"]
enacting_body_literal = "New York City Council"
enacting_body = "New York City Council"
doc_url_contains = "/post-final/"
doc_suffixes = [".pdf"]
# The IUP filename slug: "<technology>-nypd-impact-and-use-policy[_*].pdf" — the
# technology name precedes this marker (used when the title heading is absent).
technology_filename_marker = "-nypd-impact-and-use-policy"
# The POST Act IUP field schema — the sections the statute requires a policy to
# carry. Section state is recorded; a literal value is emitted only where the
# document's own text supplies it (never fabricated).
mandated_sections = [
  { field = "capabilities", heading = "CAPABILITIES OF THE TECHNOLOGY" },
  { field = "rules_of_use", heading = "RULES, PROCESSES & GUIDELINES" },
  { field = "safeguards", heading = "SAFEGUARD & SECURITY MEASURES" },
  { field = "retention_access_use", heading = "RETENTION, ACCESS & USE" },
  { field = "public_access", heading = "PUBLIC ACCESS OR USE" },
  { field = "external_entities", heading = "EXTERNAL ENTITIES" },
  { field = "training", heading = "TRAINING" },
  { field = "audit_oversight", heading = "INTERNAL AUDIT & OVERSIGHT" },
  { field = "health_safety", heading = "HEALTH & SAFETY REPORTING" },
  { field = "disparate_impacts", heading = "DISPARATE IMPACTS" },
]

[adapters.sf]
jurisdiction = "sf"
agency = "City and County of San Francisco"
ordinance_citation = "San Francisco Administrative Code Chapter 19B (Acquisition of Surveillance Technology)"
ordinance_literals = ["Chapter 19B", "19B"]
enacting_body_literal = "Board of Supervisors"
enacting_body = "San Francisco Board of Supervisors"
doc_url_contains = "/documents/"
doc_suffixes = [".pdf"]
mandated_sections = []

# --- P31.13 (BREADTH.2): Oakland / Cambridge / Somerville ----------------------
# Reviewed 2026-09-26 against the live index surfaces (P29.3 rights packets,
# LicenseRef-PublicRecord-FactualCompilation). All three publish their mandated
# filings the way Seattle/SF do — an index page whose <a href> links are the
# discovery surface; the adapter spec below is the reviewed window per city.

[adapters.oakland]
jurisdiction = "oakland"
agency = "Oakland Police Department"
ordinance_citation = "Oakland Municipal Code Chapter 9.64 (Surveillance Technology Ordinance)"
ordinance_literals = ["OMC 9.64", "Chapter 9.64", "9.64", "Surveillance Technology Ordinance"]
enacting_body_literal = "City Council"
enacting_body = "Oakland City Council"
# The Privacy Advisory Commission index links every filing under
# /files/assets/.../documents/pac/*.pdf — the ordinance itself plus the
# mandated <technology> Annual Report (YYYY) filings (probed 2026-09-26).
doc_url_contains = "/documents/pac/"
doc_suffixes = [".pdf"]
# The annual-report anchors name the technology verbatim:
# "Automated License Plate Reader Annual Report (2019)(PDF, 226KB)",
# "Shotspotter Annual Report (2020)", "Mobile ID Annual Report (2020)". The
# captured literal rides raw_value verbatim; a name colliding with a Part VIII
# forbidden token (the ALPR filings literally say "license plate") is suppressed
# at the claim surface and recorded on the artifact — never dropped silently.
technology_anchor_pattern = '(?i)^\s*(?P<tech>\S.*?)\s+annual\s+report\b'
# Oakland filings cite the ordinance as "Oakland Municipal Code (OMC) 9.64".
legal_authority_pattern = '(?:Oakland\s+Municipal\s+Code|O\.?M\.?C\.?)[^\n]{0,10}9\.64|Chapter\s+9\.64'
# Oakland annual reports are memoranda, not a fixed questionnaire — no mandated
# field schema to score populated/absent against.
mandated_sections = []

[adapters.cambridge]
jurisdiction = "cambridge"
agency = "City of Cambridge"
ordinance_citation = "Cambridge Municipal Code Chapter 2.128 (Surveillance Technology)"
ordinance_literals = ["Chapter 2.128", "2.128"]
enacting_body_literal = "City Council"
enacting_body = "Cambridge City Council"
# The reviewed LegiFile detail page (ID=18518) attaches the combined annual
# surveillance report via a FileOpen.aspx link (probed 2026-09-26 — HTTP 200,
# digital-native PDF, 78 pages of per-department questionnaires).
doc_url_contains = "fileopen.aspx"
doc_suffixes = [".aspx"]
# The filing's own questionnaire field — the combined citywide report repeats
# "Surveillance Technology: <name>" once per department filing; multi captures
# each declared technology (one `technology` disclosure claim per literal).
technology_field_pattern = '(?im)surveillance\s+technology\s*:\s*[•\-–\*▪]?\s*([^\n•;]{2,80})'
technology_field_multi = true
# The report cites its mandate as "Chapter 2.128" of the municipal code.
legal_authority_pattern = 'Chapter\s+2\.128|§\s*2\.128'
# The Chapter 2.128 mandated annual-report questionnaire — the eight questions
# the filing is legally required to answer (mandated != populated, F3.20); the
# combined report repeats them once per department and the first occurrence's
# state is recorded per filing.
mandated_sections = [
  { field = "technologies_used", heading = "What Surveillance Technologies has the department used in the last year" },
  { field = "data_sharing", heading = "Has any Surveillance Technology data been shared with a third-party" },
  { field = "complaints", heading = "What complaints (if any) has your department received about Surveillance Technology" },
  { field = "policy_violations", heading = "Were any violations of the Surveillance Use Policy found in the last year" },
  { field = "effectiveness", heading = "Has Surveillance Technology been effective in achieving its identified purpose" },
  { field = "records_requests", heading = "Did the department receive any public records requests concerning Surveillance Technology" },
  { field = "annual_costs", heading = "What were the total annual costs of the Surveillance Technology" },
  { field = "disparate_impact", heading = "Are any communities disproportionately impacted by Surveillance Technology" },
]

[adapters.somerville]
jurisdiction = "somerville"
agency = "City of Somerville"
ordinance_citation = "Somerville Code of Ordinances Chapter 10, Article VI (§10-66)"
ordinance_literals = ["10-66", "§ 10-66", "§10-66"]
enacting_body_literal = "City Council"
enacting_body = "Somerville City Council"
# The reviewed Legistar LegislationDetail page (GUID 11D1E64A-…, ID 7350978)
# attaches the six §10-66(b) annual-report PDFs as View.ashx file links
# (probed 2026-09-26 — HTTP 200, digital-native PDFs).
doc_url_contains = "view.ashx"
doc_suffixes = [".ashx"]
# The §10-66 questionnaire's own "Surveillance Technology:" field literal
# (the ShotSpotter filing reads "Surveillance Technology:  ShotSpotter").
technology_field_pattern = '(?im)surveillance\s+technology\s*:\s*[•\-–\*▪]?\s*([^\n•;]{2,80})'
# Fallback: the attachment's own anchor text names the technology
# ("Revised 2024 Surveillance Technology Annual Report ShotSpotter",
# "... Annual Report 2024 FLIR v2"). A bare-year residue (the combined
# "Annual Report 2024" filing) is dropped — a year is not a technology.
technology_anchor_pattern = '(?i)annual\s+report(?:\s+\d{4})?\s+(?P<tech>\S.*?)\s*(?:\s+v\d+)?$'
# The filings cite the ordinance as "§10-66" / "10-66".
legal_authority_pattern = '§\s*10-\d+|10-6\d'
# The §10-66(b) mandated annual-report questionnaire — the nine questions the
# ordinance requires each filing to answer (mandated != populated, F3.20);
# headings are the verbatim clause openings as filed.
mandated_sections = [
  { field = "use_description", heading = "A description of how surveillance technology has been used" },
  { field = "data_sharing", heading = "Whether and how often data acquired through the use of the surveillance technology was shared" },
  { field = "complaints", heading = "A summary of community complaints or concerns about the surveillance technology" },
  { field = "audits_violations", heading = "The results of any internal audits" },
  { field = "effectiveness", heading = "Whether the surveillance technology has been effective at achieving its identified purpose" },
  { field = "records_requests", heading = "The number of public records requests received by the city" },
  { field = "annual_costs", heading = "An estimate of the total annual costs for the surveillance technology" },
  { field = "civil_rights_impact", heading = "Whether the civil rights and liberties of any communities or groups" },
  { field = "new_agreements", heading = "A disclosure of any new agreements made in the past 12 months" },
]
