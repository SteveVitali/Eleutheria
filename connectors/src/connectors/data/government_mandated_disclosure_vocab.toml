# --- P31.13 (BREADTH.2): Oakland / Cambridge / Somerville ----------------------
# Reviewed 2026-09-26 against the live index surfaces (P29.3 rights packets,
# LicenseRef-PublicRecord-FactualCompilation). All three publish their mandated
# filings the way Seattle/SF do — an index page whose <a href> links are the
# discovery surface; the adapter spec below is the reviewed window per city.

[adapters.oakland]
jurisdiction = "oakland"
agency = "Oakland Police Department"
ordinance_citation = "Oakland Municipal Code Chapter 9.64 (Surveillance Technology Ordinance)"
ordinance_literals = ["OMC 9.64", "Chapter 9.64", "9.64", "Surveillance Technology Ordinance"]
enacting_body_literal = "City Council"
enacting_body = "Oakland City Council"
# The Privacy Advisory Commission index links every filing under
# /files/assets/.../documents/pac/*.pdf — the ordinance itself plus the
# mandated <technology> Annual Report (YYYY) filings (probed 2026-09-26).
doc_url_contains = "/documents/pac/"
doc_suffixes = [".pdf"]
# The annual-report anchors name the technology verbatim:
# "Automated License Plate Reader Annual Report (2019)(PDF, 226KB)",
# "Shotspotter Annual Report (2020)", "Mobile ID Annual Report (2020)". The
# captured literal rides raw_value verbatim; a name colliding with a Part VIII
# forbidden token (the ALPR filings literally say "license plate") is suppressed
# at the claim surface and recorded on the artifact — never dropped silently.
technology_anchor_pattern = '(?i)^\s*(?P<tech>\S.*?)\s+annual\s+report\b'
# Oakland filings cite the ordinance as "Oakland Municipal Code (OMC) 9.64".
legal_authority_pattern = '(?:Oakland\s+Municipal\s+Code|O\.?M\.?C\.?)[^\n]{0,10}9\.64|Chapter\s+9\.64'
# Oakland annual reports are memoranda, not a fixed questionnaire — no mandated
# field schema to score populated/absent against.
mandated_sections = []

[adapters.cambridge]
jurisdiction = "cambridge"
agency = "City of Cambridge"
ordinance_citation = "Cambridge Municipal Code Chapter 2.128 (Surveillance Technology)"
ordinance_literals = ["Chapter 2.128", "2.128"]
enacting_body_literal = "City Council"
enacting_body = "Cambridge City Council"
# The reviewed LegiFile detail page (ID=18518) attaches the combined annual
# surveillance report via a FileOpen.aspx link (probed 2026-09-26 — HTTP 200,
# digital-native PDF, 78 pages of per-department questionnaires).
doc_url_contains = "fileopen.aspx"
doc_suffixes = [".aspx"]
# The filing's own questionnaire field — the combined citywide report repeats
# "Surveillance Technology: <name>" once per department filing; multi captures
# each declared technology (one `technology` disclosure claim per literal).
technology_field_pattern = '(?im)surveillance\s+technology\s*:\s*[•\-–\*▪]?\s*([^\n•;]{2,80})'
technology_field_multi = true
# The report cites its mandate as "Chapter 2.128" of the municipal code.
legal_authority_pattern = 'Chapter\s+2\.128|§\s*2\.128'
# The Chapter 2.128 mandated annual-report questionnaire — the eight questions
# the filing is legally required to answer (mandated != populated, F3.20); the
# combined report repeats them once per department and the first occurrence's
# state is recorded per filing.
mandated_sections = [
  { field = "technologies_used", heading = "What Surveillance Technologies has the department used in the last year" },
  { field = "data_sharing", heading = "Has any Surveillance Technology data been shared with a third-party" },
  { field = "complaints", heading = "What complaints (if any) has your department received about Surveillance Technology" },
  { field = "policy_violations", heading = "Were any violations of the Surveillance Use Policy found in the last year" },
  { field = "effectiveness", heading = "Has Surveillance Technology been effective in achieving its identified purpose" },
  { field = "records_requests", heading = "Did the department receive any public records requests concerning Surveillance Technology" },
  { field = "annual_costs", heading = "What were the total annual costs of the Surveillance Technology" },
  { field = "disparate_impact", heading = "Are any communities disproportionately impacted by Surveillance Technology" },
]

