# --- P36.9a / R11-ACQ-13a (I8 §5.6): UAV + FRT statutory publishers -----------
# Five reviewed adapters on the P36.8 generalized schema. Same posture: every
# source stays ingestion_permitted=false; literals are reviewed surfaces from
# the acquisition records (I4-C005/C006/C100/C102/C103/C108, I9b-C053); the
# claims are institution-level aggregates only — no per-incident rows, no
# officer names (Part VIII / §43.4).

[adapters.co_frt]
jurisdiction = "US-CO"
# The statutory family row (C.R.S. 24-18-301..-309, SB22-113) — the filing
# agency derives from each link's anchor (the Arvada page names its own
# department); the publisher default stands for the page-level rows.
agency = "Arvada Police Department"
ordinance_citation = "C.R.S. § 24-18-301 to -309 (SB22-113 facial recognition accountability)"
ordinance_literals = ["24-18-301", "C.R.S. 24-18", "CRS § 24-18"]
enacting_body_literal = "Colorado General Assembly"
enacting_body = "Colorado General Assembly"
document_genre = "statutory_report"
technology_mapped = true
default_technology = "face-recognition-unspecified"
# The CivicPlus attachment path the reviewed page links its report through.
doc_url_contains = "documentcenter"
# The anchor names the filing agency then the report title —
# "Arvada Police Department — Facial Recognition Accountability Report 2025".
agency_anchor_pattern = '(?i)^(?P<agency>.+?)\s*(?:—|–|-)\s*(?:facial|FRS|FR\b)'
technology_anchor_pattern = '(?i)(?P<tech>facial\s+recognition|face\s+recognition|facial\s+rec\b|frs)'
# A filing carrying its own "Technology:" field literal is typed by it.
technology_field_pattern = '(?im)technology\s*:\s*(facial\s+recognition(?:\s+(?:system|technology))?|face\s+recognition|facial\s+rec\b|frs)'
legal_authority_pattern = '24-18-30\d|SB\s*22-113|C\.?R\.?S\.?\s*24-18'
# The accountability page carries the city's own yearly use statistics — the
# filing's own use statement gates the use claims (the audit's numbers, never
# an inference).
reports_use_pattern = '(?i)investigations?\s+(?:used|using)\s+facial\s+recognition|facial\s+recognition\s+(?:uses?|searches?)\s*[:\-]?\s*\d'
use_fields = [
  { predicate = "usage_count", pattern = '(?im)(?P<value>[\d,]+)\s+of\s+[\d,]+\s+investigations?\s+used\s+facial\s+recognition' },
]
field_patterns = [
  { predicate = "vendor_name", pattern = '(?i)(?P<value>Lumen|LexisNexis|Clearview AI|Colorado Information Sharing Consortium)' },
]
mandated_sections = []

