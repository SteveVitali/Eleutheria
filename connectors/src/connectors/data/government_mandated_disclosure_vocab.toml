technology_anchor_pattern = '(?i)(?:FY\d{4}\s+)?(?P<tech>ALPR|license\s+plate\s+readers?|automatic\s+license\s+plate\s+readers?)'
legal_authority_pattern = '625\s+ILCS|11-208\.3|Expressway\s+Camera\s+Act'
