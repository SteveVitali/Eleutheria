roster_key = "vigilant-data-driven-alpr"
spec_dataset = "Vigilant / Data Driven ALPR data"
dataset = "Data Driven - Automated License Plate Reader Data"
technology = "ALPR (vendor-neutral, historical)"
priority = "1 — also Phase 12"
mapping = "exact"
covers = ["eff_data_driven"]
registered_by = "P21.1-era registry (flipped GL-GATE-03 2026-09-15; data_driven connector P21.8)"
note = "The 2018 EFF/MuckRock Data Driven release — Vigilant ALPR usage + sharing reports."

