# sig.data-library-roster/1 — the §22.7 EFF Data Library specialist-dataset
# backlog (SIG-INGEST-041; P37.13, row 435). One [[entry]] per spec-roster row,
# in spec-table order; `spec_dataset` is the spec's dataset cell verbatim,
# `dataset` the entry's title on the Data Library index as enumerated by the
# 2026-11-07 discovery sweep (docs/build/reports/discovery-sweep/2026-11-07/).
# `covers` names the registry source id(s) in sources.toml that carry the
# entry — a roster row with no covering source fails the roster test
# (tests/connectors/test_data_library_roster.py). `registered_by` records which
# ticket registered the covering row; `mapping` is `exact` when the covering
# row is the same upstream artifact and `equivalent` when it is the same
# dataset from the authoritative upstream (the index links a mirror).
schema = "sig.data-library-roster/1"
index_source = "atlas_data_library"
index_url = "https://www.atlasofsurveillance.org/data-library"
spec_ref = "docs/2_canonical_design_spec.md §22.7 (SIG-INGEST-041)"

