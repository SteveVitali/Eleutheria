# sig.geometry-corrections/1 — P35.16 / R11-DATA-01 (F-322)
#
# The committed declaration of the F-322 geometry-defect groups: the seven
# groups whose stored camera point claims contradict their declared bounds.
# This file is the AUTHORIZATION for `sig-connectors geometry-corrections
# --apply` — a subject is corrected only under a row declared here (an
# out-of-scope flag is counted and reported, never written). The declared
# `expected_class` is the finding's headline class; the per-point detector
# still classifies each stored pair against the resolved declared bound,
# and the recorded class is whatever the detector derives.
#
#   extent       — optional target-level bound [min_lon, min_lat, max_lon,
#                  max_lat]; when absent the scope resolves the target's
#                  declared (jurisdiction_scheme, state) bound from
#                  jurisdiction_extents.toml.
#   rows_reported — the F-322 finding's reported count, for review
#                   reconciliation only (the live count is what the plan
#                   reads back, honestly).

schema = "sig.geometry-corrections/1"
finding = "F-322"
ticket = "P35.16"
manifest_row = "R11-DATA-01"

# --- group 1: Nottingham — the feed serves lat in the x slot (562 rows) ----
[[groups]]
group = "nottingham_axis_swap"
source_id = "camreg_nottingham_gb"
target_id = "nottingham_gb_cctv_cameras"
expected_class = "axis_swap"
extent = [-1.4, 52.8, -0.9, 53.1]
rows_reported = 562
note = "stored claims read x as lon on a lat-first feed; the transposed pair is the provable correction (the target now declares axis_order = 'lat-lon')"

