[adapters.aspi_mapping_chinas_tech_giants]
kind = "document"
# chinatechmap.aspi.org.au answers programmatic requests with a WAF 403 — from
# laptop egress AND from a GCP Cloud Run egress probe (2026-09-16, execution
# aspi-egress-probe: 403 text/html). The block is policy, not vantage; SIG does
# not defeat WAFs (SIG-INGEST-013). The page stays a document-capture target —
# disappearance recorded, no claims — until the posture changes or HG-04
# outreach yields a permitted surface (P25.7 d3).
