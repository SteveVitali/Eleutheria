# The versioned `coarse_international` connector vocabulary (§22.7, §52,
# SIG-ENG-036 / SIG-INGEST-042, P25.4). This table is DATA, not code
# (SIG-ENG-001): the predicate surface the connector may write, the aggregate-only
# forbidden-column tokens, and the per-source adapter specs (where each
# upstream's real data surface lives and how a changed shape fails loud) are data
# rows reviewed on their own. Changes are VERSIONED MIGRATIONS (§20) — bump
# `vocab_version` and add the change, never silently rewrite a row.
#
# NOTE ON TOML ORDERING: every top-level key MUST appear ABOVE the first [table]
# header — otherwise TOML nests it under that table.

# The connector's own vocabulary version, stamped onto every run (§20).
# 2026.09.16 — P25.4: the curated coarse-dataset adapters (the real upstream
# data surfaces): carnegie_ai_gsi embedded-dataset-page spec +
# facial_recognition_world_map linked-sheet spec; the predicate allowlist and
# aggregate-only forbidden-column tokens the curated rows route through.
vocab_version = "2026.09.16"

# The predicate allowlist the `coarse_international` connector may write
# (SIG-INGEST-033-analogue — typed claims only). A row carrying a predicate
# outside this set is refused at the ingest boundary, naming the offender.
coarse_predicate_allowlist = [
  # country-level (Carnegie AI GSI / FRWM / curated country rows)
  "uses_ai_surveillance",            # country is indexed as an AI-surveillance adopter
  "ai_surveillance_tech_from_china", # upstream flag: supplied by Chinese companies
  "ai_surveillance_tech_from_us",    # upstream flag: supplied by U.S. companies
  "smart_city_surveillance",         # upstream flag: "Smart City" / "safe city" sensors
  "uses_facial_recognition",         # upstream flag: facial recognition systems
  "smart_policing",                  # upstream flag: "Smart Policing" analytics
  "ai_surveillance_supplier",        # a company upstream names as relevant in-country
  "facial_recognition_status",       # FRWM per-country status enum
  # vendor-level (ASPI / curated vendor rows)
  "operates_in_country",             # vendor operates in country X (ISO code value)
]

# The FRWM upstream status literals -> the connector's normalized enum. The
# upstream's own labels are preserved verbatim in raw_value (P2); only the
# reviewed literal set maps — an unmapped literal is ContentDrift, never a guess.
# ("Monitored by Israel" is upstream's own term for the Palestine row.)

# Column-name tokens that mark a NON-aggregate (per-search/per-person) axis
# (RISK-P0-08 / SIG-INGEST-043-analogue): a live data surface carrying a column
# named with one of these is refused whole — the coarse datasets are
# country/vendor aggregates ONLY, never per-person, per-search, or per-device.
forbidden_column_tokens = [
  "person", "individual", "officer", "suspect",
  "search_id", "search_date", "search_time", "query",
  "plate", "license_plate", "vehicle",
  "device_id", "camera_id", "serial",
  "face_id", "biometric_id", "subject_name", "ssn",
  "latitude", "longitude", "address",
]

# --- the per-source adapter specs ([adapters.*], P25.4) ------------------------
#
# Each flipped coarse source's real data surface and its reviewed bounds. The
# `kind` selects the adapter:
#   embedded_dataset_page — the index page's <script src> list is the discovery
#     surface for the JS chunks; the chunk carrying `entry_marker` holds the
#     embedded dataset array (a client-rendered Next.js interactive).
#   sheet_dataset — the page links its full underlying dataset (a Google Sheet);
#     the per-sheet gviz CSV targets are reviewed seed targets; the page capture
#     must still carry `page_link_literal` or the shape has drifted.
#   document — the page is captured as provenance only (no reachable
#     machine-readable surface).

[adapters.carnegie_ai_gsi]
kind = "embedded_dataset_page"
# The index page's <script src> links under this path are the chunk candidates
# (same-host only, .js only, bounded). 28 observed on 2026-09-15.
script_src_contains = "/_next/static/chunks/"
script_src_suffix = ".js"
same_host = true
max_chunks = 48
# The embedded dataset array entries all carry this marker; the strict per-entry
# shape is {arrayItem:!0,chinese,city,country,description,facial,id,
# inactiveMapData,mapData,policing,us}. 75 entries observed 2026-09-15; a partial
# or malformed extraction is ContentDrift, never silent.
entry_marker = "{arrayItem:!0,"
min_entries = 60
# The upstream flag -> predicate map (the index's own layer semantics:
# chinese="Chinese Technology — countries using Chinese companies to supply
# their AI surveillance technology"; us="U.S. Technology" likewise;
# city="Smart City" safe-city sensors; facial="Facial Recognition Systems";
# policing="Smart Policing" analytics). Entry membership itself emits
# `membership_predicate`; each company named under the entry's "Relevant
# Companies" description field emits one `supplier_predicate` claim (verbatim
# name, "N/A" skipped — it is a non-value, not a company).
membership_predicate = "uses_ai_surveillance"
supplier_predicate = "ai_surveillance_supplier"
[adapters.carnegie_ai_gsi.flag_predicates]
chinese = "ai_surveillance_tech_from_china"
us = "ai_surveillance_tech_from_us"
city = "smart_city_surveillance"
facial = "uses_facial_recognition"
policing = "smart_policing"

[adapters.facial_recognition_world_map]
kind = "sheet_dataset"
# The map page (surfshark.com/facial-recognition-map) carries no per-country
# table — it links its compiled dataset. This literal is the page<->dataset
# binding; a page no longer carrying it is ContentDrift. The literal resolves to
# the Google Sheet `spreadsheet_id` below (docs.google.com robots Allow:
# /spreadsheet covers the gviz/tq CSV export route — verified 2026-09-16).
page_link_literal = "bit.ly/TheFacialRecognitionWorldMap"
spreadsheet_id = "157mTA67QAMxb0N4e7tO755r9uw2wsaT1z2rcCO1hPIU"
# The strict sheet contract: every per-continent sheet carries exactly this
# header; a changed column set is ContentDrift (fail closed, never guess).
expected_header = ["Country", "Facial recognition status", "Source 1", "Source 2", "Notes"]
status_predicate = "facial_recognition_status"
# The six per-continent sheets (gid -> name; the live CSV targets name these).
# Egypt appears on TWO sheets with disagreeing statuses — an upstream
# contradiction; both rows emit claims (contradictions stay visible, P3).
[adapters.facial_recognition_world_map.sheets]
"689675349" = "North America"
"520821635" = "South America"
"102380128" = "Europe"
"2060189382" = "Middle East & Central Asia"
"1320430692" = "Rest of Asia and Oceania"
"0" = "Africa"

[adapters.facial_recognition_world_map.status_map]
"In use" = "in_use"
"Approved for use (not implemented)" = "approved_not_implemented"
"Considering technology" = "considering"
"Banned" = "banned"
"No evidence of use" = "no_evidence"
"Monitored by Israel" = "monitored_by_israel"

