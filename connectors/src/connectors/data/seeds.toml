#
# Committed one-time seed assets (P25.7 / D-CCOPS.1-1, SIG-INGEST-049f). A seed
# is REVIEWED COMMITTED DATA, never a feed: `sig-connectors load-seed` serves
# the packaged bytes through the SAME eight-stage pipeline and the SAME loader
# gate as every source — the run-time in-memory permit flip the fixture path
# documents (SIG-INGEST-028: the registry row stays `ingestion_permitted=false`
# and no network is ever opened for a seed). The seed's `as_of` label is stamped
# on the loaded claims so the frozen-inventory date travels with the data.
#
# DATA, not code (SIG-ENG-001): registering a new seed is a data row here plus a
# packaged asset — never a code change.
#
# `asset`       — the packaged TOML under connectors/data/.
# `kind`        — the connector's target kind (which adapter parses the asset).
# `media_type`  — the asset's content type.
# `target_url`  — the upstream URL the committed asset stands in for (the seed's
#                 provenance — the capture's source_uri; never fetched).

[state_alpr_statute_inventory]
asset = "state_alpr_statute_seed.toml"
kind = "statute_seed"
media_type = "application/toml"
target_url = "https://www.ncsl.org/technology-and-communication/automated-license-plate-readers-state-statutes"

# The 2026 origin-verified refresh (P35.10 / I8 §4.4 / ACQ-06, F-374,
# I7-C9 [B-39] = a): a NEW committed asset beside the frozen 2022 seed —
# both stay registered and loadable (append-only). Every [[statutes]]
# entry is origin-cited from the committed I7 packets; the [[duty_rows]]
# 50-state table is the coverage/duty surface (SIG-INGEST-050). A
# compiled multi-origin asset has no single upstream URL — the target
# url is its committed-asset URN (never fetched).

[state_alpr_statute_inventory_2026]
asset = "state_alpr_statute_seed_2026.toml"
kind = "statute_seed"
media_type = "application/toml"
target_url = "urn:sig:seed:state-alpr-statute-2026"
