# `auth_model` free text — 'none*' first so a documented-keyless row stays
# `none`; key/token/jwt forms → `api_key`; credential names → `login`;
# session-bound → `session`. Environment-variable names never publish.

[[auth_model_map]]
contains = "none"
token = "none"

[[auth_model_map]]
contains = "api key"
token = "api_key"

[[auth_model_map]]
contains = "key"
token = "api_key"

[[auth_model_map]]
contains = "token"
token = "api_key"

[[auth_model_map]]
contains = "jwt"
token = "api_key"

[[auth_model_map]]
contains = "eid"
token = "login"

[[auth_model_map]]
contains = "login"
token = "login"

[[auth_model_map]]
contains = "session"
token = "session"
