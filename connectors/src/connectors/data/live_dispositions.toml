# GL-GATE-07 and promoted for their existing class connector. The connector wiring
# + live fetch + dedup-into-resolved was deferred under the OSM-land contention
# (D-R7.3-BREADTH). P31.12 (BREADTH.1) wired four of the eight —
# gao_surveillance_reports, dhs_oig_reports, dhs_fusion_center_assessments and
# uk_surveillance_camera_commissioner route through the `accountability`
# connector's targeted oversight-report path. P31.13 (BREADTH.2) wired the
# remaining four — ccops_oakland, ccops_cambridge and ccops_somerville route
# through `government_mandated_disclosure` (index_page → disclosure_document)
# and fema_hsgp_allocations through the `procurement` connector's federal-
# assistance award-search path — so all eight carry no disposition row (mapped
# sources carry none). D-R7.3-BREADTH is closed.
