# The 2026 state-ALPR-statute seed refresh (I8 §4.4 / ACQ-06, F-374,
# I7-C9 [B-39] answer `a` — "refresh the statute seed from origins").
# A NEW committed asset beside the frozen 2022 seed, which stays as it is
# (append-only, P7): `supersedes_asset` names the asset it refreshes; both
# stay registered and loadable through `sig-connectors load-seed`.
#
# Provenance discipline (C9 default a; I7 NEW-7): every [[statutes]] entry
# is verified at its own legislature/governor origin in the committed I7
# packets (docs/build/planning/2026-09-30-next-phase/data/
# candidates_consolidated.csv rows I7-U137, I7-U138, I7-U142…I7-U147,
# fetched live-read 2026-09-30). NCSL, LAPPA, GHSA and MultiState served
# as ENUMERATION AIDS ONLY — no entry and no claim cites them; an
# enumeration-aid host in `origin_url` is ContentDrift by contract.
# The 16 states the 2022 seed recorded keep that committed asset as their
# provenance (`statute_posture = "recorded"` below); they were not
# re-verified at origin in the I7 packet, so they are NOT re-asserted as
# 2026 seed entries — the coverage table records where each record lives.
#
# [[duty_rows]] is the 50-state per-state duty/coverage table the
# statute-check connector consumes (SIG-INGEST-050): `origin_verified`
# rows carry this seed's entries, `recorded` rows carry the superseded
# asset's, and `none_recorded` is ABSENCE OF EVIDENCE — never a "no
# statute exists" claim (the defining standard, §3.1).
#
# DATA, not code (SIG-ENG-001). Spine ingestion stays operator-gated:
# this committed asset is the seed; loading it into the claim spine
# happens on the Wave-A roll (P35.11) through `load-seed`.

