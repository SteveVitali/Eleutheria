# ===========================================================================
# ENUMERATED NON-TARGETS — recorded discovery outcomes, never fetched
# ===========================================================================
# Each row is a probed state 511/DOT camera surface that is NOT an active
# fetch target. `status` names the recorded outcome:
#   keyed_api            — endpoint exists but requires a key SIG does not hold
#                          (HG-09 operator credential act; no secret committed)
#   robots_unretrievable — robots.txt 5xx / unparseable / connection failure
#                          (SIG-INGEST-012: not granted → refused, recorded)
#   spa_shell            — host answers every path with an app shell, no public
#                          camera JSON located
#   not_found            — the probed camera endpoint 404s/500s
#   unreachable          — connection-level failure on probe
#   unresolved_rights    — located but no terms resolve under GL-GATE-06
#   access_restricted    — endpoint answered 401/403

