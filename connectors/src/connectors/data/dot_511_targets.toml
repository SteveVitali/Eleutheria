#
# The `dot_511` target registry (P26.7 / SOURCES.7) — the SOURCED ENUMERATION of
# state DOT / 511 traffic-camera registries. This table is DATA, not code
# (SIG-ENG-001): two row kinds —
#
#   [[targets]]     verified camera-registry endpoints belonging to a
#                   `dot_511_<state>` source row. The connector fetches the
#                   ArcGIS REST `query` document for the layer — registry rows
#                   (attributes + point geometry) only, NEVER an image/video URL
#                   named in them (Part VIII; see the vocab's media blocklist).
#   [[enumerated]]  discovery outcomes that are NOT fetchable targets — keyed
#                   APIs, robots-refused hosts, SPA shells, dead endpoints,
#                   unresolved-rights layers. Preserved loud so the enumeration
#                   never silently drops a refusal (SIG-INGEST-009/010).
#
# `enum_source` records where each endpoint was found (arcgis_hub_search item id,
# state open-data catalog, vendor-platform probe). `observed_*` fields are the
# 2026-09-17 live-probe facts the rights/robots decisions rest on.
#
# TOML ORDERING: every [[targets]] row precedes the [[enumerated]] section.

# ===========================================================================
# VERIFIED TARGETS — one per state source row (`dot_511_<st>`)
# ===========================================================================

