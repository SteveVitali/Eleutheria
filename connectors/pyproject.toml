[project]
name = "sig-connectors"
version = "0.0.0"
description = "SIG connectors package: the eight-stage connector framework, source registry, and ingestion gate (§21, §22)."
requires-python = ">=3.11"
# The connector framework (P04.1) is the substrate every source adapter plugs
# into: it gates on policy (rights/licensing/crawler conduct), archives through
# the evidence store, resolves entities via the resolution layer at link(), and
# maps run lineage onto the PROV-O projection in exports. All resolved from the
# workspace; none of these depend back on connectors (no cycle).
# sig-db and sig-parsing are added by P07.2: the `records` connector writes the
# no_responsive_records -> CoverageRecord bridge through db.absence (the canonical
# §9.5 coverage model, SIG-ONTO-040) and routes each released document through the
# P07.1 parser interface parsing.classification (§23.5 "calls the parser"). Both
# are leaf packages that never import connectors (no cycle).
# sig-reconcile is added by P11.1: the `flock_portal` connector lands its portal
# snapshots through the §29.7 snapshot-diff reconciler and its configured-sharing
# edges through the §29.3 sharing-edge reconciler (both owned by P08.2,
# SIG-RECON-045/034/035/036/037). reconcile depends only on sig-ontology + sig-db
# and never imports connectors, so there is no cycle.
dependencies = [
    "sig-policy",
    "sig-evidence",
    "sig-resolution",
    "sig-exports",
    "sig-db",
    "sig-parsing",
    "sig-reconcile",
]

[project.scripts]
sig-connectors = "connectors.cli:main"

[tool.uv.sources]
sig-policy = { workspace = true }
sig-evidence = { workspace = true }
sig-resolution = { workspace = true }
sig-exports = { workspace = true }
sig-db = { workspace = true }
sig-parsing = { workspace = true }
sig-reconcile = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectors"]
