[project]
name = "sig-connectors"
version = "0.0.0"
description = "SIG connectors package: the eight-stage connector framework, source registry, and ingestion gate (§21, §22)."
requires-python = ">=3.11"
# The connector framework (P04.1) is the substrate every source adapter plugs
# into: it gates on policy (rights/licensing/crawler conduct), archives through
# the evidence store, resolves entities via the resolution layer at link(), and
# maps run lineage onto the PROV-O projection in exports. All resolved from the
# workspace; none of these depend back on connectors (no cycle).
dependencies = ["sig-policy", "sig-evidence", "sig-resolution", "sig-exports"]

[project.scripts]
sig-connectors = "connectors.cli:main"

[tool.uv.sources]
sig-policy = { workspace = true }
sig-evidence = { workspace = true }
sig-resolution = { workspace = true }
sig-exports = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectors"]
