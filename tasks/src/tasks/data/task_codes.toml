# Per-type public handle codes, plain-language type labels and title templates —
# the K11 §3 registry file (P36.58 / R11-K13-RQ-01, SIG-RQ-001/003).
#
# `code`   — the one-token mnemonic the `T-<place>-<code>-<slug>-<hash>` handle
#            embeds ([a-z]{2,10}, unique across rows, K11 §3).
# `label`  — the plain-language type name the queue hub groups under (K11 §5.1).
# `title`  — the title template; `{subject}` is the subject's public label and
#            `{date}` the trigger's recorded date where one resolves. A row
#            whose placeholders cannot resolve falls back to
#            `<label>: <subject label>` — never a placeholder literal, never a
#            raw identifier (SIG-RQ-001/003, agent-drafted copy per K11 §16).
#
# `catalog_pending = true` marks a routing-table target type the §33.2 catalog
# has not yet registered (the loader admits the row only under this flag).
# P37.35 (RQ-02) landed `retention_unknown`/`sharing_unknown` as §33.2 rows
# 35/36 — no row is pending today; the flag stands for the next pending type.
#
# Changes after this declaration are VERSIONED (§20): bump `version`, never
# silently rewrite a landed row.

