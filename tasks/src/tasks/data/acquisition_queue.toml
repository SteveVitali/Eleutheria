# SPDX-License-Identifier: Apache-2.0
# The gap-driven reviewed acquisition queue (P32.11, §55.6, SIG-ACQ-001/002,
# ADR-130). This table is DATA, not code (SIG-ENG-001): every candidate is a row
# reviewed on its own. Provenance fields (URLs, accessed_on, review_status,
# novelty, claims, unknowns, effort, priority) come verbatim from the committed
# research inventory named below — they are LEADS, never review or permission.
#
# Invariants enforced by tasks.acquisition + tests:
#   * NO rights lane may carry `decision = "decided"` here without a recorded
#     decision_ref/decided_by/decided_on — the queue cannot mint approvals.
#     Seeding approves nothing.
#   * `municipal_publication` is an OBSERVATION, never a licence decision:
#     municipal/state publication is not auto-CC0.
#   * A candidate with `lineage_class` in {same_bytes, republished_document,
#     derived_summary, new_version, amends, response_to} must have I = 0 — a
#     mirror never scores as independent corroboration.
#   * `links` kind `same_source` means the candidate IS an existing registry row
#     (improvement under that row; a P31-owned row refuses re-onboarding);
#     `related` is dedupe-aware context only.
#   * Dimension values are ordinal 0..3 (absent = unknown → unscored, never a
#     silent default). They are ESTIMATES under `assessment.version`; a reviewer
#     may supersede them under a new version — never edit a landed version in
#     place (§20 data versioning).

schema = "acquisition-queue/1"
research_inventory = "docs/build/planning/2026-09-25-six-streams/data/source-candidates.csv"
scoring_version = "acq-score/1"

# The shared assessment header for the seed set: an engineering ESTIMATE derived
# from the CSV's declared fields (rank→G, claims_supported→R, novelty/publisher→I,
# structure→U, dates→T, jurisdiction→J, effort→E, review_status/access→A,
# sensitive exposure→S). estimated, NOT measured; supersede under a new version.
assessment = { version = "acq-seed/1", assessor = "engineering-seed (acq-seed/1 — ordinal values derived from the S5 research row fields, pending reviewer assessment)", assessed_on = 2026-09-25, measured = false }

