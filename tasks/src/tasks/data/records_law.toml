# The per-jurisdiction public-records-law reference table (§36, SIG-TASK-016).
# This table is DATA, not code (SIG-ENG-001): every jurisdiction is a reviewed
# row, so amending a statute citation or a residency flag is a data change, never
# a code change. Changes after P10.3 are VERSIONED (§20): bump `table_version` and
# add the change, never silently rewrite a landed row.
#
# WHAT IS LOAD-BEARING vs. SEED. Two fields are operationally binding and are
# asserted by the test suite: the `citation` (SIG-TASK-015 emits it, so it MUST be
# correct for the jurisdiction) and `residency_required` (SIG-TASK-016a: a true
# value refuses a non-resident filer and routes to a local one). The exactly-six
# residency-restricted states are Alabama, Arkansas, Delaware, Kentucky,
# Tennessee, and Virginia (§36 / R12-F12.26). The operational-detail fields
# (`response_deadline`, `fee_rules`, `appeal_path`) are SEED values pending the
# per-jurisdiction counsel review (RISK-P10-16, SIG-ENG-005): they are honest
# widely-documented summaries, not legal advice, and are deliberately coarse where
# a statute fixes no single number ("reasonable time"). They are versioned data so
# a counsel correction is a tracked migration.
#
# NOTE ON TOML ORDERING: every top-level key MUST appear ABOVE the first [table]
# header — otherwise TOML nests it under that table. The [jurisdictions.*] rows
# therefore come last.

# The reference table's own version, stamped onto every emitted request (§20).
table_version = "2026.09.01"

# The six residency-restricted jurisdictions (§36, SIG-TASK-016a). Named here as
# data so the operational refusal keys off a reviewed list, not a magic set buried
# in code; a test asserts each row's `residency_required` agrees with this list,
# so the two can never drift.
residency_restricted = ["AL", "AR", "DE", "KY", "TN", "VA"]

