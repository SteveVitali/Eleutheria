# The explicit coverage-gap routing table (K11 §4.1, P36.58 / R11-K13-RQ-01,
# SIG-RQ-005): predicate → presentation lane. It replaces the retired substring
# match (`_RECORDS_OBTAINABLE_MARKERS`) as the routing authority: every §32.1
# peer-class `tracked` predicate names a lane here, and the routing matrix test
# iterates the tracked sets so an uncovered predicate fails loudly.
#
# Lanes (D-K11-1, answered "as recommended"):
#   research — a public research task (the task's recorded `task_type` stands;
#              `route` names the type the table asserts for RQ-02 re-mints).
#   campaign — a per-object field gap presented as an aggregated mapping
#              campaign by (place, predicate), never an individual task.
#   metric   — coverage metrics only: the source does not publish the field and
#              there is nothing to map or request (D-K11-1's second half).
#
# `grain` is the subject grain the closing condition must match (SIG-RQ-005):
#   subject | jurisdiction. `template` names the §36 request-template family a
#   records-obtainable route drafts from.
#
# `route` values may name the RQ-02 catalog-pending types (`retention_unknown`,
#   `sharing_unknown`) — declared so the detector rewiring lands as data review
#   there, never a silent route. Today those gaps are recorded as the legacy
#   substring-driven types; the card names the real predicate regardless.
#
# Changes after this declaration are VERSIONED (§20): bump `version`.

version = "1.0.0"

# --- agency/records-obtainable gaps → the research lane ------------------------

[[route]]
predicate = "configured_retention_days"
lane = "research"
route = "retention_unknown"        # catalog-pending (RQ-02); today: missing_contract
template = "surveillance_policy"
grain = "subject"

