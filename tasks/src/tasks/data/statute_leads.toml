# The statute-seeded records-leads table (P37.14, SIG-INGEST-025a/b/c).
#
# State reporting mandates are records-acquisition LEADS, never data feeds
# (SIG-INGEST-025a): "this jurisdiction is required to hold X, therefore X is
# requestable". One [[duties]] row per registered `future_statutory_disclosure_*`
# duty named by the committed `state_alpr_statute_seed_2026.toml` duty table —
# the generator refuses to run while a seed duty lacks a leads row or a leads
# row names an unregistered duty (each statute duty produces a gap row or a
# CoverageRecord — the catalog acceptance shape).
#
# `posture` decides the output kind:
#   commenced    — the duty is in force; the mandated record is requestable
#                  → a gap row (a records-acquisition lead).
#   not_yet_due  — first reports due after `first_due`; absence before the due
#                  date is a lawful not_applicable coverage state (the registry
#                  rows' own rule) → CoverageRecord `not_applicable`.
#   contingent   — the mandate itself is unverified (a bill is not an
#                  appropriation) → CoverageRecord `not_researched`.
#
# `session`/`text_ref` carry the desk-researched statutory basis
# (SIG-INGEST-025c): session only where the registered evidence names it
# (administrative rules have no session); text_ref is the registered source's
# reviewed text URL. Desk research only — nothing here fetched at generation.
schema = "sig.statute-leads/1"
table_version = "2026.11.07.1"

