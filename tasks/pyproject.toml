[project]
name = "sig-tasks"
version = "0.0.0"
description = "SIG tasks package: the §33 research-task coordination engine."
requires-python = ">=3.11"
# The disposition→data bridge reuses inference's CoverageRecord (P09.1,
# SIG-TASK-009) rather than re-encoding the §32.1 coverage shape.
dependencies = ["sig-inference"]

[project.scripts]
sig-tasks = "tasks.cli:main"

[tool.uv.sources]
sig-inference = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tasks"]
